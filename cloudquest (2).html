M('6.1', 'Storage Fundamentals', 'File, block and object storage', {
  obj: ['Describe file, block and object storage', 'Choose a storage type for a kind of data', 'Explain durability and availability'],
  what: '<b>File storage</b> stores data in folders and files that many users can share over a network. <b>Block storage</b> splits data into fixed blocks and acts like a raw disk attached to a VM, ideal for databases and operating systems. <b>Object storage</b> stores each item as an object with an identifier (key) in a flat bucket, ideal for photos, videos and backups. <b>Durability</b> is how unlikely data is to be lost. <b>Availability</b> is how often you can access it. Data may be <b>structured</b> (tables) or <b>unstructured</b> (photos, videos).',
  ana: 'File storage is a shared filing cabinet, block storage is a hard drive inside a computer, and object storage is a huge warehouse where every box has a label.',
  why: 'Picking the right storage gives better performance and lower cost.',
  ex: 'A college keeps student photos in object storage, the exam database disk on block storage, shared department documents on file storage and yearly backups in object storage.',
  how: ['Identify the data type and how it is used.', 'Need a disk for one VM? Block.', 'Need shared folders? File.', 'Need huge amounts of unstructured data with web access? Object.'],
  tryit: 'Select each storage type to see its qualities and sample data.',
  mist: ['Object storage is not a drive you install an operating system on. Block storage is used for that.', 'Durability and availability are different things.'],
  rem: 'File is for shared folders, block is for disks, object is for large unstructured data. Durability protects against loss, availability means access.',
  quick: TF('Block storage is a good fit for a database disk.', true, 'Block storage acts like a fast raw disk.'),
  viz: {
    t: 'compare', exLabel: 'Example data', instr: 'Select each storage type and look at the example data it suits.', note: 'Match the storage type to how the data is used.',
    options: [
      { name: 'File storage', blurb: 'Folders and files shared over a network by many users.', meters: { 'Speed for databases': 2, 'Ease of sharing': 5, 'Scale to huge data': 3, 'Cost efficiency': 3 }, examples: ['Shared documents'], best: 'teams need shared folders.' },
      { name: 'Block storage', blurb: 'Fixed size blocks presented like a raw disk to a VM.', meters: { 'Speed for databases': 5, 'Ease of sharing': 1, 'Scale to huge data': 2, 'Cost efficiency': 2 }, examples: ['Database disk', 'Operating system disk'], best: 'a VM needs fast, low latency disk.' },
      { name: 'Object storage', blurb: 'Objects with keys stored in buckets, accessed over the web.', meters: { 'Speed for databases': 1, 'Ease of sharing': 4, 'Scale to huge data': 5, 'Cost efficiency': 5 }, examples: ['Photos', 'Backups', 'Videos'], best: 'you store large amounts of unstructured data.' }]
  },
  chal: {
    title: 'Match Data to Storage', intro: 'Which storage type fits?', qs: [
      MT('Match each data example with the best storage type.', [['Photo archive with millions of images', 'Object storage'], ['Disk for a database server', 'Block storage'], ['Shared department documents in folders', 'File storage']], 'Think about how the data is accessed.'),
      ID('Select every example of unstructured data.', [['Photos', true], ['Videos', true], ['A table of student IDs and names', false], ['Scanned PDFs', true]], 'Tables are structured. Media and scans are unstructured.')]
  },
  quiz: [
    Q('Which storage type stores data as objects in buckets?', 'Object storage', ['Block storage', 'File storage', 'RAM'], 'Object storage uses buckets and keys.'),
    Q('What is durability?', 'How unlikely stored data is to be lost', ['How fast a disk spins', 'How many users log in', 'The color of the drive'], 'High durability protects against loss.'),
    Q('Which is best for shared folders used by a team?', 'File storage', ['Block storage only', 'Object storage only', 'CPU cache'], 'File storage supports shared file systems.', 'i')]
});

M('6.2', 'Object Storage', 'Buckets, objects and keys', {
  obj: ['Explain buckets, objects and keys', 'Upload, list and delete objects', 'Understand permissions and versioning'],
  what: 'In <b>object storage</b> a <b>bucket</b> is a container with a unique name. An <b>object</b> is a file plus its metadata. Each object has an <b>object key</b>, its name inside the bucket, such as reports/week1.txt. The slash makes it look like a folder, but the namespace is flat. You <b>upload</b> and <b>download</b> objects over the network, control <b>access permissions</b> (private by default is safest), and can enable <b>versioning</b> to keep older versions when an object is replaced.',
  ana: 'A bucket is like a storage locker room and each object key is the label on a box. Analogy limit: the folders you see are only part of the label.',
  why: 'Object storage is cheap, durable and scalable, which is why it holds backups, media and data for websites.',
  ex: 'The college website stores lecture videos in a bucket. Students can only download them if the bucket permissions allow it.',
  how: ['Create a bucket with a globally unique name.', 'Upload an object with a key.', 'List objects to see what is inside.', 'Control who can read or write.', 'Enable versioning to recover from mistakes.'],
  tryit: 'Create your own simulated bucket, upload files, delete one and watch storage usage. Your bucket is saved in this browser.',
  mist: ['A public bucket can expose private files. Keep buckets private unless you must share.', 'Object storage folders are just parts of the key. There is no real directory tree.'],
  rem: 'Buckets hold objects identified by keys. Keep them private by default and use versioning to protect against accidental overwrites.',
  quick: TF('An object key is the name of an object inside a bucket.', true, 'The key identifies the object.'),
  viz: { t: 'bucket', instr: 'Create a bucket, then upload at least two objects. Try deleting one and uploading the same key twice.' },
  chal: {
    title: 'Bucket Basics', intro: 'Check your storage vocabulary.', qs: [
      MT('Match each term with its meaning.', [['Bucket', 'Container for objects with a unique name'], ['Object', 'A file and its metadata'], ['Object key', 'The name of the object in the bucket'], ['Versioning', 'Keeps older versions when an object is replaced']], 'These words appear in every cloud provider.'),
      SC('Scenario: someone accidentally overwrites an important report in a bucket. Which feature would let you recover the old one?', 'Versioning', ['A bigger keyboard', 'Making the bucket public', 'Renaming the bucket'], 'Versioning keeps previous versions.')]
  },
  quiz: [
    Q('What is the safest default access setting for a new bucket?', 'Private', ['Public to everyone', 'Deleted', 'Open to guests'], 'Only allow access you intend.'),
    Q('What identifies an object inside a bucket?', 'Its object key', ['Its monitor', 'Its CPU', 'The bucket color'], 'Keys are the names of objects.'),
    Q('What happens when you upload an object with an existing key and versioning is off?', 'It overwrites the old object', ['It creates a second copy automatically', 'It deletes the bucket', 'It becomes public'], 'Without versioning the old data is replaced.', 'i')]
});

M('7.1', 'What Is a Database?', 'Organised, searchable data', {
  obj: ['Explain why databases are used', 'Identify tables, records, columns and primary keys', 'Compare SQL and NoSQL at a basic level'],
  what: 'A <b>database</b> is an organised collection of data that programs can store, search and update quickly and safely. In a <b>relational</b> database, data is in <b>tables</b>. Each <b>column</b> is one attribute (like name) and each <b>record</b> (row) is one item (like one student). A <b>primary key</b> is a column whose value is unique for each record, such as student_id. <b>SQL</b> is the language used to query relational databases. <b>NoSQL</b> databases use other shapes, such as documents, and suit flexible or very large data.',
  ana: 'A database table is like a well organised spreadsheet. Analogy limit: databases enforce rules, handle many users at once and can protect data from corruption.',
  why: 'Nearly every application needs to remember things, such as accounts, orders and attendance. Databases do this reliably at scale.',
  ex: 'The college attendance system stores each student as a record in a Students table with a unique student_id.',
  how: ['Define a table with columns.', 'Add records, each with a unique primary key.', 'Search records with queries.', 'Update or delete records safely.'],
  tryit: 'Add student records, search them, and try to add a duplicate ID to see the primary key rule work.',
  mist: ['A database is not the same as a database server. The server is the software and computer that runs it.', 'Names are not good primary keys because two people can share a name. Use a unique ID.'],
  rem: 'Databases store structured data in tables of records. A primary key uniquely identifies each record. SQL queries relational data, NoSQL offers flexible models.',
  quick: TF('A primary key value can be repeated in two records.', false, 'A primary key must be unique.'),
  viz: { t: 'studentdb', instr: 'Add records, search them, delete one and try a duplicate ID. All data is simulated and kept only on this page.' },
  chal: {
    title: 'Database Vocabulary', intro: 'Name the parts of a table.', qs: [
      MT('Match each term with its meaning.', [['Table', 'A collection of related records'], ['Column', 'One attribute, such as name'], ['Record', 'One row, such as one student'], ['Primary key', 'A unique identifier for each record']], 'Tables, records and keys are the basic vocabulary.'),
      SC('Scenario: two students are both named Rahul Sharma. Which column should be the primary key?', 'student_id', ['name', 'course', 'year'], 'Names can repeat. An ID is unique.')]
  },
  quiz: [
    Q('What is one row in a table called?', 'A record', ['A column', 'A schema', 'A bucket'], 'Rows are records.'),
    Q('What does SQL do?', 'Queries relational databases', ['Cools a data center', 'Draws diagrams', 'Encrypts a hard drive'], 'SQL is the standard query language.'),
    Q('Why are databases used instead of plain text files for big systems?', 'They search, update and protect data reliably for many users', ['They do not need any storage', 'They remove the need for servers', 'They make data public'], 'Reliability and speed at scale.', 'i')]
});

M('7.2', 'Managed Databases', 'Who runs the database?', {
  obj: ['Compare self-managed and managed databases', 'Name tasks like backups and patching', 'Explain the shared responsibility'],
  what: 'A <b>self-managed</b> database runs on a VM you administer, so you install, configure, patch and back it up. A <b>managed database</b> is a cloud service where the provider handles the underlying servers, operating system, database software patching, backups and often <b>high availability</b>. You still design the schema, write queries, control access and decide on settings like retention.',
  ana: 'Cooking at home versus a restaurant kitchen: at home you do everything, in a restaurant the staff handle equipment and cleaning while you choose from the menu.',
  why: 'Managed databases save time and reduce mistakes, but offer less low level control.',
  ex: 'The college moves its student database from a self-managed VM to a managed database. Patching and nightly backups now happen automatically.',
  how: ['Decide how much control you need.', 'Self-managed: you own tasks like patching and backups.', 'Managed: the provider automates them.', 'In both cases you still control data and access.'],
  tryit: 'Switch between deployments and see who owns each task.',
  mist: ['Managed does not mean you have no responsibility. You still manage your data, users and queries.', 'Managed services may not allow every custom setting.'],
  rem: 'Managed databases hand routine operations such as patching and backups to the provider. You keep responsibility for your data and access.',
  quick: TF('With a managed database you never need to manage user access.', false, 'You still control who can access your data.'),
  viz: {
    t: 'resp', instr: 'Switch between the two options and compare the tasks.', layers: ['Schema and queries', 'Data content and access', 'Database software patching', 'Backups', 'Operating system', 'Hardware and network', 'High availability setup'], caveat: 'Exact features vary by service.',
    models: [{ name: 'Self-managed on a VM', who: ['you', 'you', 'you', 'you', 'you', 'prov', 'you'], note: 'You do nearly all administration work. The provider only manages the physical hardware and network.' },
    { name: 'Managed database', who: ['you', 'you', 'prov', 'shared', 'prov', 'prov', 'shared'], note: 'The provider automates patching, the operating system and hardware. Backups and availability are shared because you configure retention and options.' }]
  },
  chal: {
    title: 'Who Does the Work?', intro: 'Choose the right deployment.', qs: [
      SC('Scenario: a small team has no database administrator and wants automatic backups and patching. Which option fits?', 'A managed database', ['A self-managed database on a VM', 'A paper notebook', 'A router'], 'Managed services automate routine operations.'),
      SC('Scenario: a team needs a rarely used custom database extension the managed service does not support. Which option fits?', 'Self-managed database on a VM', ['A managed database', 'SaaS only', 'None'], 'Self-managed gives full control.')]
  },
  quiz: [
    Q('Who patches the database software in a managed database?', 'The provider, usually automatically', ['Only the student', 'The browser', 'Nobody ever'], 'Patching is part of the managed service.'),
    Q('What do you always remain responsible for?', 'Your data and who can access it', ['The data center cooling', 'The power grid', 'The physical hardware'], 'Data and access belong to the customer.'),

});

/* ---------- LEVEL 8 ---------- */
M('8.1', 'Virtual Cloud Networks', 'Your private network in the cloud', {
  obj: ['Define a virtual network, subnet, route table and gateways', 'Create valid non-overlapping subnets', 'Explain internet gateway and NAT'],
  what: 'A <b>virtual network</b> (VNet in Azure, VCN in Oracle Cloud) is your private, isolated network in the cloud with an address range in CIDR form. You divide it into <b>subnets</b>. A <b>route table</b> decides where traffic goes. An <b>internet gateway</b> allows resources with public addresses to connect to and be reached from the internet. A <b>NAT gateway</b> lets private resources start outbound connections while blocking unsolicited inbound traffic. <b>Security rules</b> allow or deny traffic by port and source.',
  ana: 'A virtual network is like a gated campus, subnets are buildings, and gateways are the campus doors. Analogy limit: everything here is software defined.',
  why: 'Network design decides what can reach what. Good design keeps databases private and only exposes what must be public.',
  ex: 'The college creates a virtual network with a public subnet for its web server and a private subnet for the student database.',
  how: ['Choose a virtual network CIDR such as 10.0.0.0/16.', 'Carve non-overlapping subnets from it.', 'Attach a route to an internet gateway for public subnets.', 'Use NAT for private subnets that need outbound access only.', 'Apply security rules.'],
  tryit: 'Build a virtual network, add a public and a private subnet, place instances and run the connectivity tests. Invalid or overlapping ranges are rejected.',
  mist: ['NAT and an internet gateway are different. An internet gateway allows two way connections. NAT allows outbound only.', 'Overlapping ranges cause routing problems, so cloud networks reject them.'],
  rem: 'A virtual network holds subnets. Public subnets route to an internet gateway, private subnets can use NAT for outbound access, and security rules control ports.',
  quick: TF('A NAT gateway allows the internet to start connections to private resources.', false, 'NAT is for outbound connections from private resources.'),
  viz: { t: 'cloudnet', instr: 'Work top to bottom: create the network, add a public and a private subnet, add instances, then run tests.' },
  chal: {
    title: 'Cloud Network Concepts', intro: 'Sort out gateways and subnets.', qs: [
      MT('Match each component with its job.', [['Virtual network', 'Your private network in the cloud'], ['Subnet', 'A range of addresses inside the network'], ['Route table', 'Decides where traffic is sent'], ['Internet gateway', 'Allows two way internet access for public resources'], ['NAT gateway', 'Lets private resources make outbound connections only']], 'Each piece has one clear job.'),
      SC('Scenario: a private database server needs to download security updates but must not be reachable from the internet. What helps?', 'A NAT gateway', ['An internet gateway with a public IP', 'Opening all ports', 'Deleting the subnet'], 'NAT allows outbound access without inbound exposure.')]
  },
  quiz: [
    Q('Which valid subnet fits inside 10.0.0.0/16?', '10.0.1.0/24', ['192.168.1.0/24', '10.1.0.0/16', '172.16.0.0/12'], 'The subnet range must be inside the virtual network range.'),
    Q('Why must subnets not overlap?', 'Traffic could not be routed unambiguously', ['They would cost nothing', 'They would disappear', 'Overlap makes them faster'], 'Each address must belong to one subnet.'),
    Q('Which component lets a public subnet reach the internet?', 'Internet gateway', ['Monitor', 'SSD', 'CPU'], 'The route to the internet gateway enables it.', 'i')]
});

M('8.2', 'Public vs Private Subnets', 'A secure web architecture', {
  obj: ['Describe public and private subnets', 'Trace traffic through a secure design', 'Explain why databases stay private'],
  what: 'A <b>public subnet</b> has a route to an internet gateway, so resources with public addresses can be reached from the internet. A <b>private subnet</b> has no direct route from the internet. A common secure design puts a <b>load balancer</b> in the public subnet, the <b>application server</b> in a private subnet and the <b>database</b> in another private subnet. Traffic flows only from the load balancer to the app to the database, and security rules enforce that.',
  ana: 'Reception (public), staff offices (private) and the vault (most private). Visitors only meet reception.',
  why: 'Reducing what is exposed to the internet reduces the chance of attack.',
  ex: 'Students visit the exam portal through a load balancer. They never connect to the database directly, which is reachable only from the app server.',
  how: ['The user reaches the public load balancer over HTTPS.', 'The load balancer forwards to the private app server.', 'The app server queries the private database.', 'Answers return along the same path.', 'A direct attempt to the database is blocked.'],
  tryit: 'Play the normal request, then the attacker scenario, and see where the traffic stops.',
  mist: ['Private does not mean invulnerable. You still need patches, good passwords and correct rules.', 'Putting everything in a public subnet is convenient but risky.'],
  rem: 'Expose only what must be public. Keep application servers and databases in private subnets behind a load balancer.',
  quick: TF('A database should normally sit in a private subnet.', true, 'This keeps it away from direct internet access.'),
  viz: {
    t: 'steps', w: 720, h: 220, optLabel: 'Scenario', alt: 'Secure web architecture traffic flow', instr: 'Pick a scenario and press Start.',
    nodes: [{ id: 'net', label: 'Internet user', x: 70, y: 110 }, { id: 'lb', label: 'Load balancer', x: 255, y: 110, sub: 'public subnet' }, { id: 'app', label: 'App server', x: 440, y: 110, sub: 'private subnet' }, { id: 'db', label: 'Database', x: 640, y: 110, sub: 'private subnet' }],
    options: [
      { label: 'A student visits the site', steps: [{ from: 'net', to: 'lb', pkt: 'HTTPS', text: 'The student connects to the load balancer over HTTPS. This is the only public entry point.' }, { from: 'lb', to: 'app', pkt: 'Forward', text: 'The load balancer forwards the request to the app server in the private subnet.' }, { from: 'app', to: 'db', pkt: 'Query', text: 'The app server queries the database, which is allowed by a security rule.' }, { from: 'db', to: 'app', pkt: 'Data', text: 'The database returns the data to the app server.' }, { from: 'app', to: 'lb', pkt: 'Page', text: 'The app server sends the page back to the load balancer.' }, { from: 'lb', to: 'net', pkt: 'Response', text: 'The load balancer returns the response to the student.' }] },
      { label: 'An attacker tries the database directly', steps: [{ from: 'net', to: 'db', frac: 0.55, blocked: true, pkt: 'Blocked', text: 'The attacker tries to connect straight to the database. There is no route from the internet to the private subnet, so the attempt fails.' }, { from: 'net', to: 'lb', pkt: 'Probe', text: 'The attacker can only reach the load balancer, which only accepts web traffic.' }] }]
  },
  chal: {
    title: 'Secure by Design', intro: 'Spot the safe choices.', qs: [
      ID('Select every design choice that improves security.', [['Database in a private subnet', true], ['Load balancer as the only public entry point', true], ['Opening database port 3306 to the whole internet', false], ['Security rules allowing only needed ports', true]], 'Reduce exposure and allow only what is needed.'),
      SC('Scenario: the app server must reach the database but the internet must not. What does this require?', 'A private subnet with a rule allowing app server to database traffic', ['A public IP on the database', 'No security rules', 'Putting the database on the public subnet'], 'Allow only the needed path.')]
  },
  quiz: [
    Q('What makes a subnet public?', 'A route to an internet gateway', ['A red label', 'A bigger CIDR', 'A faster CPU'], 'The routing decides it.'),
    Q('Where should the database go in this design?', 'Private subnet', ['Public subnet with open ports', 'Inside the browser', 'On the switch'], 'Keep data stores private.'),
    Q('What is the main job of the load balancer here?', 'Receive public traffic and forward it to private servers', ['Store the data', 'Encrypt the disk', 'Run SQL'], 'It is the public entry point.', 'i')]
});

M('8.3', 'Load Balancing and Scalability', 'Sharing traffic across servers', {
  obj: ['Explain a load balancer and health checks', 'Compare horizontal and vertical scaling', 'Observe traffic distribution'],
  what: 'A <b>load balancer</b> spreads incoming requests across several <b>backend servers</b>. It runs <b>health checks</b> and stops sending traffic to servers that are down. <b>Horizontal scaling</b> (scale out) adds more servers. <b>Vertical scaling</b> (scale up) makes one server bigger. Horizontal scaling also improves availability, because one server can fail without taking the site down.',
  ana: 'Supermarket checkout lines: a store manager directing customers to open counters (load balancer), opening more counters (scale out) or training a faster cashier (scale up).',
  why: 'Popular services handle thousands of users at once. One server would be a single point of failure and a bottleneck.',
  ex: 'During online admissions, a load balancer spreads applicants across four servers. If one crashes, the other three keep serving.',
  how: ['Clients send requests to the load balancer address.', 'The load balancer picks a healthy backend, here by round robin.', 'Unhealthy servers are skipped.', 'Add servers to increase capacity.'],
  tryit: 'Send requests, add servers, stop a server and scale one up. Watch distribution and failures.',
  mist: ['Bigger is not the same as more available. One huge server is still one point of failure.', 'A load balancer needs backends that are actually healthy.'],
  rem: 'Load balancers distribute traffic and avoid unhealthy servers. Scale out adds servers, scale up enlarges a server.',
  quick: TF('Horizontal scaling means adding more servers.', true, 'Scale out adds instances.'),
  viz: { t: 'lb', instr: 'Send requests. Then add a server, stop a server and send more. Try auto traffic too.' },
  chal: {
    title: 'Scale Right', intro: 'Choose the scaling approach.', qs: [
      MT('Match each term with its meaning.', [['Horizontal scaling', 'Adding more servers'], ['Vertical scaling', 'Making one server bigger'], ['Health check', 'Test that decides if a server gets traffic'], ['Load balancer', 'Spreads requests across servers']], 'These words appear in every cloud course.'),
      SC('Scenario: a server fails and the site stays online because other servers continue. Which feature helped most?', 'Load balancing across several healthy backends', ['A bigger monitor', 'A longer cable', 'Deleting logs'], 'Redundancy plus health checks.')]
  },
  quiz: [
    Q('What does a load balancer do when a backend fails a health check?', 'Stops sending it traffic', ['Sends it all traffic', 'Deletes the site', 'Turns off DNS'], 'Unhealthy servers are skipped.'),
    Q('Which is scaling up?', 'Moving to a larger VM size', ['Adding a second VM', 'Adding a load balancer', 'Adding a subnet'], 'Vertical scaling makes one server bigger.'),
    Q('Which scaling improves availability the most?', 'Horizontal scaling', ['Vertical scaling only', 'Neither', 'Cooling only'], 'Multiple servers remove single points of failure.', 'i')]
});

/* ---------- LEVEL 9 ---------- */
M('9.1', 'Identity and Access Management', 'Who are you and what may you do?', {
  obj: ['Separate authentication and authorization', 'Define user, group, role, policy', 'Apply least privilege'],
  what: '<b>Authentication</b> proves who you are, for example with a password and a second factor. <b>Authorization</b> decides what you are allowed to do after you are known. A <b>user</b> is an identity, a <b>group</b> is a set of users, a <b>role</b> is a bundle of permissions, and a <b>policy</b> defines allowed actions. <b>Least privilege</b> means giving only the permissions needed to do a job and nothing more. Requests are denied by default unless something allows them.',
  ana: 'A hotel key card: the front desk checks your identity (authentication), and the card opens only your room and the gym (authorization).',
  why: 'Most cloud breaches involve too much access or stolen credentials. Careful access control limits the damage.',
  ex: 'In the college system, students can read course slides, teachers can write grades, and only administrators can manage access.',
  how: ['A user signs in (authentication).', 'The user requests an action on a resource.', 'The system checks role assignments and policies (authorization).', 'The request is allowed or denied with a reason.'],
  tryit: 'Assign roles, sign in as different users and test requests. Meet all five goals using least privilege.',
  mist: ['Authentication and authorization are not the same thing. Being signed in does not mean you may do everything.', 'Giving everyone Owner is easy but dangerous.'],
  rem: 'Authentication proves identity, authorization grants permissions, and least privilege limits access to what is required.',
  quick: TF('Authorization proves who you are.', false, 'That is authentication. Authorization decides what you may do.'),
  viz: { t: 'iam', instr: 'Assign roles to users, then sign in and send requests. Meet every goal without giving extra permissions.' },
  chal: {
    title: 'Access Control', intro: 'Test your IAM vocabulary.', qs: [
      MT('Match each term with its meaning.', [['Authentication', 'Proving who you are'], ['Authorization', 'Deciding what you may do'], ['Role', 'A bundle of permissions'], ['Least privilege', 'Only the access needed for the job']], 'Keep authentication and authorization separate.'),
      SC('Scenario: a student only needs to read course slides but has been given the Owner role on the whole subscription. What principle is broken?', 'Least privilege', ['Encryption at rest', 'Load balancing', 'Subnetting'], 'Too much access increases risk.')]
  },
  quiz: [
    Q('What is the default answer to an access request with no matching permission?', 'Deny', ['Allow', 'Ask the router', 'Ignore it'], 'Secure systems deny by default.'),
    Q('Multi-factor authentication improves...', 'Authentication strength', ['Disk speed', 'Subnet size', 'DNS caching'], 'It requires more than a password.'),
    Q('A group is...', 'A set of users managed together', ['A type of subnet', 'A cooling unit', 'A file'], 'Groups simplify assigning permissions.', 'i')]
});

M('9.2', 'Encryption', 'Keeping data unreadable to others', {
  obj: ['Define plaintext, ciphertext, encryption and decryption', 'Tell encryption from encoding', 'Explain at rest and in transit'],
  what: '<b>Plaintext</b> is readable data. <b>Encryption</b> transforms it into unreadable <b>ciphertext</b> using an algorithm and a <b>key</b>. <b>Decryption</b> reverses it with the right key. <b>Encryption at rest</b> protects stored data, such as a disk. <b>Encryption in transit</b> protects data moving over a network, for example with <b>TLS</b> in HTTPS. <b>Key management</b> means protecting and rotating keys. Encoding, like Base64, only changes format and is <b>not</b> security.',
  ana: 'A locked box: the key opens it. If someone steals the box without the key, they cannot read the contents. Analogy limit: real encryption uses mathematics, not physical locks.',
  why: 'Encryption protects data if a disk is stolen or traffic is intercepted.',
  ex: 'When a student pays fees online, HTTPS encrypts the payment details in transit, and the database encrypts stored records at rest.',
  how: ['Choose an algorithm and a key.', 'Encrypt the plaintext into ciphertext.', 'Store or send the ciphertext.', 'The receiver decrypts with the correct key.'],
  tryit: 'Encrypt a message with a simple teaching cipher, try a wrong key, and compare it with Base64 encoding. Remember it is a simulation.',
  mist: ['Base64 and other encodings are not encryption. Anyone can reverse them.', 'Losing or leaking the key defeats encryption.'],
  rem: 'Encryption needs a key. Protect data at rest and in transit, and protect the keys as carefully as the data.',
  quick: TF('Base64 encoding is a secure form of encryption.', false, 'It is only encoding and needs no key to reverse.'),
  viz: { t: 'encrypt', instr: 'Enter text, choose a key, encrypt, then try decrypting with the wrong key. Also try Base64 encoding.' },
  chal: {
    title: 'Encryption Ideas', intro: 'Clarify the terms.', qs: [
      MT('Match each term with its meaning.', [['Plaintext', 'Readable original data'], ['Ciphertext', 'Encrypted, unreadable data'], ['Encryption at rest', 'Protecting stored data'], ['Encryption in transit', 'Protecting data moving over a network']], 'Two states: at rest and in transit.'),
      ID('Select every true statement.', [['Encryption needs a key', true], ['Base64 is encryption', false], ['TLS protects data in transit', true], ['A leaked key can expose the data', true]], 'Encoding is not encryption.')]
  },
  quiz: [
    Q('What does HTTPS use to protect traffic in transit?', 'TLS', ['DNS only', 'RAM', 'A switch'], 'TLS encrypts the connection.'),
    Q('What is needed to decrypt ciphertext?', 'The correct key', ['A faster CPU', 'A bigger monitor', 'A public IP'], 'The key reverses the process.'),
    Q('Which protects a stolen laptop disk?', 'Encryption at rest', ['Encryption in transit only', 'A longer cable', 'DNS'], 'Stored data stays unreadable without the key.', 'i')]
});

M('9.3', 'Cloud Security Practices', 'Habits that keep systems safe', {
  obj: ['List core cloud security practices', 'Spot insecure configurations', 'Explain secrets management'],
  what: 'Good security is a set of habits. Use <b>strong authentication</b> and <b>MFA</b>. Apply <b>least privilege</b>. Use <b>secure configuration</b>: keep storage private, close unneeded ports and patch systems. Keep tested <b>backups</b>. Turn on <b>monitoring</b> and alerts. Use <b>secrets management</b>: keep passwords and keys in a protected vault instead of writing them in code.',
  ana: 'Locking the door, checking the windows, keeping a spare key in a safe and having an alarm. No single lock is enough.',
  why: 'Most cloud incidents come from misconfiguration and weak access rather than from the cloud itself.',
  ex: 'A student pushes code with a database password to a public repository. Attackers find it within minutes. A secrets vault would have avoided this.',
  how: ['Turn on MFA for administrators.', 'Give minimum permissions.', 'Keep data stores private.', 'Store secrets in a vault.', 'Back up and test restores.', 'Monitor and alert.'],
  tryit: 'Toggle the settings in the security lab and get a perfect score by choosing the secure options.',
  mist: ['Security is not a product you buy once. It is ongoing.', 'Backups you have never tested are only a hope.'],
  rem: 'MFA, least privilege, private by default, secrets in a vault, tested backups and monitoring together reduce risk.',
  quick: TF('Database passwords should be written directly in source code.', false, 'Use a secrets manager.'),
  viz: { t: 'seclab', instr: 'Turn each setting on or off. Aim for a score of 100 by enabling good practices and disabling risky ones.' },
  chal: {
    title: 'Secure or Insecure?', intro: 'Identify the risky configurations.', qs: [
      ID('Scenario: a college cloud project. Select every INSECURE configuration.', [['Storage container open to the public', true], ['Admin accounts without MFA', true], ['Passwords kept in a secrets vault', false], ['SSH open to the whole internet', true], ['Logs monitored with alerts', false]], 'Selected items are the risks.'),
      SC('Scenario: an intern needs to view one report. What is the best access to give?', 'Read only access to that report', ['Owner on the whole subscription', 'Shared admin password', 'No password needed'], 'Least privilege.')]
  },
  quiz: [
    Q('What does MFA add?', 'A second proof of identity', ['More storage', 'Faster disks', 'A new region'], 'It reduces the risk of stolen passwords.'),
    Q('Where should secrets be kept?', 'In a secrets management service', ['In public code', 'On sticky notes', 'In chat messages'], 'Vaults control access.'),
    Q('Why test backups?', 'To be sure they can actually be restored', ['To fill the disk', 'To slow the system', 'To disable monitoring'], 'A failed restore is a bad surprise.', 'i')]
});
/* ---------- LEVEL 10 ---------- */
M('10.1', 'Cloud Pricing Basics', 'Paying for what you use', {
  obj: ['Explain pay-as-you-go pricing', 'Name the main cost drivers', 'Use budgets and alerts'],
  what: 'With <b>pay-as-you-go</b> pricing you are billed for the resources you consume. The main cost drivers are <b>compute</b> (how many VMs, how big, for how many hours), <b>storage</b> (how much data and what type) and <b>network</b> (often data leaving the cloud, called egress). A <b>budget</b> sets a spending limit, and <b>alerts</b> warn you before you cross it. Costs are estimated before deployment and reviewed regularly.',
  ana: 'A phone or electricity bill: use more, pay more. Analogy limit: cloud prices vary by service, size, region and commitment.',
  why: 'Cloud makes it easy to create resources, and just as easy to forget them. Cost awareness prevents surprise bills.',
  ex: 'A student leaves a large VM running all month by mistake. A budget alert at 80 percent warns the team on day 20.',
  how: ['List the resources you plan to use.', 'Estimate quantity and time.', 'Multiply by unit prices.', 'Set a budget and alerts.', 'Review usage and delete what you do not need.'],
  tryit: 'Adjust the resource sliders and budget. Prices are illustrative and are not any real provider prices.',
  mist: ['Running is not the only cost. Stopped resources can still cost for storage and IP addresses.', 'Cheapest on paper is not always cheapest in practice. Consider effort and risk.'],
  rem: 'Cloud bills depend on compute, storage and network usage. Use estimates, budgets and alerts, and delete unused resources.',
  quick: TF('Data leaving the cloud can add to the bill.', true, 'Network egress is often charged.'),
  viz: {
    t: 'budget', provider: 'cloud provider', instr: 'Move the sliders and watch the monthly total. Set a budget and watch the alert change.', budget: 300,
    rows: [{ label: 'Virtual machines (hours)', unit: 'hour', rate: 0.05, min: 0, max: 1500, step: 10, def: 720 }, { label: 'Object storage', unit: 'GB', rate: 0.02, min: 0, max: 2000, step: 10, def: 500 }, { label: 'Data leaving the cloud', unit: 'GB', rate: 0.09, min: 0, max: 1000, step: 10, def: 100 }, { label: 'Managed database (hours)', unit: 'hour', rate: 0.12, min: 0, max: 750, step: 10, def: 300 }]
  },
  chal: {
    title: 'Cost Sense', intro: 'Think like a cloud cost owner.', qs: [
      MT('Match each cost driver with its meaning.', [['Compute', 'Charges for VM size and running time'], ['Storage', 'Charges for how much data you keep'], ['Network egress', 'Charges for data leaving the cloud'], ['Budget alert', 'A warning before spending passes a limit']], 'Four ideas to remember.'),
      SC('Scenario: a project finished last month but its VM and disks are still running. What should the team do?', 'Delete unused resources and review budgets', ['Ignore it', 'Add more VMs', 'Turn off alerts'], 'Unused resources keep costing money.')]
  },
  quiz: [
    Q('What does pay as you go mean?', 'You pay for the resources you use', ['You pay once forever', 'Everything is free', 'You pay only for hardware'], 'Usage based billing.'),
    Q('What is the purpose of a budget alert?', 'Warn before costs exceed a limit', ['Increase spending', 'Speed up the CPU', 'Create a subnet'], 'It helps prevent surprises.'),
    Q('Which is usually NOT a direct cost driver?', 'The color of your monitor', ['VM hours', 'Stored data', 'Data leaving the cloud'], 'Colors of local hardware do not affect the bill.', 'i')]
});

M('10.2', 'Scalability and Elasticity', 'Handling changing demand', {
  obj: ['Define scalability and elasticity', 'Compare vertical and horizontal scaling', 'Match capacity to demand'],
  what: '<b>Scalability</b> is the ability of a system to handle more load by adding resources. <b>Elasticity</b> is scaling up and down automatically as demand changes, so you only pay for what you need. <b>Vertical scaling</b> makes a machine bigger, and <b>horizontal scaling</b> adds more machines. <b>Autoscaling</b> rules add or remove capacity based on measurements such as CPU use.',
  ana: 'An elastic waistband stretches when needed and returns after. Analogy limit: cloud elasticity reacts within minutes, not instantly.',
  why: 'Demand changes by hour and by event. Too little capacity loses users, too much wastes money.',
  ex: 'On results day, thousands of students open the results website at once. The site adds servers for a few hours and then removes them.',
  how: ['Measure load.', 'Set rules such as add a server when usage passes 80 percent.', 'Capacity grows during the spike.', 'Capacity shrinks after the spike.'],
  tryit: 'Start the simulation and add servers by hand. Then restart and try autoscaling. Compare dropped requests and cost.',
  mist: ['Scalable and elastic are not the same. Scalable can grow. Elastic also shrinks automatically.', 'Autoscaling has a delay, so extreme sudden spikes can still cause trouble.'],
  rem: 'Scalability adds capacity. Elasticity adds and removes capacity automatically to follow demand.',
  quick: TF('Elasticity means capacity can shrink as well as grow with demand.', true, 'Elasticity adjusts both ways.'),
  viz: { t: 'spike', instr: 'Press Start and add servers by hand to keep capacity above demand. Then try again with autoscaling on.' },
  chal: {
    title: 'Scale the Spike', intro: 'Handle demand wisely.', qs: [
      MT('Match each term with its meaning.', [['Scalability', 'Ability to handle more load by adding resources'], ['Elasticity', 'Automatic scaling up and down with demand'], ['Vertical scaling', 'Making a machine bigger'], ['Horizontal scaling', 'Adding more machines']], 'Elasticity includes shrinking again.'),
      SC('Scenario: traffic is very high only on the results day each year. Which approach saves the most money?', 'Autoscale up for the day and back down after', ['Run the peak capacity all year', 'Never scale', 'Turn off the site'], 'Elastic capacity avoids paying for idle servers.')]
  },
  quiz: [
    Q('What is autoscaling?', 'Adding or removing capacity automatically based on rules', ['Encrypting a disk', 'Changing a domain name', 'Cleaning a data center'], 'It follows demand.'),
    Q('What is the downside of too little capacity?', 'Slow or failed requests', ['Lower bills always', 'Better security', 'More RAM'], 'Users see errors.'),
    Q('What is the downside of far too much capacity?', 'Paying for idle resources', ['Loss of DNS', 'Broken keyboards', 'Lost IP addresses'], 'Idle capacity costs money.')]
});

/* ---------- LEVEL 11 ---------- */
M('11.1', 'High Availability', 'Keeping the website online', {
  obj: ['Define availability and redundancy', 'Find single points of failure', 'Keep a service online during a failure'],
  what: '<b>Availability</b> is the share of time a service is working. <b>Redundancy</b> means having spare components so that a failure does not stop the service. A <b>single point of failure</b> is a part whose failure brings everything down. <b>Fault tolerance</b> means the system continues to work despite failures. High availability comes from running multiple copies, spreading them across independent locations and using load balancers with health checks.',
  ana: 'A plane with more than one engine. If one fails, the flight continues. Analogy limit: software copies must be kept in sync.',
  why: 'Downtime costs money and trust, especially for exams, payments or emergency services.',
  ex: 'The online exam portal runs on three servers. One crashes during an exam, and students continue without noticing.',
  how: ['Find components that would stop everything if they failed.', 'Add redundant copies.', 'Place copies in separate servers, racks or zones.', 'Use a load balancer to route around failures.'],
  tryit: 'Deploy app copies on several servers, then fail one server and see if the website stays online.',
  mist: ['Two copies on the same physical server share the same fate. Spread them out.', 'Availability is not perfect. Even good designs can fail, so aim for high rather than infinite.'],
  rem: 'Remove single points of failure with redundant copies in separate locations behind a load balancer.',
  quick: TF('A single point of failure is a component whose failure stops the whole service.', true, 'Redundancy removes it.'),
  viz: { t: 'azsim', zoneWord: 'server', instr: 'Place app copies on servers, then fail a server. The site is online if a healthy copy remains.', regions: [{ name: 'Data center row', note: 'Three physical servers', zones: ['Server 1', 'Server 2', 'Server 3'] }] },
  chal: {
    title: 'Find the Weak Point', intro: 'Think about failure.', qs: [
      MT('Match each term with its meaning.', [['Redundancy', 'Spare components ready to take over'], ['Single point of failure', 'One part whose failure stops everything'], ['Availability', 'Share of time a service works'], ['Fault tolerance', 'Continuing to work despite a failure']], 'Design so no single part matters.'),
      SC('Scenario: a site has three web servers but only one database server. Which is the likely single point of failure?', 'The database server', ['The web servers', 'The users', 'The browser'], 'Only one copy of the database exists.')]
  },
  quiz: [
    Q('What removes a single point of failure?', 'Redundant components', ['A smaller server', 'Fewer backups', 'A bigger monitor'], 'Spare parts provide continuity.'),
    Q('Why place copies on separate servers?', 'A failure of one server does not affect the others', ['To use more power', 'To slow the site', 'Because DNS requires it'], 'Independent failure domains.'),
    Q('What does a load balancer health check do?', 'Detect failed servers so traffic avoids them', ['Delete servers', 'Encrypt data', 'Rename the site'], 'Traffic is redirected.', 'i')]
});

M('11.2', 'Backup, RPO and RTO', 'Preparing for disasters', {
  obj: ['Explain backup, recovery and disaster recovery', 'Define RPO and RTO', 'Tune a plan to meet targets'],
  what: 'A <b>backup</b> is a copy of data that can be restored after loss or damage. <b>Disaster recovery</b> (DR) is the plan and tools to restore service after a major event. <b>RPO</b> (Recovery Point Objective) is the most data loss the business accepts, measured in time. <b>RTO</b> (Recovery Time Objective) is the longest downtime the business accepts. <b>Failover</b> means automatically or manually switching to a standby system when the primary fails. More frequent backups lower data loss. Standby resources lower downtime. Both cost money.',
  ana: 'RPO is how much of your essay you can afford to retype after a crash. RTO is how long you can afford to be unable to write.',
  why: 'Fires, mistakes, attacks and outages happen. Business targets decide how much to invest in protection.',
  ex: 'The attendance system backs up every hour and has a standby copy in another region. If the primary fails, the standby takes over in minutes with at most one hour of lost data.',
  how: ['Set the RPO and RTO with the business.', 'Choose a backup frequency that meets the RPO.', 'Choose recovery resources that meet the RTO.', 'Test the plan regularly.'],
  tryit: 'Choose backup frequency and redundancy, set your targets and simulate an outage. Aim to meet both.',

/* ============ Application ============ */
const main = $('#main');
let vizScope = null, uidn = 0, revealN = 1, curId = null;

/* ---------- progress helpers ---------- */
const isDone = id => !!S.completed[id];
const doneCount = () => MODS.filter(m => isDone(m.id)).length;
const pctAll = () => Math.round(100 * doneCount() / MODS.length);
const lvMods = lv => MODS.filter(m => m.lv === lv);
const BADGES = [
  { id: 'first', name: 'First Lesson Completed', desc: 'Complete any module.', test: () => doneCount() >= 1 },
  { id: 'dns', name: 'DNS Detective', desc: 'Complete the DNS module.', test: () => isDone('1.4') },
  { id: 'net', name: 'Network Builder', desc: 'Complete What Is a Network.', test: () => isDone('2.1') },
  { id: 'vm', name: 'VM Creator', desc: 'Launch a cloud VM in module 5.1.', test: () => !!(S.prog['5.1'] && S.prog['5.1'].viz) },
  { id: 'stor', name: 'Storage Explorer', desc: 'Complete both storage modules.', test: () => isDone('6.1') && isDone('6.2') },
  { id: 'arch', name: 'Cloud Architect', desc: 'Complete all Cloud Networking modules.', test: () => lvMods(8).every(m => isDone(m.id)) },
  { id: 'sec', name: 'Security Guardian', desc: 'Complete all Cloud Security modules.', test: () => lvMods(9).every(m => isDone(m.id)) },
  { id: 'az', name: 'Azure Explorer', desc: 'Complete the Azure Overview module.', test: () => isDone('12.1') },
  { id: 'quiz', name: 'Quiz Champion', desc: 'Score 80 percent or more in a practice quiz.', test: () => S.practice.best >= 80 },
  { id: 'streak', name: 'Daily Learner', desc: 'Reach a 3 day challenge streak.', test: () => S.daily.streak >= 3 }
];
function checkBadges() {
  BADGES.forEach(b => { if (!S.badges[b.id] && b.test()) { S.badges[b.id] = dayStr(); save(); toast('Badge earned: ' + b.name); } });
}
function markProg(id, key) {
  S.prog[id] = S.prog[id] || {};
  if (!S.prog[id][key]) { S.prog[id][key] = 1; save(); }
  const p = S.prog[id];
  if (p.viz && p.chal && p.quiz && !isDone(id)) completeModule(id);
  checkBadges(); if (curId === id) updateChecklist(id);
}
function completeModule(id) {
  if (isDone(id)) return;
  S.completed[id] = true; save();
  award('mod:' + id, 20, 'Module complete');
  checkBadges(); onChrome();
  if (curId === id) updateChecklist(id);
}

/* ---------- chrome: top bar, XP card, roadmap ---------- */
const openLv = new Set([0]);
function updateChrome() {
  const p = pctAll(), li = levelInfo(S.xp);
  const bar = $('#topBar'); bar.setAttribute('aria-valuenow', p); $('i', bar).style.width = p + '%'; $('#topPct').textContent = p + '%';
  const nxt = li.next ? `${S.xp} of ${li.next} XP to next level` : `${S.xp} XP, top level reached`;
  $('#xpCard').innerHTML = `<b>${esc(li.name)}</b><br><span class="muted">${nxt}</span><div class="bar" style="margin-top:.4rem"><i style="width:${li.next ? Math.round(100 * (S.xp - li.from) / (li.next - li.from)) : 100}%"></i></div><span class="muted">${doneCount()} of ${MODS.length} modules complete</span>`;
  renderRoadmap();
}
onChrome = updateChrome;
function renderRoadmap() {
  const nav = $('#roadmap'), keep = nav.scrollTop;
  nav.innerHTML = LV.map((name, lv) => {
    const ms = lvMods(lv), d = ms.filter(m => isDone(m.id)).length, open = openLv.has(lv);
    return `<section class="rd-level ${open ? 'open' : ''} ${d === ms.length ? 'done' : ''}" data-lv="${lv}"><button type="button" class="rd-lh" aria-expanded="${open}">Level ${lv}: ${esc(name)}<small>${d}/${ms.length}</small></button><ul class="rd-mods">${ms.map(m => `<li><a href="#/module/${m.id}" ${curId === m.id ? 'aria-current="page"' : ''}><span class="num">${m.id}</span><span>${esc(m.title)}</span>${isDone(m.id) ? '<span class="st done">Done</span>' : (S.prog[m.id] && Object.keys(S.prog[m.id]).length ? '<span class="st">Started</span>' : '')}</a></li>`).join('')}</ul></section>`;
  }).join('');
  nav.scrollTop = keep;
}

/* ---------- module page ---------- */
function updateChecklist(id) {
  const p = S.prog[id] || {}, ul = $('.check-list'); if (!ul) return;
  ul.innerHTML = [['viz', 'Visualizer'], ['chal', 'Mini-game'], ['quiz', 'Knowledge check']].map(([k, l]) => `<li class="${p[k] ? 'on' : ''}">${l}</li>`).join('');
  const b = $('#markBtn'); if (b) { b.disabled = isDone(id); b.textContent = isDone(id) ? 'Module completed' : 'Mark module complete'; }
}
function mountViz(m, host) {
  if (vizScope) vizScope.dispose(); vizScope = makeScope();
  const box = document.createElement('div'); box.className = 'vz'; host.replaceChildren(box);
  const ctx = { id: m.id, scope: vizScope, uid: 'v' + (++uidn), done() { markProg(m.id, 'viz'); award('viz:' + m.id, 10, 'Visualizer complete'); }, remount() { mountViz(m, host); } };
  try { VIZ[m.viz.t](box, m.viz, ctx); } catch (e) { console.error(e); box.innerHTML = '<p class="err">This visualizer could not start. Please reload the page.</p>'; }
}
function applyReveal() {
  $$('.rv').forEach((s, i) => s.classList.toggle('rv-hidden', S.inst && i >= revealN));
}
function renderModule(id) {
  const m = MOD[id], idx = MODS.indexOf(m), prev = MODS[idx - 1], next = MODS[idx + 1]; curId = id;
  S.last = id; save(); award('open:' + id, 3);
  revealN = 1;
  main.innerHTML = `<article class="module" aria-labelledby="mt">
   <header class="mod-head"><p class="eyebrow">Level ${m.lv}: ${esc(LV[m.lv])}</p><h1 id="mt">${m.id} ${esc(m.title)}</h1><p class="sub">${esc(m.sub)}</p>
   <div class="card objectives"><h2>Learning objectives</h2><ul>${m.obj.map(o => `<li>${o}</li>`).join('')}</ul>${prev ? `<p class="muted">Recommended before this: <a href="#/module/${prev.id}">${prev.id} ${esc(prev.title)}</a></p>` : '<p class="muted">No prerequisites. Start here if you are new to computers.</p>'}</div></header>
   <div class="mod-grid"><div class="theory">
    <section class="card rv"><h2>What is it?</h2><p>${m.what}</p>${m.ana ? `<div class="callout"><b>Analogy, not the exact technical truth:</b> ${m.ana}</div>` : ''}</section>
    <section class="card rv"><h2>Why do we need it?</h2><p>${m.why}</p></section>
    <section class="card rv"><h2>Real-world example</h2><p>${m.ex}</p></section>
    <section class="card rv"><h2>How does it work?</h2><ol class="steps-list">${m.how.map(h => `<li>${h}</li>`).join('')}</ol></section>
   </div><div class="workspace">
    <section class="card" aria-labelledby="tryh"><h2 id="tryh">Try it yourself</h2><p>${m.tryit}</p><div id="vizHost"></div></section>
    <section class="card"><h2>Common mistakes</h2><ul class="mist">${m.mist.map(x => `<li>${x}</li>`).join('')}</ul></section>
    <section class="card"><h2>Mini-game: ${esc(m.chal.title)}</h2><p>${m.chal.intro}</p><div id="chalHost"></div></section>
    <section class="card"><h2>Quick check</h2><div id="quickHost"></div></section>
    <section class="card"><h2>Knowledge check</h2><div id="quizHost"></div></section>
    <section class="card"><h2>Remember</h2><p>${m.rem}</p><ul class="check-list" aria-label="Module progress"></ul><div class="vz-controls"><button type="button" class="btn primary" id="markBtn">Mark module complete</button></div></section>
   </div></div>
   <nav class="mod-nav" aria-label="Module navigation">${prev ? `<a class="btn" href="#/module/${prev.id}">Previous: ${esc(prev.title)}</a>` : '<span></span>'}${next ? `<a class="btn primary" href="#/module/${next.id}">Next: ${esc(next.title)}</a>` : '<a class="btn primary" href="#/progress">See your progress</a>'}</nav></article>`;
  mountViz(m, $('#vizHost'));
  runSet($('#chalHost'), m.chal.qs, { onFinish: r => { if (!r.review) { markProg(id, 'chal'); award('chal:' + id, 15, 'Mini-game complete'); } } });
  renderQuestion(m.quick, $('#quickHost'), {});
  runSet($('#quizHost'), m.quiz, { onFinish: r => { if (!r.review) { const o = S.scores[id] || { best: 0 }; S.scores[id] = { best: Math.max(o.best || 0, r.pct), last: r.pct }; save(); markProg(id, 'quiz'); award('quizdone:' + id, 10, 'Knowledge check finished'); } } });
  $('#markBtn').addEventListener('click', () => completeModule(id));
  updateChecklist(id); applyReveal(); renderRoadmap();
}

/* ---------- home ---------- */
const GOALS = ['Understand cloud computing', 'Learn Azure fundamentals', 'Prepare for AZ-900', 'Understand how websites work', 'Explore technology through games'];
function dailyQuestion() {
  const pool = MODS.flatMap(m => [m.quick, ...m.quiz]); let h = 0; const s = dayStr(); for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return pool[h % pool.length];
}
function renderHome() {
  curId = null; const last = MOD[S.last] || MODS[0], started = Object.keys(S.prog).length || doneCount();
  main.innerHTML = `<div class="hero"><section class="card hero-main"><h1>${started ? 'Welcome back to CloudQuest' : 'Welcome to CloudQuest'}</h1><p>Your journey from computer basics to the cloud. Learn at your own pace, try the labs and play the challenges.</p>
   <div class="stats"><div class="stat"><b>${pctAll()}%</b>progress</div><div class="stat"><b>${doneCount()} / ${MODS.length}</b>modules done</div><div class="stat"><b>${S.xp}</b>total XP</div><div class="stat"><b>${S.daily.streak}</b>day streak</div></div>
   <p><a class="btn primary" href="#/module/${last.id}">${started ? 'Continue learning: ' + last.id + ' ' + esc(last.title) : 'Start learning: ' + esc(last.title)}</a></p>
   ${S.goals.length ? `<p class="muted">Your goals: ${S.goals.map(esc).join(', ')}.</p>` : ''}</section>
   <section class="card" id="daily"><h2>Daily challenge</h2></section></div>
   <section class="card"><h2>Learning roadmap</h2><div class="lv-grid">${LV.map((n, lv) => { const ms = lvMods(lv); return `<div class="box lv-card"><h3>Level ${lv}: ${esc(n)}</h3><div class="bar" aria-hidden="true"><i style="width:${Math.round(100 * ms.filter(m => isDone(m.id)).length / ms.length)}%"></i></div><ul>${ms.map(m => `<li><a href="#/module/${m.id}">${m.id} ${esc(m.title)}${isDone(m.id) ? ' (done)' : ''}</a></li>`).join('')}</ul></div>`; }).join('')}</div></section>
   <section class="card"><h2>Achievements</h2>${badgesHtml()}</section>`;
  const d = $('#daily'), today = dayStr();
  if (S.daily.doneDate === today) d.insertAdjacentHTML('beforeend', `<p><span class="tag ok">Completed today</span> Come back tomorrow for a new question. Streak: ${S.daily.streak} day(s).</p>`);
  else { d.insertAdjacentHTML('beforeend', '<p class="muted">One beginner friendly question a day.</p>'); renderQuestion(dailyQuestion(), d, { showTopic: true, onAnswer: ok => { S.daily.streak = S.daily.lastDone === dayStr(-1) ? S.daily.streak + 1 : 1; S.daily.lastDone = today; S.daily.doneDate = today; save(); award('daily:' + today, ok ? 10 : 5, 'Daily challenge done'); checkBadges(); } }); }
}
function badgesHtml() {
  return `<div class="badges">${BADGES.map(b => { const on = !!S.badges[b.id]; return `<div class="badge ${on ? 'on' : 'off'}"><span class="tag ${on ? 'ok' : ''}">${on ? 'Earned' : 'Locked'}</span><b>${b.name}</b><span class="muted">${b.desc}</span></div>`; }).join('')}</div>`;
}

/* ---------- progress page ---------- */
function renderProgress() {
  curId = null; const li = levelInfo(S.xp);
  main.innerHTML = `<h1>Your progress</h1><section class="card"><div class="stats"><div class="stat"><b>${pctAll()}%</b>overall progress</div><div class="stat"><b>${doneCount()}</b>modules completed</div><div class="stat"><b>${S.xp}</b>total XP</div><div class="stat"><b>${esc(li.name)}</b>current level</div><div class="stat"><b>${Object.keys(S.badges).length}</b>badges earned</div></div>
   <p><a class="btn primary" href="#/module/${(MOD[S.last] || MODS[0]).id}">Continue learning</a></p></section>
   <section class="card"><h2>Badges</h2>${badgesHtml()}</section>
   <section class="card"><h2>Knowledge check scores</h2>${Object.keys(S.scores).length ? `<table class="tbl"><thead><tr><th>Module</th><th>Best score</th><th>Last score</th></tr></thead><tbody>${MODS.filter(m => S.scores[m.id]).map(m => `<tr><td><a href="#/module/${m.id}">${m.id} ${esc(m.title)}</a></td><td>${S.scores[m.id].best}%</td><td>${S.scores[m.id].last}%</td></tr>`).join('')}</tbody></table>` : '<p class="muted">No knowledge checks finished yet.</p>'}<p>Practice quiz: best ${S.practice.best}% over ${S.practice.runs} run(s).</p></section>
   <section class="card"><h2>Your goals</h2><p>${S.goals.length ? S.goals.map(esc).join(', ') : 'No goals selected yet.'}</p><div class="vz-controls"><button type="button" class="btn" id="goalsBtn">Change goals or replay introduction</button><button type="button" class="btn danger" id="resetAll">Reset all progress</button></div></section>`;
  $('#goalsBtn').addEventListener('click', () => showOnboarding());
  $('#resetAll').addEventListener('click', () => { if (window.confirm('Reset all progress, XP and badges on this device? This cannot be undone.')) { const th = S.theme; S = defaults(); S.theme = th; S.onboarded = true; save(); updateChrome(); route(); toast('Progress reset.'); } });
}

/* ---------- practice quiz ---------- */
function renderPractice() {
  curId = null;
  main.innerHTML = `<h1>Practice quiz</h1><section class="card"><p>Mix questions from every module: multiple choice, true or false, scenarios, matching and identification. Review the explanations after each answer.</p>
   <div class="vz-row"><label for="pqL">Level</label><select id="pqL"><option value="all">All levels</option>${LV.map((n, i) => `<option value="${i}">Level ${i}: ${esc(n)}</option>`).join('')}</select>
   <label for="pqD">Difficulty</label><select id="pqD"><option value="all">All</option><option value="b">Beginner</option><option value="i">Intermediate</option><option value="x">Exam style</option></select>
   <label for="pqN">Questions</label><select id="pqN"><option>5</option><option selected>10</option><option>15</option></select><button type="button" class="btn primary" id="pqGo">Start quiz</button></div></section><div id="pqHost"></div>`;
  $('#pqGo').addEventListener('click', () => {
    const L = $('#pqL').value, D = $('#pqD').value, N = +$('#pqN').value;
    let pool = MODS.flatMap(m => [m.quick, ...m.quiz, ...m.chal.qs]).filter(q => (L === 'all' || MOD[q.mod].lv === +L) && (D === 'all' || q.d === D));
    if (!pool.length) { $('#pqHost').innerHTML = '<div class="card"><p class="err">No questions match those filters. Try All difficulty.</p></div>'; return; }
    const qs = shuffle(pool).slice(0, N), host = el('<section class="card"></section>'); $('#pqHost').replaceChildren(host);
    runSet(host, qs, { single: true, showTopic: true, onFinish: r => {
      if (!r.review) { S.practice.runs++; if (r.total >= 10 || r.pct > S.practice.best) S.practice.best = Math.max(S.practice.best, r.total >= 10 ? r.pct : S.practice.best); save(); checkBadges(); award('practice:' + S.practice.runs, 10, 'Practice quiz finished'); }
      if (r.missed.length) { const t = [...new Set(r.missed.map(q => q.mod))]; const d = el(`<div class="callout warn"><b>Review these topics:</b> ${t.map(i => `<a href="#/module/${i}">${i} ${esc(MOD[i].title)}</a>`).join(', ')}</div>`); $('.set-foot', host).append(d); }
    } });
    host.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
  });
}

/* ---------- onboarding ---------- */
function showOnboarding() {
  const ob = $('#onboard'); let step = 0; ob.classList.add('show');
  const YN = ['Have you used a computer before?', 'Do you know what the internet is?', 'Have you heard of cloud computing?', 'Have you used Google Drive or OneDrive?'];
  const dots = () => `<div class="ob-dots" aria-label="Step ${step + 1} of 4">${[0, 1, 2, 3].map(i => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>`;
  function draw() {
    let h = '';
    if (step === 0) h = `${dots()}<h1 tabindex="-1">Welcome to CloudQuest</h1><p><b>Your journey from computer basics to the cloud.</b></p><p>No experience is needed. We start with what a computer is and build step by step to networking, servers, cloud computing and the basics of Microsoft Azure.</p><ul class="steps-list"><li>${LV.length} levels and ${MODS.length} modules</li><li>Roughly 15 to 20 hours in total, at your own pace</li><li>Every module has a lesson, a lab, a mini-game and a quiz</li></ul><div class="callout">Every expert started as a beginner. Questions and mistakes are part of learning.</div><div class="ob-actions"><button type="button" class="btn" data-o="skip">Skip introduction</button><button type="button" class="btn primary" data-o="next">Start Learning</button></div>`;
    else if (step === 1) h = `${dots()}<h1 tabindex="-1">Tell us a little about you</h1><p>These answers do not block anything. They just help you see where you are starting.</p>${YN.map((q, i) => `<div class="ob-q"><b>${q}</b><div class="yn" role="group" aria-label="${esc(q)}">${['Yes', 'A little', 'No'].map(a => `<button type="button" class="btn small" data-q="${i}" data-a="${a}" aria-pressed="${S.intro['q' + i] === a}">${a}</button>`).join('')}</div></div>`).join('')}<div class="ob-actions"><button type="button" class="btn" data-o="back">Back</button><button type="button" class="btn primary" data-o="next">Next</button></div>`;
    else if (step === 2) h = `${dots()}<h1 tabindex="-1">What do you want to achieve?</h1><p>Choose any goals that fit. You can change them later.</p>${GOALS.map((g, i) => `<label class="ob-goal"><input type="checkbox" data-g="${i}" ${S.goals.includes(g) ? 'checked' : ''}><span>${g}</span></label>`).join('')}<div class="ob-actions"><button type="button" class="btn" data-o="back">Back</button><button type="button" class="btn primary" data-o="next">Next</button></div>`;
    else h = `${dots()}<h1 tabindex="-1">How CloudQuest works</h1><ul class="steps-list"><li><b>Learn at your own pace.</b> Nothing is locked, so jump anywhere.</li><li><b>Try the interactive labs.</b> Clicking and experimenting is how ideas stick.</li><li><b>Read the explanations.</b> Every answer explains why.</li><li><b>Complete the challenges.</b> Earn XP and badges as you go.</li><li><b>Review incorrect answers.</b> Mistakes are the fastest way to learn.</li></ul><div class="ob-actions"><button type="button" class="btn" data-o="back">Back</button><button type="button" class="btn primary" data-o="finish">Begin my journey</button></div>`;
    ob.innerHTML = `<div class="ob">${h}</div>`; const t = $('h1', ob); if (t) t.focus();
  }
  ob.onclick = e => {
    const b = e.target.closest('[data-o]'), q = e.target.closest('[data-q]');
    if (q) { S.intro['q' + q.dataset.q] = q.dataset.a; save(); return draw(); }
    if (!b) return; const o = b.dataset.o;
    if (o === 'next') { step++; draw(); } else if (o === 'back') { step--; draw(); } else if (o === 'skip' || o === 'finish') finish();
  };
  ob.onchange = e => { const g = e.target.closest('[data-g]'); if (g) { const n = GOALS[+g.dataset.g]; S.goals = S.goals.filter(x => x !== n); if (g.checked) S.goals.push(n); save(); } };
  function finish() { S.onboarded = true; save(); ob.classList.remove('show'); ob.innerHTML = ''; ob.onclick = null; ob.onchange = null; updateChrome(); if (location.hash && location.hash !== '#/home') route(); else { location.hash = '#/home'; route(); } main.focus({ preventScroll: true }); }
  draw();
}

/* ---------- theme and instructor mode ---------- */
function applyTheme(t) {
  if (t) { S.theme = t; save(); }
  const th = S.theme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = th;
  $('#themeBtn').textContent = th === 'dark' ? 'Light theme' : 'Dark theme';
}
function setInst(on) {
  S.inst = on; save(); document.body.classList.toggle('present', on); $('#instBtn').setAttribute('aria-pressed', on);
  $('#instBtn').textContent = on ? 'Exit instructor mode' : 'Instructor mode';
  if (!on) document.body.classList.remove('hl');
  toast(on ? 'Instructor mode on. Use the toolbar at the bottom.' : 'Instructor mode off.'); route();
}

/* ---------- router ---------- */
function route() {
  if (vizScope) { vizScope.dispose(); vizScope = null; }
  const h = location.hash.replace(/^#\/?/, '') || 'home', parts = h.split('/');
  document.body.classList.remove('nav-open'); $('#menuBtn').setAttribute('aria-expanded', 'false');
  if (parts[0] === 'module' && MOD[parts[1]]) { renderModule(parts[1]); openLv.add(MOD[parts[1]].lv); }
  else if (parts[0] === 'practice') renderPractice();
  else if (parts[0] === 'progress') renderProgress();
  else renderHome();
  renderRoadmap(); window.scrollTo(0, 0);
  const t = $('h1', main); document.title = (t ? t.textContent + ' | ' : '') + 'CloudQuest';
  main.focus({ preventScroll: true });
}
function stepModule(d) { const i = curId ? MODS.findIndex(m => m.id === curId) : -1; const n = MODS[clamp((i < 0 ? 0 : i + d), 0, MODS.length - 1)]; location.hash = '#/module/' + n.id; }

/* ---------- init ---------- */
function init() {
  applyTheme(); document.body.classList.toggle('present', !!S.inst); $('#instBtn').setAttribute('aria-pressed', !!S.inst); if (S.inst) $('#instBtn').textContent = 'Exit instructor mode';
  $('#themeBtn').addEventListener('click', () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
  $('#instBtn').addEventListener('click', () => setInst(!S.inst));
  $('#menuBtn').addEventListener('click', () => { const o = document.body.classList.toggle('nav-open'); $('#menuBtn').setAttribute('aria-expanded', o); });
  $('#roadmap').addEventListener('click', e => {
    const h = e.target.closest('.rd-lh'); if (h) { const lv = +h.parentElement.dataset.lv; openLv.has(lv) ? openLv.delete(lv) : openLv.add(lv); return renderRoadmap(); }
    if (e.target.closest('a')) document.body.classList.remove('nav-open');
  });
  $('#inst-bar').addEventListener('click', e => {
    const b = e.target.closest('[data-i]'); if (!b) return; const a = b.dataset.i;
    if (a === 'prev') stepModule(-1); if (a === 'next') stepModule(1);
    if (a === 'exit') setInst(false);
    if (a === 'hl') { const on = document.body.classList.toggle('hl'); b.setAttribute('aria-pressed', on); }
    if (a === 'reveal') { revealN++; applyReveal(); const v = $$('.rv')[Math.min(revealN - 1, $$('.rv').length - 1)]; if (v) v.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'nearest' }); if (revealN >= $$('.rv').length) toast('All theory sections are visible.'); }
    if (a === 'reset' && curId) { const h = $('#vizHost'); if (h) mountViz(MOD[curId], h); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { document.body.classList.remove('nav-open'); $('#menuBtn').setAttribute('aria-expanded', 'false'); } });
  window.addEventListener('hashchange', route);
  updateChrome(); route(); checkBadges();
  if (!S.onboarded) showOnboarding();
}
init();
})();
</script>
</body>
</html>
