<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudQuest: Learn Cloud Computing from Zero</title>
<meta name="description" content="CloudQuest is an interactive learning platform that teaches cloud computing and Microsoft Azure fundamentals to complete beginners.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f6cbd'/%3E%3Cpath d='M20 44h26a9 9 0 0 0 1-18 12 12 0 0 0-23-2 10 10 0 0 0-4 20z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#f2f6fb;--surface:#ffffff;--surface2:#e8f0f9;--ink:#0f2237;--muted:#48607a;--line:#cfdbe8;--line2:#8fa6bd;
--primary:#0f6cbd;--primary-ink:#ffffff;--primary-soft:#d9e9f9;--accent:#0b766f;--accent-soft:#d8f0ed;
--ok:#146c2e;--ok-soft:#dcf2e2;--warn:#8a4b00;--warn-soft:#fcebcf;--bad:#b3261e;--bad-soft:#fbe0dd;
--shadow:0 1px 2px rgba(15,34,55,.07),0 6px 18px rgba(15,34,55,.05);
--font:'Atkinson Hyperlegible',system-ui,'Segoe UI',Roboto,Arial,sans-serif;
--head:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,'Segoe UI',sans-serif;
--side:310px;
}
[data-theme=dark]{
--bg:#0b1624;--surface:#132236;--surface2:#1b3049;--ink:#e8f0f9;--muted:#a6b9cd;--line:#2a4160;--line2:#5a7794;
--primary:#5aa9ef;--primary-ink:#06213a;--primary-soft:#183b5f;--accent:#4fc3bb;--accent-soft:#12403f;
--ok:#73d38d;--ok-soft:#173a26;--warn:#f2b660;--warn-soft:#42310f;--bad:#ff9088;--bad-soft:#4b1e1b;--shadow:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6}
body.present{font-size:21px}
h1,h2,h3{font-family:var(--head);line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:2rem}h2{font-size:1.3rem}h3{font-size:1.1rem}
p{margin:.4em 0 .8em}
a{color:var(--primary)}
code{background:var(--surface2);padding:.05em .35em;border-radius:5px;font-size:.92em}
.muted{color:var(--muted)}
.skip{position:absolute;left:-999px;top:0;background:var(--primary);color:var(--primary-ink);padding:.6rem 1rem;z-index:100}
.skip:focus{left:8px;top:8px}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:.75rem;padding:.5rem 1rem;background:var(--surface);border-bottom:1.5px solid var(--line)}
.brand{display:flex;align-items:center;gap:.5rem;font-family:var(--head);font-weight:700;font-size:1.25rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand svg{width:34px;height:34px}
.tb-progress{flex:1;min-width:120px;max-width:340px;display:flex;align-items:center;gap:.6rem;font-size:.9rem;color:var(--muted)}
.bar{flex:1;height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s}
.tb-nav{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.menu-btn{display:none}

/* buttons */
.btn{min-height:44px;padding:.5rem 1rem;border-radius:10px;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface2);border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{min-height:44px;padding:.3rem .7rem;font-size:.92rem}
.btn[aria-pressed=true]{background:var(--primary-soft);border-color:var(--primary);font-weight:700}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.danger{border-color:var(--bad);color:var(--bad)}

/* layout */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100vh - 62px)}
#sidebar{background:var(--surface);border-right:1.5px solid var(--line);padding:1rem .75rem 5rem;overflow-y:auto;position:sticky;top:62px;height:calc(100vh - 62px)}
#main{padding:1.5rem clamp(1rem,3vw,2.5rem) 6rem;outline:none;max-width:1400px;width:100%}
body.present .shell{grid-template-columns:minmax(0,1fr)}
body.present #sidebar{display:none}
body.present .menu-btn{display:none!important}

/* roadmap as a route line */
.xp-card{border:1.5px solid var(--line);border-radius:12px;padding:.7rem .8rem;margin-bottom:1rem;background:var(--surface2)}
.xp-card b{font-family:var(--head)}
.rd-level{position:relative;margin:0 0 .2rem;padding-left:1.6rem}
.rd-level::before{content:"";position:absolute;left:.55rem;top:1.5rem;bottom:-.4rem;width:3px;background:var(--line)}
.rd-level:last-child::before{display:none}
.rd-lh{width:100%;text-align:left;background:none;border:0;font:inherit;color:var(--ink);cursor:pointer;padding:.45rem .3rem;min-height:44px;display:flex;align-items:center;gap:.4rem;font-weight:700;position:relative}
.rd-lh::before{content:"";position:absolute;left:-1.5rem;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--surface);border:3px solid var(--primary)}
.rd-level.done .rd-lh::before{background:var(--primary)}
.rd-lh small{margin-left:auto;font-weight:400;color:var(--muted)}
.rd-mods{list-style:none;margin:0 0 .5rem;padding:0}
.rd-level:not(.open) .rd-mods{display:none}
.rd-mods a{display:flex;gap:.5rem;align-items:center;min-height:44px;padding:.3rem .6rem;border-radius:9px;text-decoration:none;color:var(--ink);font-size:.95rem}
.rd-mods a:hover{background:var(--surface2)}
.rd-mods a[aria-current=page]{background:var(--primary-soft);font-weight:700;box-shadow:inset 4px 0 0 var(--primary)}
.rd-mods .num{color:var(--muted);min-width:2.2em}
.rd-mods .st{margin-left:auto;font-size:.78rem;padding:.05rem .45rem;border-radius:99px;border:1px solid var(--line2);color:var(--muted)}
.rd-mods .st.done{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}

/* cards & content */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r,14px);padding:1.1rem 1.3rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.card>h2:first-child,.card>h3:first-child{margin-top:0}
.eyebrow{color:var(--muted);font-size:.95rem;margin:0 0 .2rem}
.mod-head .sub{font-size:1.1rem;color:var(--muted);margin-top:0}
.objectives ul{margin:.3rem 0 0;padding-left:1.2rem}
.mod-grid{display:block}
.callout{border-left:5px solid var(--accent);background:var(--accent-soft);padding:.6rem .9rem;border-radius:8px;margin:.7rem 0}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.steps-list{margin:.3rem 0;padding-left:1.3rem}
.steps-list li{margin:.3rem 0}
.mist li{margin:.3rem 0}
.rv-hidden{display:none!important}
body.hl b{background:var(--warn-soft);color:var(--ink);padding:0 .2em;border-radius:4px;box-shadow:0 0 0 1px var(--warn)}
.chip{display:inline-block;padding:.05rem .6rem;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:.82rem;margin:0 .3rem .3rem 0;color:var(--muted)}
.check-list{list-style:none;padding:0;margin:.3rem 0;display:flex;flex-wrap:wrap;gap:.4rem .9rem}
.check-list li::before{content:"Not yet: ";color:var(--muted)}
.check-list li.on::before{content:"Done: ";color:var(--ok);font-weight:700}
.mod-nav{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-top:1rem}

/* dashboard */
.hero{display:grid;gap:1rem;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:stretch}
.hero-main{background:linear-gradient(180deg,var(--primary-soft),var(--surface));}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.7rem;margin:.6rem 0}
.stat{border:1.5px solid var(--line);border-radius:12px;padding:.6rem .8rem;background:var(--surface)}
.stat b{display:block;font-family:var(--head);font-size:1.5rem}
.lv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.8rem}
.lv-card h3{margin-bottom:.2rem}
.lv-card ul{list-style:none;padding:0;margin:.4rem 0 0}
.lv-card a{display:block;padding:.3rem 0;min-height:44px;line-height:1.8}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.7rem}
.badge{border:1.5px solid var(--line);border-radius:12px;padding:.7rem .8rem;background:var(--surface)}
.badge.on{border-color:var(--ok);background:var(--ok-soft)}
.badge.off{opacity:.8}
.badge b{display:block}
.badge .tag{font-size:.82rem;font-weight:700}

/* onboarding */
#onboard{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;overflow:auto;padding:1.5rem}
#onboard.show{display:block}
.ob{max-width:720px;margin:4vh auto;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:2rem;box-shadow:var(--shadow)}
.ob h1{font-size:2.3rem}
.ob-dots{display:flex;gap:.4rem;margin-bottom:1rem}
.ob-dots i{width:34px;height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line)}
.ob-dots i.on{background:var(--primary);border-color:var(--primary)}
.ob-q{border:1.5px solid var(--line);border-radius:12px;padding:.7rem 1rem;margin:.6rem 0}
.ob-q .yn{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.4rem}
.ob-goal{display:flex;gap:.7rem;align-items:center;padding:.6rem .8rem;border:1.5px solid var(--line);border-radius:12px;margin:.5rem 0;min-height:48px;cursor:pointer}
.ob-goal input{width:22px;height:22px}
.ob-actions{display:flex;gap:.6rem;justify-content:space-between;margin-top:1.4rem;flex-wrap:wrap}

/* questions */
.q{border:1.5px solid var(--line);border-radius:12px;padding:.9rem 1rem;margin:.8rem 0;background:var(--surface)}
.q-text{font-weight:700;margin:.2rem 0 .7rem}
.opts{display:grid;gap:.5rem}
.opt{display:flex;gap:.7rem;align-items:center;text-align:left;min-height:48px;padding:.5rem .8rem;border-radius:10px;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft)}
.opt-l{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface2);font-weight:700;flex:none}
.opt-m{margin-left:auto;font-weight:700;font-size:.88rem}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.reveal{border-style:dashed;border-color:var(--ok)}
.fb{margin-top:.6rem}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.fb .ex{color:var(--ink)}
.mrow,.idrow{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;padding:.4rem 0;border-bottom:1px dashed var(--line)}
.mrow .ml{flex:1 1 200px;font-weight:700}
.mrow select,.vz select,.vz input[type=text],.vz input[type=number],.vz input[type=search]{min-height:44px;padding:.3rem .6rem;border-radius:9px;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;max-width:100%}
.idrow{cursor:pointer}
.idrow input{width:22px;height:22px}
.mres{font-size:.9rem;font-weight:700}
.mres.ok{color:var(--ok)}.mres.bad{color:var(--bad)}
.q-actions{margin-top:.6rem;display:flex;gap:.5rem;flex-wrap:wrap}
.set-head{display:flex;justify-content:space-between;gap:1rem;color:var(--muted);font-size:.95rem}
.set-foot{margin-top:.6rem}
.summary{border:1.5px solid var(--primary);background:var(--primary-soft);border-radius:12px;padding:.8rem 1rem}
.summary .row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}

/* visualizer */
.vz{margin-top:.5rem}
.vz-instr{background:var(--surface2);border-radius:10px;padding:.6rem .9rem;margin:0 0 .8rem}
.vz-controls{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0}
.vz-row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:.5rem 0}
.vz-row label{font-weight:700}
.vz svg{width:100%;height:auto;display:block;background:var(--surface2);border:1.5px solid var(--line);border-radius:12px}
.vz-status{margin:.6rem 0;padding:.6rem .9rem;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);min-height:3em}
.vz-status.ok{border-color:var(--ok);background:var(--ok-soft)}
.vz-status.bad{border-color:var(--bad);background:var(--bad-soft)}
.vz-status.warn{border-color:var(--warn);background:var(--warn-soft)}
.vz-log{margin:.5rem 0;padding-left:1.4rem}
.vz-log li{margin:.25rem 0;color:var(--muted)}
.vz-log li.done{color:var(--ink)}
.vz-log li.cur{color:var(--ink);font-weight:700}
.node rect{fill:var(--surface);stroke:var(--line2);stroke-width:2}
.node text{fill:var(--ink);font-size:14px;font-family:var(--font);text-anchor:middle;pointer-events:none}
.node .sub{fill:var(--muted);font-size:11px}
.node.active rect{fill:var(--primary-soft);stroke:var(--primary);stroke-width:4}
.node.sel rect{stroke:var(--accent);stroke-width:4;stroke-dasharray:7 4}
.node.click{cursor:pointer}
.edge{stroke:var(--line2);stroke-width:3;stroke-linecap:round}
.edge.on{stroke:var(--primary);stroke-width:4}
.edge.bad{stroke:var(--bad);stroke-dasharray:6 5}
.pkt circle{fill:var(--warn);stroke:var(--surface);stroke-width:2}
.pkt text{fill:var(--ink);font-size:12px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:var(--surface2);stroke-width:4px}
.pkt.blocked circle{fill:var(--bad)}
.xp-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1rem}
.xp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.6rem;align-content:start}
.xp-item{display:flex;flex-direction:column;gap:.15rem;align-items:flex-start;min-height:88px;padding:.6rem;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.xp-item:hover{border-color:var(--primary)}
.xp-item.sel{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
.xp-item.on{border-color:var(--ok)}
.xp-ic{display:inline-block;padding:.05rem .45rem;border-radius:7px;background:var(--primary);color:var(--primary-ink);font-weight:700;font-size:.82rem}
.xp-st{font-size:.82rem;color:var(--muted)}
.xp-item.on .xp-st{color:var(--ok);font-weight:700}
.xp-detail{border:1.5px solid var(--line);border-radius:12px;padding:.8rem 1rem;background:var(--surface)}
.xp-detail table,.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.xp-detail td,.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:.35rem .4rem;text-align:left;vertical-align:top}
.tbl th{color:var(--muted);font-weight:700}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}
.meter{display:flex;align-items:center;gap:.6rem;margin:.3rem 0}
.meter .ml{flex:0 0 170px}
.meter .mb{display:flex;gap:4px}
.meter i{width:26px;height:12px;border-radius:4px;border:1.5px solid var(--line2);background:var(--surface)}
.meter i.on{background:var(--primary);border-color:var(--primary)}
.meter .mv{color:var(--muted);font-size:.9rem}
.resp{width:100%;border-collapse:separate;border-spacing:0 5px}
.resp td{padding:.45rem .8rem;border:1.5px solid var(--line)}
.resp td:first-child{border-radius:9px 0 0 9px;font-weight:700;background:var(--surface)}
.resp td:last-child{border-radius:0 9px 9px 0}
.resp .you{background:var(--primary-soft);border-color:var(--primary)}
.resp .prov{background:var(--surface2)}
.resp .shared{background:var(--warn-soft);border-color:var(--warn)}
.bits{font-family:ui-monospace,Consolas,monospace;font-size:1.05rem;word-break:break-all}
.bits .n{color:var(--primary);font-weight:700;border-bottom:3px solid var(--primary)}
.bits .hh{color:var(--muted);border-bottom:3px dotted var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.3rem 1rem;margin:.6rem 0}
.kv dt{font-weight:700}.kv dd{margin:0}
.gauge{height:16px;border-radius:99px;background:var(--surface2);border:1.5px solid var(--line);overflow:hidden;margin:.2rem 0}
.gauge>i{display:block;height:100%;background:var(--primary)}
.gauge.warn>i{background:var(--warn)}.gauge.bad>i{background:var(--bad)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.8rem}
.box{border:1.5px solid var(--line);border-radius:12px;padding:.7rem .9rem;background:var(--surface)}
.vmblock{display:inline-block;border:2px solid var(--primary);border-radius:8px;padding:.3rem .6rem;margin:.2rem;background:var(--primary-soft);font-size:.9rem}
.tag{display:inline-block;padding:.05rem .5rem;border-radius:99px;font-size:.82rem;font-weight:700;border:1.5px solid var(--line2)}
.tag.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.tag.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.tag.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.err{color:var(--bad);font-weight:700}
canvas{width:100%;height:auto;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);display:block}
input[type=range]{width:min(320px,100%);min-height:32px;accent-color:var(--primary)}
.slider-row{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,2fr) 90px;gap:.6rem;align-items:center;margin:.35rem 0}
.tree{list-style:none;padding-left:1.1rem;border-left:3px solid var(--line)}
.tree li{margin:.3rem 0}

/* instructor toolbar */
#inst-bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:60;display:none;gap:.4rem;flex-wrap:wrap;justify-content:center;background:var(--surface);border:2px solid var(--primary);border-radius:14px;padding:.5rem .7rem;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:96vw}
body.present #inst-bar{display:flex}
body.present .mod-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:1.2rem;align-items:start}
body.present .theory{position:sticky;top:76px;max-height:calc(100vh - 150px);overflow:auto}

/* toast */
#toast{position:fixed;right:14px;bottom:14px;z-index:90;display:grid;gap:.4rem;max-width:min(360px,92vw)}
.toast{background:var(--ink);color:var(--bg);padding:.6rem .9rem;border-radius:10px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.3)}
body.present #toast{bottom:90px}

@media (max-width:1000px){
 .shell{grid-template-columns:minmax(0,1fr)}
 #sidebar{position:fixed;left:0;top:62px;bottom:0;width:min(88vw,340px);height:auto;z-index:50;transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 30px rgba(0,0,0,.3)}
 body.nav-open #sidebar{transform:none}
 .menu-btn{display:inline-block}
 .hero,.xp-wrap{grid-template-columns:minmax(0,1fr)}
 body.present .mod-grid{display:block}
 body.present .theory{position:static;max-height:none}
}
@media (max-width:640px){
 body{font-size:16px}
 .tb-progress{display:none}
 .topbar{flex-wrap:wrap}
 .tb-nav .lbl{display:none}
 .slider-row{grid-template-columns:1fr}
 .meter .ml{flex-basis:120px}
 h1{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header class="topbar">
  <button type="button" class="btn menu-btn" id="menuBtn" aria-controls="sidebar" aria-expanded="false">Roadmap</button>
  <a class="brand" href="#/home" aria-label="CloudQuest home">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0f6cbd"/><path d="M20 44h26a9 9 0 0 0 1-18 12 12 0 0 0-23-2 10 10 0 0 0-4 20z" fill="#fff"/></svg>
    CloudQuest
  </a>
  <div class="tb-progress" title="Overall progress">
    <div class="bar" role="progressbar" aria-label="Overall learning progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="topBar"><i style="width:0%"></i></div>

/* timer scope so visualizers never leak timers when the learner moves on */

/* ============ persistent state ============ */
const KEY = 'cloudquest.v1';
const defaults = () => ({
  onboarded: false, intro: {}, goals: [], theme: '', completed: {}, prog: {}, scores: {}, xp: 0, awarded: {},
  badges: {}, last: '', daily: { streak: 0, lastDone: '', doneDate: '' }, practice: { best: 0, runs: 0 }, bucket: null, inst: false

function loadState() {
  const d = defaults();
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return d;
    const p = JSON.parse(raw);
    if (!p || typeof p !== 'object' || Array.isArray(p)) return d;
    for (const k of Object.keys(d)) {
      const v = p[k], dv = d[k];
      if (v === undefined || v === null) continue;
      if (dv === null) { if (typeof v === 'object' && !Array.isArray(v)) d[k] = v; }
      else if (Array.isArray(dv)) { if (Array.isArray(v)) d[k] = v.filter(x => typeof x === 'string'); }
      else if (typeof dv === 'object') { if (typeof v === 'object' && !Array.isArray(v)) d[k] = Object.assign(dv, v); }
      else if (typeof dv === typeof v) d[k] = v;
    }

}
let S = loadState();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage can be blocked, the app still works */ } }

/* ============ toast and XP ============ */
function toast(msg) {

  const t = el(`<div class="toast">${esc(msg)}</div>`); box.append(t);
  setTimeout(() => t.remove(), 3200);
}
const LEVELS_XP = [[0, 'Cloud Beginner'], [250, 'Network Explorer'], [700, 'Infrastructure Builder'], [1300, 'Cloud Engineer Apprentice'], [2000, 'Azure Explorer']];
function levelInfo(xp) {
  let i = 0; for (let k = 0; k < LEVELS_XP.length; k++) if (xp >= LEVELS_XP[k][0]) i = k;
  const next = LEVELS_XP[i + 1];
  return { i, name: LEVELS_XP[i][1], next: next ? next[0] : null, from: LEVELS_XP[i][0] };
}
let onChrome = () => { };
function award(key, amt, msg) {
  if (S.awarded[key]) return false;
  const before = levelInfo(S.xp).i;
  S.awarded[key] = 1; S.xp += amt; save();
  if (msg) toast(msg + ' (+' + amt + ' XP)');
  const after = levelInfo(S.xp).i;
  if (after > before) toast('New level: ' + LEVELS_XP[after][1]);
  onChrome();
  return true;
}

/* ============ question engine ============ */
const Q = (q, a, w, e, d = 'b', sc = false) => ({ type: 'mc', q, opts: [a, ...w], e, d, sc });
const SC = (q, a, w, e, d = 'i') => Q(q, a, w, e, d, true);
const TF = (q, a, e, d = 'b') => ({ type: 'tf', q, ans: a, e, d });
const MT = (q, pairs, e, d = 'b') => ({ type: 'match', q, pairs, e, d });
const ID = (q, items, e, d = 'i') => ({ type: 'id', q, items, e, d });

function shufflePerm(n, avoid, ans) {
  let p;
  for (let t = 0; t < 8; t++) { p = shuffle(Array.from({ length: n }, (_, i) => i)); if (p.indexOf(ans) !== avoid) break; }
  return p;
}

/* Renders one question card. Shuffling keeps track of the correct answer by index, so scoring stays safe. */
function renderQuestion(q, host, o) {
  o = o || {};

  const lab = { b: 'Beginner', i: 'Intermediate', x: 'Exam style' }[q.d] || 'Beginner';
  const kind = q.type === 'match' ? 'Matching' : q.type === 'id' ? 'Identification' : q.type === 'tf' ? 'True or false' : q.sc ? 'Scenario' : 'Multiple choice';
  const wrap = el(`<section class="q" aria-label="Question"><div class="q-meta"><span class="chip">${kind}</span><span class="chip">${lab}</span>${o.showTopic && q.topic ? `<span class="chip">${esc(q.topic)}</span>` : ''}</div><p class="q-text">${q.q}</p><div class="q-body"></div><div class="q-actions"></div><div class="fb" role="status" aria-live="polite"></div></section>`);
  const body = $('.q-body', wrap), actions = $('.q-actions', wrap), fb = $('.fb', wrap);
  let locked = false;
  const finish = ok => { locked = true; if (ok && q.id) award('q:' + q.id, 5); if (o.onAnswer) o.onAnswer(ok, q); };
  const setFb = (ok, html) => { fb.className = 'fb ' + (ok ? 'ok' : 'bad'); fb.innerHTML = html; };
  const explain = q.e ? ` <span class="ex">${q.e}</span>` : '';

  if (q.type === 'mc' || q.type === 'tf') {
    const texts = q.type === 'tf' ? ['True', 'False'] : q.opts;
    const ans = q.type === 'tf' ? (q.ans ? 0 : 1) : 0;
    const perm = shufflePerm(texts.length, track.last, ans);

    body.setAttribute('role', 'group'); body.setAttribute('aria-label', 'Answer choices');
    body.innerHTML = perm.map((oi, pos) => `<button type="button" class="opt" data-oi="${oi}"><span class="opt-l" aria-hidden="true">${String.fromCharCode(65 + pos)}</span><span>${texts[oi]}</span><span class="opt-m"></span></button>`).join('');
    body.addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b || locked) return;

        x.disabled = true;

    });

      const r = el('<button type="button" class="btn small">Show answer</button>');
      r.addEventListener('click', () => { $$('.opt', body).forEach(x => x.classList.toggle('reveal', +x.dataset.oi === ans)); setFb(true, `<b>Answer: ${texts[ans]}.</b>` + explain); });
      actions.append(r);
    }

    const rights = shuffle(q.pairs.map(p => p[1]));
    body.innerHTML = `<div class="mt">${q.pairs.map((p, i) => `<div class="mrow"><span class="ml">${esc(p[0])}</span><select data-i="${i}" aria-label="Match for ${esc(p[0])}"><option value="">Choose...</option>${rights.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('')}</select><span class="mres"></span></div>`).join('')}</div>`;
    const chk = el('<button type="button" class="btn primary">Check matches</button>'); actions.append(chk);
    chk.addEventListener('click', () => {
      if (locked) return;

    const chk = el('<button type="button" class="btn primary">Check selection</button>'); actions.append(chk);
    chk.addEventListener('click', () => {
      if (locked) return;

    });
    if (S.inst) {
      const r = el('<button type="button" class="btn small">Show answers</button>');
      r.addEventListener('click', () => { setFb(true, '<b>Select:</b> ' + q.items.filter(i => i[1]).map(i => esc(i[0])).join('; ')); });

}

/* Runs a list of questions with progress, score, review of missed questions and retry. */
function runSet(host, qs, o) {
  o = o || {};
  function run(items, isReview) {
    let done = 0, right = 0, idx = 0;
    const missed = [], track = { last: -1 };
    host.innerHTML = '';
    const head = el('<div class="set-head" aria-live="polite"><span class="sp"></span><span class="ss"></span></div>');
    const list = el('<div class="set-list"></div>'), foot = el('<div class="set-foot"></div>');
    host.append(head, list, foot);
    const upd = () => { $('.sp', head).textContent = `Answered ${done} of ${items.length}`; $('.ss', head).textContent = `Correct so far: ${right}`; };
    const showOne = () => { list.innerHTML = ''; renderQuestion(items[idx], list, { track, onAnswer, showTopic: o.showTopic }); };
    const onAnswer = (ok, q) => {
      done++; if (ok) right++; else missed.push(q);
      upd();
      if (done === items.length) return finish();
      if (o.single) {
        const nb = el('<button type="button" class="btn primary">Next question</button>');
        nb.addEventListener('click', () => { idx++; foot.innerHTML = ''; showOne(); });
        foot.innerHTML = ''; foot.append(nb);
      }
    };
    const finish = () => {
      foot.innerHTML = '';
      const pct = Math.round(100 * right / items.length);
      const msg = pct === 100 ? 'Excellent work.' : pct >= 60 ? 'Good progress. Review the explanations for the questions you missed.' : 'This is a normal part of learning. Read the explanations, then try again.';
      const box = el(`<div class="summary"><b>Score: ${right} of ${items.length} (${pct}%).</b> ${msg}<div class="row"></div></div>`);
      const row = $('.row', box);
      if (missed.length) { const b = el('<button type="button" class="btn">Review missed questions</button>'); b.addEventListener('click', () => run(missed.slice(), true)); row.append(b); }
      const r = el('<button type="button" class="btn">Try all again</button>'); r.addEventListener('click', () => run(qs, false)); row.append(r);
      foot.append(box);
      if (o.onFinish) o.onFinish({ correct: right, total: items.length, missed, review: isReview, pct });
    };
    upd();
    if (o.single) showOne(); else items.forEach(q => renderQuestion(q, list, { track, onAnswer, showTopic: o.showTopic }));

}
/* ============ Visualizers (reusable components) ============ */
const VIZ = {};
const instr = t => `<p class="vz-instr"><b>How to use this:</b> ${t}</p>`;

/* moves a packet group between two points, respecting reduced motion */
function movePacket(scope, g, a, b, ms, done) {
  const set = (x, y) => g.setAttribute('transform', `translate(${x},${y})`);
  if (reduceMotion() || ms <= 0 || (a.x === b.x && a.y === b.y)) { set(b.x, b.y); if (done) done(); return; }
  const t0 = performance.now();
  const tick = now => {
    const p = clamp((now - t0) / ms, 0, 1), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    set(a.x + (b.x - a.x) * e, a.y + (b.y - a.y) * e);
    if (p < 1) scope.raf(tick); else if (done) done();
  };
  scope.raf(tick);
}
function nodeSvg(n, cls = '', w = 124, h = 56) {
  return `<g class="node ${cls}" data-id="${n.id}" transform="translate(${n.x},${n.y})"><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="12"/><text y="${n.sub ? -3 : 5}">${esc(n.label)}</text>${n.sub ? `<text class="sub" y="14">${esc(n.sub)}</text>` : ''}</g>`;
}

/* ---- step-by-step animated flow (packet journeys, DNS, request flows) ---- */
VIZ.steps = (box, cfg, ctx) => {
  const sc = ctx.scope, opts = cfg.options || [{ label: '', steps: cfg.steps }];
  const W = cfg.w || 720, H = cfg.h || 240, nodes = cfg.nodes, NW = cfg.nw || 124;
  const pos = id => nodes.find(n => n.id === id);
  let oi = 0, si = -1, playing = false, timer = null;
  box.innerHTML = instr(cfg.instr) +
    (opts.length > 1 ? `<div class="vz-row"><label for="${ctx.uid}o">${esc(cfg.optLabel || 'Scenario')}</label><select id="${ctx.uid}o">${opts.map((o, i) => `<option value="${i}">${esc(o.label)}</option>`).join('')}</select></div>` : '') +
    `<div class="vz-controls" role="group" aria-label="Playback controls">${btn('play', 'Start', 'primary')}${btn('pause', 'Pause')}${btn('prev', 'Previous step')}${btn('next', 'Next step')}${btn('reset', 'Reset')}</div>
     <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.alt || 'Animated diagram')}"><g class="edges"></g><g class="nds"></g><g class="pkt" style="display:none"><circle r="9"/><text y="-16"></text></g></svg>
     <div class="vz-status" aria-live="polite"></div><ol class="vz-log"></ol>`;
  const svg = $('svg', box), edges = $('.edges', svg), nds = $('.nds', svg), pkt = $('.pkt', svg), status = $('.vz-status', box), log = $('.vz-log', box);
  const steps = () => opts[oi].steps;
  function drawStatic() {
    const seen = new Set(), es = [];
    steps().forEach(s => { if (s.from && s.to && s.from !== s.to) { const k = [s.from, s.to].sort().join('|'); if (!seen.has(k)) { seen.add(k); es.push(s); } } });
    edges.innerHTML = es.map(s => { const a = pos(s.from), b = pos(s.to); return `<line class="edge" data-k="${[s.from, s.to].sort().join('|')}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`; }).join('');
    nds.innerHTML = nodes.map(n => nodeSvg(n, '', NW)).join('');
  }
  function draw(animate) {
    const st = steps()[si];
    $$('.node', nds).forEach(n => n.classList.remove('active'));
    $$('.edge', edges).forEach(e => e.classList.remove('on', 'bad'));
    if (st) {
      (st.active || [st.from, st.to]).filter(Boolean).forEach(id => { const n = $(`.node[data-id="${id}"]`, nds); if (n) n.classList.add('active'); });
      if (st.from && st.to && st.from !== st.to) { const e = $(`.edge[data-k="${[st.from, st.to].sort().join('|')}"]`, edges); if (e) e.classList.add(st.blocked ? 'bad' : 'on'); }
      const a = pos(st.from || st.at), b = pos(st.to || st.at), f = st.frac == null ? 1 : st.frac;
      const target = { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
      pkt.style.display = ''; pkt.classList.toggle('blocked', !!st.blocked);
      $('text', pkt).textContent = st.pkt || '';
      movePacket(sc, pkt, animate ? { x: a.x, y: a.y } : target, target, animate ? 800 : 0);
      status.className = 'vz-status' + (st.blocked ? ' bad' : ''); status.innerHTML = `<b>Step ${si + 1} of ${steps().length}:</b> ${st.text}`;
    } else { pkt.style.display = 'none'; status.className = 'vz-status'; status.textContent = 'Press Start to watch the whole journey, or Next step to go one step at a time.'; }
    log.innerHTML = steps().map((s, i) => `<li class="${i < si ? 'done' : i === si ? 'cur' : ''}">${s.text}</li>`).join('');
    $('[data-a=play]', box).disabled = playing; $('[data-a=pause]', box).disabled = !playing;
    if (si === steps().length - 1) { ctx.done(); }
  }
  function stop() { playing = false; if (timer) sc.clear(timer); timer = null; }
  function next(auto) { if (si >= steps().length - 1) { stop(); draw(false); return; } si++; draw(true); if (si >= steps().length - 1) stop(); if (!auto) stop(); }
  function reset() { stop(); si = -1; drawStatic(); draw(false); }
  box.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a;
    if (a === 'play') { if (si >= steps().length - 1) { si = -1; } playing = true; next(true); if (playing) timer = sc.interval(() => next(true), 2300); draw(false); }
    else if (a === 'pause') { stop(); draw(false); }
    else if (a === 'next') { stop(); next(false); }
    else if (a === 'prev') { stop(); si = Math.max(-1, si - 1); draw(false); }
    else if (a === 'reset') reset();
  });
  const sel = $('select', box); if (sel) sel.addEventListener('change', () => { oi = +sel.value; reset(); });
  reset();
};

/* ---- component explorer (click to learn, optional install mode) ---- */
VIZ.explorer = (box, cfg, ctx) => {
  const items = cfg.items, seen = new Set(), inst = new Set(); let cur = null;
  box.innerHTML = instr(cfg.instr) +
    `<div class="xp-wrap"><div class="xp-grid">${items.map(it => `<button type="button" class="xp-item" data-id="${it.id}"><span class="xp-ic" aria-hidden="true">${esc(it.ic || it.label.slice(0, 3))}</span><b>${esc(it.label)}</b><span class="xp-st"></span></button>`).join('')}</div><div class="xp-detail" aria-live="polite"><p class="muted">Select an item to see what it does.</p></div></div><div class="vz-status" role="status"></div><div class="vz-controls">${btn('reset', 'Reset')}</div>`;
  const detail = $('.xp-detail', box), status = $('.vz-status', box);
  function refresh() {
    $$('.xp-item', box).forEach(b => {
      const id = b.dataset.id, on = cfg.build ? inst.has(id) : seen.has(id);

    });

    let msg = `Explored ${seen.size} of ${n}.` + (cfg.build ? ` Installed ${inst.size} of ${n}.` : '');
    const complete = seen.size === n && (!cfg.build || inst.size === n);

/* ---- IPv4 helpers (also used by the cloud network builder) ---- */
const IP = {
  toN(s) { const p = String(s).trim().split('.'); if (p.length !== 4) return null; let n = 0; for (const x of p) { if (!/^\d{1,3}$/.test(x) || +x > 255) return null; n = n * 256 + +x; } return n; },
  toS(n) { return [Math.floor(n / 16777216) % 256, Math.floor(n / 65536) % 256, Math.floor(n / 256) % 256, n % 256].join('.'); },
  cidr(s) {
    const m = /^\s*([\d.]+)\s*\/\s*(\d{1,2})\s*$/.exec(String(s)); if (!m) return null;
    const ip = IP.toN(m[1]), p = +m[2]; if (ip === null || p > 32) return null;
    const size = Math.pow(2, 32 - p), net = Math.floor(ip / size) * size;
    return { ip, prefix: p, size, net, bcast: net + size - 1, mask: 4294967296 - size };
  },
  usable(c) { return c.prefix >= 32 ? 1 : c.prefix === 31 ? 2 : c.size - 2; },
  bits(c) { let out = ''; for (let i = 0; i < 32; i++) { const b = Math.floor(c.net / Math.pow(2, 31 - i)) % 2; out += `<span class="${i < c.prefix ? 'n' : 'hh'}">${b}</span>`; if (i % 8 === 7 && i < 31) out += '.'; } return out; },
  overlap(a, b) { return a.net <= b.bcast && b.net <= a.bcast; }
};

/* ---- subnet calculator ---- */
VIZ.subnet = (box, cfg, ctx) => {
  const done = new Set();
  box.innerHTML = instr(cfg.instr) + `<div class="vz-row">${['192.168.1.0/24', '192.168.1.0/26', '10.0.0.0/16', '172.16.5.0/28'].map(c => `<button type="button" class="btn small" data-c="${c}">${c}</button>`).join('')}</div>
  <div class="vz-row"><label for="${ctx.uid}i">Or type your own network in CIDR form</label><input type="text" id="${ctx.uid}i" value="192.168.1.0/24" inputmode="text" autocomplete="off" spellcheck="false">${btn('calc', 'Calculate', 'primary')}${btn('reset', 'Reset')}</div>
  <div class="vz-status" role="status" aria-live="polite">Pick a preset or type a network such as 192.168.10.0/27.</div><div class="out"></div>`;
  const inp = $('input', box), out = $('.out', box), status = $('.vz-status', box);
  function calc() {
    const c = IP.cidr(inp.value);
    if (!c) { status.className = 'vz-status bad'; status.textContent = 'That is not a valid CIDR network. Use four numbers from 0 to 255, a slash, then a prefix from 0 to 32. Example: 192.168.1.0/24.'; out.innerHTML = ''; return; }
    done.add(c.prefix + ':' + c.net);
    const first = c.prefix >= 31 ? c.net : c.net + 1, last = c.prefix >= 31 ? c.bcast : c.bcast - 1, hb = 32 - c.prefix;
    status.className = 'vz-status ok';
    status.textContent = c.net !== c.ip ? `Note: ${IP.toS(c.ip)} was rounded down to the network address ${IP.toS(c.net)}.` : 'Calculated successfully.';
    out.innerHTML = `<dl class="kv"><dt>Network address</dt><dd>${IP.toS(c.net)}</dd><dt>Broadcast address</dt><dd>${IP.toS(c.bcast)}</dd><dt>Usable host range</dt><dd>${IP.toS(first)} to ${IP.toS(last)}</dd><dt>Subnet mask</dt><dd>${IP.toS(c.mask)}</dd><dt>Total addresses</dt><dd>${c.size.toLocaleString()}</dd><dt>Usable host addresses</dt><dd><b>${IP.usable(c).toLocaleString()}</b></dd></dl>
    <p class="bits" aria-label="Binary form of the network address">${IP.bits(c)}</p><p class="muted">Blue underlined bits are the <b>network portion</b> (${c.prefix} bits). Grey dotted bits are the <b>host portion</b> (${hb} bits).</p>
    <div class="callout">A /${c.prefix} network leaves ${hb} bits for hosts, so it has 2 to the power ${hb} = ${c.size.toLocaleString()} addresses. ${c.prefix <= 30 ? 'The first address is the network address and the last is the broadcast address, so usable hosts = ' + c.size.toLocaleString() + ' minus 2 = ' + IP.usable(c).toLocaleString() + '.' : 'Very small networks like /31 and /32 are special cases used for point to point links and single hosts.'}</div>`;
    if (done.size >= 3) { ctx.done(); status.textContent += ' You have calculated 3 different networks. Well done.'; }
  }
  box.addEventListener('click', e => {
    const p = e.target.closest('[data-c]'); if (p) { inp.value = p.dataset.c; calc(); }
    const a = e.target.closest('[data-a]'); if (!a) return;
    if (a.dataset.a === 'calc') calc(); if (a.dataset.a === 'reset') ctx.remount();
  });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') calc(); });
};

/* ---- connector: click two devices to link them, then send a test packet ---- */
VIZ.connector = (box, cfg, ctx) => {
  const W = cfg.w || 720, H = cfg.h || 240, nodes = cfg.nodes, key = (a, b) => [a, b].sort().join('|');
  const need = new Set(cfg.links.map(l => key(l[0], l[1]))); const have = new Set(); let sel = null, sent = false, ok = false, busy = false;
  const pos = id => nodes.find(n => n.id === id);
  box.innerHTML = instr(cfg.instr) + `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.alt || 'Network diagram')}"><g class="edges"></g><g class="nds"></g><g class="pkt" style="display:none"><circle r="9"/><text y="-16"></text></g></svg>
  <div class="vz-controls">${btn('test', 'Send test packet', 'primary')}${btn('hint', 'Give me a hint')}${btn('clear', 'Remove all links')}${btn('reset', 'Reset')}</div>
  <div class="vz-status" role="status" aria-live="polite"></div><div class="xp-detail"><p class="muted">Select a device to read about it.</p></div>`;
  const svg = $('svg', box), edges = $('.edges', svg), nds = $('.nds', svg), pkt = $('.pkt', svg), status = $('.vz-status', box), detail = $('.xp-detail', box);
  const say = (t, c) => { status.className = 'vz-status ' + (c || ''); status.innerHTML = t; };
  function draw() {
    edges.innerHTML = [...have].map(k => { const [a, b] = k.split('|').map(pos); return `<line class="edge ${need.has(k) ? 'on' : 'bad'}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`; }).join('');
    nds.innerHTML = nodes.map(n => nodeSvg(n, 'click' + (sel === n.id ? ' sel' : ''), cfg.nw || 124)).join('');
    const missing = [...need].filter(k => !have.has(k)).length, extra = [...have].filter(k => !need.has(k)).length;
    ok = missing === 0 && extra === 0;
    if (ok) say(cfg.okMsg || 'All required links are in place. Press Send test packet.', 'ok');
    else say(`Links made: ${have.size}. Still missing: ${missing}.` + (extra ? ` Links that do not belong in this design: ${extra} (shown dashed and red).` : '') + ' Select one device, then another, to connect or disconnect them.');
  }
  function sendPacket() {
    if (busy) return; if (!ok) return say('Build the correct network first. A packet can only travel over links that exist.', 'warn');
    busy = true; let i = 0; const path = cfg.path; pkt.style.display = '';
    const hop = () => {
      if (i >= path.length - 1) { busy = false; sent = true; say(cfg.sentMsg || 'The test packet arrived. Your network works.', 'ok'); ctx.done(); return; }
      const a = pos(path[i]), b = pos(path[i + 1]); $('text', pkt).textContent = (cfg.pktLabels && cfg.pktLabels[i]) || 'Data';
      say(`Hop ${i + 1} of ${path.length - 1}: ${esc(a.label)} passes the data to ${esc(b.label)}.`);
      movePacket(ctx.scope, pkt, a, b, 800, () => { i++; ctx.scope.timeout(hop, 250); });
    };
    hop();
  }
  box.addEventListener('click', e => {
    const a = e.target.closest('[data-a]');
    if (a) {
      const t = a.dataset.a;
      if (t === 'reset') return ctx.remount();
      if (t === 'clear') { have.clear(); sel = null; pkt.style.display = 'none'; return draw(); }
      if (t === 'test') return sendPacket();
      if (t === 'hint') { const m = [...need].find(k => !have.has(k)); return say(m ? 'Hint: try connecting ' + m.split('|').map(id => esc(pos(id).label)).join(' and ') + '.' : 'No links are missing. Check for extra links.', 'warn'); }
    }
    const n = e.target.closest('.node'); if (!n) return;
    const id = n.dataset.id, nd = pos(id);
    detail.innerHTML = `<h3>${esc(nd.label)}</h3><p>${nd.info || ''}</p>`;
    if (sel === null) { sel = id; draw(); }
    else if (sel === id) { sel = null; draw(); }

  });
  draw();
};
/* ---- data center builder ---- */
VIZ.datacenter = (box, cfg, ctx) => {

    const devs = [];['switch', 'server', 'storage'].forEach(t => { for (let i = 0; i < st[t]; i++) devs.push(t); });

      r.forEach((d, k) => { const lbl = { server: 'Server', switch: 'Switch', storage: 'Storage' }[d]; const isOn = up && (d !== 'server' || hasSw); if (d === 'server' && isOn) online++;

      out += `<text x="77" y="214" text-anchor="middle" font-size="12" fill="var(--muted)">${reason}</text></g>`;
    });

    svg.innerHTML = out;
    const msg = [];
    if (!st.racks) msg.push('Start with a rack.'); else {
      if (st.server && !hasSw) msg.push('Your servers cannot talk to the network without a switch.');
      if (st.power < st.racks) msg.push('Some racks have no power supply.');
      if (st.cooling < st.racks) msg.push('Some racks have no cooling, so equipment would overheat.');
    }
    const good = st.racks >= 2 && online >= 3 && st.storage >= 1 && st.switch >= 1 && st.power >= st.racks && st.cooling >= st.racks;
    status.className = 'vz-status ' + (good ? 'ok' : ''); status.innerHTML = `<b>Servers online: ${online} of ${st.server}.</b> ` + (good ? 'Well built. Physical infrastructure, power, cooling and networking together make digital services possible.' : (msg.join(' ') || 'Goal: 2 racks, at least 3 online servers, a switch, storage, and power and cooling for each rack.'));
    if (good) ctx.done();

    const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a;

/* ---- on premises versus cloud ---- */
VIZ.costcompare = (box, cfg, ctx) => {
  let mode = null, units = 0, months = 12, demand = 10, acts = new Set();
  const CLOUD = 40, SERVER = 3000, SRV_UNITS = 10, MAINT = 60; // illustrative numbers only
  box.innerHTML = instr(cfg.instr) + `<div class="vz-controls" role="group">${btn('buy', 'Buy a server')}${btn('rent', 'Rent cloud resources')}${btn('inc', 'Increase resources')}${btn('dec', 'Reduce resources')}${btn('reset', 'Reset')}</div>
  <div class="vz-row"><label for="${ctx.uid}dm">Demand from students (capacity units needed)</label><input type="range" id="${ctx.uid}dm" min="2" max="40" value="10"><output></output></div>
  <div class="cols"><div class="box"><h3>Your setup</h3><div class="setup"></div></div><div class="box"><h3>12 month view (illustrative money)</h3><div class="cost"></div></div></div><div class="vz-status" role="status" aria-live="polite"></div>`;
  const status = $('.vz-status', box), rng = $('input', box), out = $('output', box);
  const say = (t, c) => { status.className = 'vz-status ' + (c || ''); status.innerHTML = t; };
  function draw() {
    out.textContent = demand; const cap = units;
    if (!mode) { $('.setup', box).innerHTML = '<p class="muted">Choose Buy a server or Rent cloud resources.</p>'; $('.cost', box).innerHTML = ''; return; }
    const servers = Math.ceil(units / SRV_UNITS), up = mode === 'buy' ? servers * SERVER : 0, mo = mode === 'buy' ? servers * MAINT : units * CLOUD;
    const total = up + mo * months, short = demand > cap, idle = cap > demand ? cap - demand : 0;
    $('.setup', box).innerHTML = `<dl class="kv"><dt>Model</dt><dd>${mode === 'buy' ? 'On premises: you own ' + servers + ' server(s)' : 'Cloud: pay for what you provision'}</dd><dt>Capacity</dt><dd>${cap} units</dd><dt>Demand</dt><dd>${demand} units</dd><dt>Provisioning</dt><dd>${mode === 'buy' ? 'Ordering and installing hardware takes weeks' : 'New capacity ready in minutes'}</dd><dt>Maintenance</dt><dd>${mode === 'buy' ? 'Your team handles hardware, power, cooling, repairs' : 'Provider handles the physical data center'}</dd></dl>${short ? '<p><span class="tag bad">Not enough capacity</span> Some students would see slow or failed pages.</p>' : idle ? `<p><span class="tag warn">${idle} unused units</span> ${mode === 'buy' ? 'You paid for capacity you are not using.' : 'Reduce resources to save money.'}</p>` : '<p><span class="tag ok">Capacity matches demand</span></p>'}`;
    $('.cost', box).innerHTML = `<dl class="kv"><dt>Upfront cost</dt><dd>${money(up)}</dd><dt>Monthly cost</dt><dd>${money(mo)}</dd><dt>Total for ${months} months</dt><dd><b>${money(total)}</b></dd></dl><p class="muted">Cloud is not always cheaper. Steady, predictable, heavy workloads that run for years can cost less on owned hardware. Cloud shines when demand changes or you need to start fast.</p>`;
    if (acts.has('buy') && acts.has('rent') && acts.has('inc') && acts.has('dec')) ctx.done();
  }
  box.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a;
    if (a === 'reset') return ctx.remount();
    if (a === 'buy') { mode = 'buy'; units = SRV_UNITS; acts.add('buy'); say('You bought one server. Capacity is fixed in blocks of ' + SRV_UNITS + ' units and you pay upfront.'); }
    else if (a === 'rent') { mode = 'cloud'; units = demand; acts.add('rent'); say('You rented cloud resources sized to demand. Nothing was bought upfront.'); }
    else if (!mode) return say('First choose Buy a server or Rent cloud resources.', 'warn');
    else if (a === 'inc') { acts.add('inc'); units += mode === 'buy' ? SRV_UNITS : 5; say(mode === 'buy' ? 'You ordered another server. In real life this takes weeks to arrive and set up.' : 'Cloud capacity increased in minutes.'); }
    else if (a === 'dec') { acts.add('dec'); if (mode === 'buy') { const s = Math.max(SRV_UNITS, units - SRV_UNITS); units = s; say('Selling or retiring a server is slow, and the money already spent is gone.', 'warn'); } else { units = Math.max(5, units - 5); say('Cloud capacity reduced. You stop paying for it right away.', 'ok'); } }
    draw();
  });
  rng.addEventListener('input', () => { demand = +rng.value; draw(); });
  draw();
};

/* ---- regions, zones and redundancy ---- */
VIZ.azsim = (box, cfg, ctx) => {
  const placed = new Set(), failedZ = new Set(), failedR = new Set(); let sim = false, survived = false; const W = cfg.zoneWord || 'zone';
  const zid = (r, z) => r + '.' + z;
  box.innerHTML = instr(cfg.instr) + `<div class="cols">${cfg.regions.map((r, ri) => `<div class="box"><h3>${esc(r.name)}</h3><p class="muted">${esc(r.note || '')}</p>${r.zones.map((z, zi) => `<div class="vz-row"><b>${esc(z)}</b> <button type="button" class="btn small" data-p="${zid(ri, zi)}">Place app copy</button> <button type="button" class="btn small" data-f="${zid(ri, zi)}">Fail this ${W}</button> <span class="zs" data-s="${zid(ri, zi)}"></span></div>`).join('')}${cfg.regionFail ? `<button type="button" class="btn small danger" data-fr="${ri}">Fail entire region</button>` : ''}</div>`).join('')}</div>
  <div class="vz-controls">${btn('heal', 'Repair everything')}${btn('reset', 'Reset')}</div><div class="vz-status" role="status" aria-live="polite"></div>`;
  const status = $('.vz-status', box);
  function up(ri, zi) { return placed.has(zid(ri, zi)) && !failedZ.has(zid(ri, zi)) && !failedR.has(ri); }
  function draw() {
    cfg.regions.forEach((r, ri) => r.zones.forEach((z, zi) => { const id = zid(ri, zi), s = $(`[data-s="${id}"]`, box), pl = placed.has(id), fl = failedZ.has(id) || failedR.has(ri);
      s.innerHTML = fl ? '<span class="tag bad">Failed</span>' : '<span class="tag">Healthy</span>'; s.innerHTML += pl ? ' <span class="tag ok">App copy running</span>' : ' <span class="tag">No copy</span>';
      $(`[data-p="${id}"]`, box).textContent = pl ? 'Remove app copy' : 'Place app copy'; }));
    const live = []; cfg.regions.forEach((r, ri) => r.zones.forEach((z, zi) => { if (up(ri, zi)) live.push([ri, zi]); }));
    const total = placed.size, anyFail = failedZ.size || failedR.size;
    let html;
    if (!total) html = 'Website is <b>offline</b> because no app copy is running. Place at least one copy.';
    else if (!live.length) html = '<span class="tag bad">Website OFFLINE</span> Every copy is in a failed location. This is the risk of a single point of failure.';
    else { const best = live.sort((a, b) => a[0] - b[0])[0]; html = `<span class="tag ok">Website ONLINE</span> Requests are served from <b>${esc(cfg.regions[best[0]].zones[best[1]])}</b> in ${esc(cfg.regions[best[0]].name)}. ${cfg.latency ? 'Users near the first region see about ' + (best[0] === 0 ? '20' : '120') + ' ms delay (fictional numbers).' : ''} Healthy copies: ${live.length} of ${total}.`; }
    status.className = 'vz-status ' + (live.length ? 'ok' : total ? 'bad' : ''); status.innerHTML = html + (cfg.dr ? `<br><i>${cfg.dr}</i>` : '');
    if (anyFail && live.length && total >= 2) { survived = true; } if (survived) ctx.done();
  }
  box.addEventListener('click', e => {
    const p = e.target.closest('[data-p]'), f = e.target.closest('[data-f]'), fr = e.target.closest('[data-fr]'), a = e.target.closest('[data-a]');
    if (p) { const id = p.dataset.p; placed.has(id) ? placed.delete(id) : placed.add(id); }
    else if (f) { const id = f.dataset.f; failedZ.has(id) ? failedZ.delete(id) : failedZ.add(id); }
    else if (fr) { const id = +fr.dataset.fr; failedR.has(id) ? failedR.delete(id) : failedR.add(id); }
    else if (a) { if (a.dataset.a === 'reset') return ctx.remount(); failedZ.clear(); failedR.clear(); }
    else return;
    draw();
  });
  draw();
};

/* ---- object storage bucket ---- */
VIZ.bucket = (box, cfg, ctx) => {
  const QUOTA = 100; let b = S.bucket && Array.isArray(S.bucket.objs) && typeof S.bucket.name === 'string' ? S.bucket : null;
  const samples = [['photo-001.jpg', 2.4], ['lecture-notes.pdf', 0.8], ['backup-2026.zip', 35], ['intro-video.mp4', 48], ['logo.png', 0.2]];
  box.innerHTML = instr(cfg.instr) + `<div class="box"><h3>1. Bucket</h3><div class="vz-row"><label for="${ctx.uid}b">Bucket name</label><input type="text" id="${ctx.uid}b" placeholder="college-files-2026" maxlength="63"><label><input type="checkbox" id="${ctx.uid}v"> Turn on versioning</label>${btn('mk', 'Create bucket', 'primary')}</div></div>
  <div class="box" style="margin-top:.8rem"><h3>2. Objects</h3><div class="vz-row"><label for="${ctx.uid}f">Sample file</label><select id="${ctx.uid}f">${samples.map((s, i) => `<option value="${i}">${s[0]} (${s[1]} MB)</option>`).join('')}</select>${btn('up', 'Upload')}</div>
  <div class="vz-row"><label for="${ctx.uid}k">Or custom object key</label><input type="text" id="${ctx.uid}k" placeholder="reports/week1.txt" maxlength="80"><label for="${ctx.uid}z">Size (MB)</label><input type="number" id="${ctx.uid}z" min="0.1" max="100" step="0.1" value="1">${btn('upc', 'Upload custom')}</div><div class="list"></div></div>
  <div class="vz-controls">${btn('reset', 'Delete bucket and reset')}</div><div class="vz-status" role="status" aria-live="polite">Start by creating a bucket. Your bucket is saved in this browser.</div>`;
  const status = $('.vz-status', box), g = k => $('#' + ctx.uid + k, box);
  const say = (t, c) => { status.className = 'vz-status ' + (c || ''); status.innerHTML = t; };
  const used = () => b ? b.objs.reduce((s, o) => s + o.size * o.v, 0) : 0;
  function draw() {
    const L = $('.list', box);
    if (!b) { L.innerHTML = '<p class="muted">No bucket yet.</p>'; return; }
    const p = Math.min(100, Math.round(100 * used() / QUOTA));
    L.innerHTML = `<p>Bucket <b>${esc(b.name)}</b> (access: private, versioning: ${b.ver ? 'on' : 'off'})</p><div>Storage used: <b>${used().toFixed(1)} MB of ${QUOTA} MB</b><div class="gauge ${p > 85 ? 'bad' : ''}"><i style="width:${p}%"></i></div></div>` +
      (b.objs.length ? `<table class="tbl"><thead><tr><th>Object key</th><th>Size</th><th>Versions</th><th>Actions</th></tr></thead><tbody>${b.objs.map((o, i) => `<tr><td>${esc(o.key)}</td><td>${o.size} MB</td><td>${o.v}</td><td><button type="button" class="btn small" data-dl="${i}">Download</button> <button type="button" class="btn small danger" data-rm="${i}" aria-label="Delete ${esc(o.key)}">Delete</button></td></tr>`).join('')}</tbody></table>` : '<p class="muted">The bucket is empty.</p>');
    if (b.objs.length >= 2) ctx.done();
  }
  function upload(key, size) {
    if (!b) return say('Create a bucket first.', 'warn');
    if (!key || !(size > 0)) return say('Give the object a key and a size above 0.', 'bad');
    if (used() + size > QUOTA) return say('This would exceed the bucket size limit of the simulation (100 MB).', 'bad');
    const ex = b.objs.find(o => o.key === key);
    if (ex) { if (b.ver) { ex.v++; ex.size = size; say(`Versioning is on, so a new version of <b>${esc(key)}</b> was stored and the old one is kept.`, 'ok'); } else { ex.size = size; say(`Versioning is off, so <b>${esc(key)}</b> was overwritten. The old data is gone.`, 'warn'); } }
    else { b.objs.push({ key, size, v: 1 }); say(`Uploaded object <b>${esc(key)}</b>. In object storage the key is its unique name inside the bucket.`, 'ok'); }
    S.bucket = b; save(); draw();
  }
  box.addEventListener('click', e => {
    const a = e.target.closest('[data-a]'), dl = e.target.closest('[data-dl]'), rm = e.target.closest('[data-rm]');
    if (dl) return say(`Simulated download of <b>${esc(b.objs[+dl.dataset.dl].key)}</b>. Anyone with permission could fetch it by bucket name and key.`);
    if (rm) { const o = b.objs.splice(+rm.dataset.rm, 1)[0]; S.bucket = b; save(); say(`Deleted <b>${esc(o.key)}</b> (all ${o.v} version(s)).`); return draw(); }
    if (!a) return; const t = a.dataset.a;
    if (t === 'reset') { S.bucket = null; save(); return ctx.remount(); }
    if (t === 'mk') { const n = g('b').value.trim();
      if (b) return say('You already have a bucket. Use reset to remove it.', 'warn');
      if (!/^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$/.test(n)) return say('Bucket names use 3 to 63 lowercase letters, numbers or hyphens, and must start and end with a letter or number.', 'bad');
      b = { name: n, ver: g('v').checked, objs: [] }; S.bucket = b; save(); say('Bucket created. It is private by default, which is the safe choice.', 'ok'); draw(); }
    if (t === 'up') { const s = samples[+g('f').value]; upload(s[0], s[1]); }
    if (t === 'upc') upload(g('k').value.trim(), +g('z').value);
  });
  draw(); if (b) say('Loaded your saved bucket.');
};

/* ---- cloud network builder ---- */

  <div class="box" style="margin-top:.8rem"><h3>4. Test connectivity</h3><div class="vz-row"><label for="${ctx.uid}ti">Instance</label><select id="${ctx.uid}ti"></select><label for="${ctx.uid}td">Direction</label><select id="${ctx.uid}td"><option value="in">Internet reaches the instance</option><option value="out">Instance reaches the internet</option></select>${btn('test', 'Run test')}</div></div>

    const opts = subs.map((s, i) => `<option value="${i}">${esc(s.name)}</option>`).join(''); g('is').innerHTML = opts;
    $('.vms', box).innerHTML = vms.length ? `<table class="tbl"><thead><tr><th>Instance</th><th>Subnet</th><th>Private IP</th><th>Security rules (inbound)</th></tr></thead><tbody>${vms.map(v => `<tr><td>${esc(v.name)}</td><td>${esc(subs[v.s].name)}</td><td>${v.ip}</td><td>${subs[v.s].type === 'public' ? 'Allow 443 from internet. Deny everything else.' : 'Allow traffic from inside the virtual network only. Deny internet.'}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">No instances yet.</p>';
    g('ti').innerHTML = vms.map((v, i) => `<option value="${i}">${esc(v.name)}</option>`).join('');

    if (t === 'mks') { if (!vnet) return say('Create the virtual network first.', 'warn'); const c = IP.cidr(g('sc').value), name = g('sn').value.trim();

      if (subs.some(s => s.name === name)) return say('A subnet with that name exists.', 'bad');
      if (!c) return say('Invalid CIDR range. Example: 10.0.1.0/24.', 'bad'); if (c.ip !== c.net) return say(`The address must be the start of the range. Did you mean ${IP.toS(c.net)}/${c.prefix}?`, 'bad');
      if (c.prefix > 28) return say('Subnets smaller than /28 are too small. Some addresses are reserved by the cloud provider.', 'bad');

    if (t === 'mki') { if (!subs.length) return say('Add a subnet first.', 'warn'); const s = +g('is').value, name = g('in').value.trim(); if (!/^[A-Za-z][A-Za-z0-9-]{0,19}$/.test(name)) return say('Instance name: start with a letter, then letters, numbers or hyphens.', 'bad'); if (vms.some(v => v.name === name)) return say('That instance name is taken.', 'bad');
      const cnt = vms.filter(v => v.s === s).length, ipn = subs[s].c.net + 4 + cnt; if (ipn >= subs[s].c.bcast) return say('This subnet has no free addresses.', 'bad');
      vms.push({ name, s, ip: IP.toS(ipn) }); say(`Instance ${esc(name)} received private IP ${IP.toS(ipn)}. The first few addresses of every subnet are reserved by the provider.`, 'ok'); }
    if (t === 'test') { if (!vms.length) return say('Add an instance first.', 'warn'); const v = vms[+g('ti').value], s = subs[v.s], dir = g('td').value; tested = true;
      if (dir === 'in') say(s.type === 'public' ? `<b>${esc(v.name)}</b> can be reached from the internet on port 443, because the subnet routes to an internet gateway and the security rule allows 443. Other ports are denied.` : `<b>${esc(v.name)}</b> cannot be reached from the internet. The private subnet has no route from the internet, and NAT never allows unsolicited inbound traffic.`, s.type === 'public' ? 'ok' : 'warn');
      else say(s.type === 'public' ? `<b>${esc(v.name)}</b> can reach the internet through the internet gateway.` : s.nat ? `<b>${esc(v.name)}</b> can reach the internet outbound through the NAT gateway, for example to download updates.` : `<b>${esc(v.name)}</b> cannot reach the internet because the private subnet has no NAT gateway.`, s.type === 'public' || s.nat ? 'ok' : 'warn'); }
    draw();
  });
  draw();
};

/* ---- load balancer ---- */
VIZ.lb = (box, cfg, ctx) => {
  let servers = [{ up: true, n: 0, size: 1 }, { up: true, n: 0, size: 1 }], rr = 0, total = 0, fail = 0, autoId = null, added = 0, stopped = false;
  box.innerHTML = instr(cfg.instr) + `<div class="vz-controls">${btn('add', 'Add server (scale out)')}${btn('one', 'Send 1 request', 'primary')}${btn('ten', 'Send 10 requests')}${btn('auto', 'Start auto traffic')}${btn('reset', 'Reset')}</div>
  <div class="cols srv"></div><div class="vz-status" role="status" aria-live="polite"></div>`;
  const status = $('.vz-status', box);
  const say = (t, c) => { status.className = 'vz-status ' + (c || ''); status.innerHTML = t; };
  function draw() {
    const mx = Math.max(1, ...servers.map(s => s.n));
    $('.srv', box).innerHTML = servers.map((s, i) => `<div class="box"><h3>Server ${i + 1} <span class="tag ${s.up ? 'ok' : 'bad'}">${s.up ? 'Healthy' : 'Stopped'}</span></h3><p>Requests handled: <b>${s.n}</b><br>Size: ${s.size === 1 ? 'Small' : s.size === 2 ? 'Medium' : 'Large'} (capacity ${s.size * 100} requests per second)</p><div class="gauge"><i style="width:${Math.round(100 * s.n / mx)}%"></i></div><button type="button" class="btn small" data-t="${i}">${s.up ? 'Stop server' : 'Start server'}</button> <button type="button" class="btn small" data-u="${i}">Scale up (bigger server)</button></div>`).join('');
    const cap = servers.filter(s => s.up).reduce((a, s) => a + s.size * 100, 0);
    status.dataset.cap = cap;
  }
  function send() {
    total++; const healthy = servers.map((s, i) => i).filter(i => servers[i].up);
    if (!healthy.length) { fail++; return false; }
    for (let k = 0; k < servers.length; k++) { const i = (rr + k) % servers.length; if (servers[i].up) { servers[i].n++; rr = i + 1; break; } }
    return true;
  }
  function report() {
    const cap = servers.filter(s => s.up).reduce((a, s) => a + s.size * 100, 0);
    say(`Total requests: <b>${total}</b>. Failed (no healthy server): <b>${fail}</b>. Current capacity: <b>${cap} requests per second</b>. The balancer skips stopped servers, so users keep getting answers while at least one server is healthy. Scale out adds servers; scale up makes one server bigger.`, fail ? 'warn' : 'ok');
    if (total >= 10 && stopped && added) ctx.done();
  }
  box.addEventListener('click', e => {
    const t = e.target.closest('[data-t]'), u = e.target.closest('[data-u]'), a = e.target.closest('[data-a]');
    if (t) { const s = servers[+t.dataset.t]; s.up = !s.up; if (!s.up) stopped = true; draw(); return report(); }
    if (u) { const s = servers[+u.dataset.u]; s.size = Math.min(3, s.size + 1); draw(); return report(); }
    if (!a) return; const k = a.dataset.a;
    if (k === 'reset') return ctx.remount();
    if (k === 'add') { if (servers.length >= 6) return say('This demo allows up to 6 servers.', 'warn'); servers.push({ up: true, n: 0, size: 1 }); added++; }
    if (k === 'one') send(); if (k === 'ten') for (let i = 0; i < 10; i++) send();
    if (k === 'auto') { if (autoId) { ctx.scope.clear(autoId); autoId = null; a.textContent = 'Start auto traffic'; } else { a.textContent = 'Pause auto traffic'; autoId = ctx.scope.interval(() => { send(); draw(); report(); }, 500); } }
    draw(); report();
  });
  draw(); say('Send some requests and watch them spread across the healthy servers.');
};

/* ---- traffic spike simulation on canvas ---- */
VIZ.spike = (box, cfg, ctx) => {
  const N = 60, PER = 200; let tick = 0, servers = 2, auto = false, served = 0, dropped = 0, cost = 0, hist = [], timer = null, finished = false;
  const demand = t => Math.round(250 + 950 * Math.exp(-Math.pow((t - 30) / 10, 2)) + (t % 7) * 8);
  box.innerHTML = instr(cfg.instr) + `<div class="vz-controls">${btn('start', 'Start', 'primary')}${btn('pause', 'Pause')}${btn('add', 'Add server')}${btn('rem', 'Remove server')}<label class="idrow"><input type="checkbox" id="${ctx.uid}a"> Autoscaling</label>${btn('reset', 'Reset')}</div>
  <canvas width="720" height="280" role="img" aria-label="Chart of traffic demand and server capacity over time"></canvas><div class="vz-status" role="status" aria-live="polite"></div>`;
  const cv = $('canvas', box), status = $('.vz-status', box), ctx2 = cv.getContext ? cv.getContext('2d') : null;
  const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim() || '#888';
  function paint() {
    if (!ctx2) return; const w = 720, h = 280; ctx2.clearRect(0, 0, w, h); const mx = 1500, X = i => 40 + i * (w - 60) / N, Y = v => h - 30 - v * (h - 50) / mx;
    ctx2.strokeStyle = css('--line2'); ctx2.fillStyle = css('--muted'); ctx2.font = '12px sans-serif'; ctx2.lineWidth = 1;
    [0, 500, 1000, 1500].forEach(v => { ctx2.beginPath(); ctx2.moveTo(40, Y(v)); ctx2.lineTo(w - 20, Y(v)); ctx2.stroke(); ctx2.fillText(v, 4, Y(v) + 4); });
    ctx2.fillText('Time (each step is one minute)', w / 2 - 70, h - 8);
    const line = (arr, col, dash) => { ctx2.beginPath(); ctx2.strokeStyle = col; ctx2.lineWidth = 3; ctx2.setLineDash(dash); arr.forEach((v, i) => i ? ctx2.lineTo(X(i), Y(v)) : ctx2.moveTo(X(i), Y(v))); ctx2.stroke(); ctx2.setLineDash([]); };
    line(hist.map(x => x.d), css('--primary'), []); line(hist.map(x => x.c), css('--warn'), [8, 5]);
    ctx2.fillStyle = css('--ink'); ctx2.fillText('Solid line: demand. Dashed line: capacity.', 50, 16);
  }
  function info(extra) { const cap = servers * PER; status.className = 'vz-status ' + (finished ? (dropped / Math.max(1, served + dropped) < .05 ? 'ok' : 'warn') : ''); status.innerHTML = `Minute ${tick} of ${N}. Demand: <b>${tick ? demand(tick - 1) : 0}</b> requests per second. Servers: <b>${servers}</b> (capacity ${servers * PER}). Served: ${served}. Dropped: ${dropped}. Cost so far: ${servers ? money(cost) : money(cost)} (illustrative).` + (extra ? '<br>' + extra : ''); }
  function step() {
    if (tick >= N) return stop(); const d = demand(tick), cap = servers * PER;
    if (auto) { if (d > cap * .8 && servers < 10) servers++; else if (d < (servers - 1) * PER * .6 && servers > 1 && tick % 3 === 0) servers--; }
    const c = servers * PER; served += Math.min(d, c); dropped += Math.max(0, d - c); cost += servers * 0.5; hist.push({ d, c }); tick++; paint();
    if (tick >= N) { stop(); finished = true; const pct = Math.round(100 * dropped / (served + dropped)); info(`<b>Finished.</b> ${pct}% of requests were dropped. ${pct < 5 ? 'Great match of capacity to demand.' : 'Try adding capacity before the peak, or turn on autoscaling.'} Elastic scaling helps you avoid both dropped requests and paying for idle servers.`); ctx.done(); } else info();
  }
  function stop() { if (timer) ctx.scope.clear(timer); timer = null; }
  box.addEventListener('click', e => {
    const a = e.target.closest('[data-a]'); if (!a) return; const k = a.dataset.a;
    if (k === 'reset') return ctx.remount();
    if (k === 'start') { if (finished) return ctx.remount(); if (!timer) timer = ctx.scope.interval(step, reduceMotion() ? 60 : 300); }
    if (k === 'pause') stop();
    if (k === 'add') servers = Math.min(10, servers + 1); if (k === 'rem') servers = Math.max(1, servers - 1);
    info(); paint();
  });
  $('#' + ctx.uid + 'a', box).addEventListener('change', e => { auto = e.target.checked; });
  paint(); info('Press Start. Traffic rises to a peak around minute 30.');
};

/* ---- IAM access challenge ---- */
VIZ.iam = (box, cfg, ctx) => {
  const users = ['Asha (student)', 'Ben (teacher)', 'Chitra (IT admin)'], res = ['Course Slides', 'Student Grades', 'Exam Papers', 'Billing'];
  const roles = { Reader: ['read'], Contributor: ['read', 'write'], Owner: ['read', 'write', 'delete', 'manage access'] };
  const goals = [[0, 0, 'read', true], [1, 1, 'write', true], [0, 1, 'read', false], [1, 3, 'write', false], [2, 1, 'manage access', true]];
  let assigns = [], me = null, ran = false;
  box.innerHTML = instr(cfg.instr) + `<div class="cols"><div class="box"><h3>Assign a role</h3><div class="vz-row"><label for="${ctx.uid}u">User</label><select id="${ctx.uid}u">${users.map((u, i) => `<option value="${i}">${u}</option>`).join('')}</select></div><div class="vz-row"><label for="${ctx.uid}r">Role</label><select id="${ctx.uid}r">${Object.keys(roles).map(r => `<option>${r}</option>`).join('')}</select></div><div class="vz-row"><label for="${ctx.uid}s">Resource</label><select id="${ctx.uid}s">${res.map((r, i) => `<option value="${i}">${r}</option>`).join('')}</select></div>${btn('as', 'Assign role', 'primary')}<div class="al"></div></div>
  <div class="box"><h3>Test an access request</h3><div class="vz-row"><label for="${ctx.uid}si">Sign in as</label><select id="${ctx.uid}si"><option value="">Not signed in</option>${users.map((u, i) => `<option value="${i}">${u}</option>`).join('')}</select></div><div class="vz-row"><label for="${ctx.uid}ac">Action</label><select id="${ctx.uid}ac">${['read', 'write', 'delete', 'manage access'].map(a => `<option>${a}</option>`).join('')}</select></div><div class="vz-row"><label for="${ctx.uid}rs">Resource</label><select id="${ctx.uid}rs">${res.map((r, i) => `<option value="${i}">${r}</option>`).join('')}</select></div>${btn('test', 'Send request')}</div></div>
  <div class="box" style="margin-top:.8rem"><h3>Goals (least privilege)</h3><ul class="goals"></ul></div><div class="vz-controls">${btn('reset', 'Reset')}</div><div class="vz-status" role="status" aria-live="polite">Authentication proves who you are. Authorization decides what you may do. Sign in, then test.</div>`;
  const status = $('.vz-status', box), g = k => $('#' + ctx.uid + k, box);
  const say = (t, c) => { status.className = 'vz-status ' + (c || ''); status.innerHTML = t; };
  const allowed = (u, r, a) => assigns.some(x => x.u === u && x.r === r && roles[x.role].includes(a));
  function draw() {
    $('.al', box).innerHTML = assigns.length ? `<ul class="steps-list">${assigns.map((x, i) => `<li>${users[x.u]}: ${x.role} on ${res[x.r]} <button type="button" class="btn small" data-rm="${i}" aria-label="Remove assignment ${i + 1}">Remove</button></li>`).join('')}</ul>` : '<p class="muted">No roles assigned. Everything is denied by default.</p>';
    const met = goals.map(gl => allowed(gl[0], gl[1], gl[2]) === gl[3]);
    $('.goals', box).innerHTML = goals.map((gl, i) => `<li><span class="tag ${met[i] ? 'ok' : 'warn'}">${met[i] ? 'Met' : 'Not met'}</span> ${users[gl[0]].split(' ')[0]} ${gl[3] ? 'can' : 'must NOT be able to'} ${gl[2]} ${res[gl[1]]}</li>`).join('');
    if (met.every(Boolean) && ran) ctx.done();
  }
  box.addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]'); if (rm) { assigns.splice(+rm.dataset.rm, 1); return draw(); }
    const a = e.target.closest('[data-a]'); if (!a) return; const t = a.dataset.a;
    if (t === 'reset') return ctx.remount();
    if (t === 'as') { const x = { u: +g('u').value, r: +g('s').value, role: g('r').value }; if (!assigns.some(y => y.u === x.u && y.r === x.r && y.role === x.role)) assigns.push(x); say('Role assigned. A role bundles permissions, and here it is scoped to one resource only.'); }
    if (t === 'test') {
      const who = g('si').value; if (who === '') return say('<b>Denied at authentication.</b> No one is signed in, so the system does not know who is asking.', 'bad');
      const u = +who, r = +g('rs').value, ac = g('ac').value, ok = allowed(u, r, ac); ran = true;
      say(ok ? `<b>Allowed.</b> ${users[u]} holds a role on ${res[r]} that includes the ${ac} permission.` : `<b>Denied.</b> Authenticated as ${users[u]}, but no assigned role gives the ${ac} permission on ${res[r]}. Access is denied by default.`, ok ? 'ok' : 'bad');
    }
    draw();
  });
  draw();
};

  box.innerHTML = instr(cfg.instr) + `<div class="callout warn"><b>Teaching simulation.</b> This simple letter shifting is NOT real encryption. Real systems use strong algorithms such as AES.</div>
  <div class="vz-row"><label for="${ctx.uid}t">Message (plaintext)</label><input type="text" id="${ctx.uid}t" value="MEET AT NOON" maxlength="60"></div>
  <div class="vz-row"><label for="${ctx.uid}k">Secret key (1 to 25)</label><input type="number" id="${ctx.uid}k" min="1" max="25" value="3">${btn('enc', 'Encrypt', 'primary')}${btn('b64', 'Encode (Base64) instead')}${btn('reset', 'Reset')}</div>
  <div class="box"><b>Result (ciphertext or encoded text):</b> <span class="bits res">nothing yet</span></div>
  <div class="vz-row"><label for="${ctx.uid}k2">Try decrypting with key</label><input type="number" id="${ctx.uid}k2" min="1" max="25" value="5">${btn('dec', 'Decrypt result')}</div>
  <div class="box"><b>Decryption attempt:</b> <span class="bits dres">nothing yet</span></div>
  <div class="box"><h3>How TLS protects data in transit (high level)</h3><ol class="steps-list"><li>Your browser says hello and asks the server to prove its identity.</li><li>The server sends a certificate that a trusted authority has signed.</li><li>Browser and server agree on a shared secret key without sending it in the open.</li><li>They encrypt all further traffic with that key. This is the padlock in the address bar.</li></ol></div><div class="vz-status" role="status" aria-live="polite">Encrypt a message, then try decrypting with the wrong key.</div>`;
  const status = $('.vz-status', box), g = k => $('#' + ctx.uid + k, box); let last = '', lastKey = 0;
  const say = (t, c) => { status.className = 'vz-status ' + (c || ''); status.innerHTML = t; };
  const shift = (s, k) => s.replace(/[a-z]/gi, c => { const b = c <= 'Z' ? 65 : 97; return String.fromCharCode((c.charCodeAt(0) - b + k + 26) % 26 + b); });
  box.addEventListener('click', e => {
    const a = e.target.closest('[data-a]'); if (!a) return; const t = a.dataset.a, txt = g('t').value;
    if (t === 'reset') return ctx.remount();
    const k = +g('k').value; if (t !== 'dec' && t !== 'b64' && !(k >= 1 && k <= 25)) return say('Key must be a whole number from 1 to 25.', 'bad');
    if (t === 'enc') { last = shift(txt, k); lastKey = k; $('.res', box).textContent = last; did.enc = true; say('Encrypted. Without the key, the text looks meaningless. Encryption needs a key to reverse.', 'ok'); }
    if (t === 'b64') { try { last = btoa(unescape(encodeURIComponent(txt))); } catch (er) { return say('Could not encode that text.', 'bad'); } $('.res', box).textContent = last; did.b64 = true; lastKey = 0; say('Base64 is <b>encoding</b>, not encryption. Anyone can reverse it with no key, so it protects nothing.', 'warn'); }
    if (t === 'dec') {
      if (!last) return say('Encrypt something first.', 'warn'); const k2 = +g('k2').value;
      if (!lastKey) { let o = ''; try { o = decodeURIComponent(escape(atob(last))); } catch (er) { o = '(cannot decode)'; } $('.dres', box).textContent = o; return say('Decoded with no key at all. That is why encoding is not security.', 'warn'); }
      if (!(k2 >= 1 && k2 <= 25)) return say('Key must be a whole number from 1 to 25.', 'bad');
      const out = shift(last, -k2); $('.dres', box).textContent = out;
      if (k2 === lastKey) say('Correct key, so the original message is restored.', 'ok'); else { did.wrong = true; say('Wrong key, so the result is still gibberish. Protecting the key is as important as the algorithm.', 'warn'); }
    }
    if (did.enc && did.wrong && did.b64) ctx.done();
  });
};

/* ---- budget simulator ---- */

  $('.rows', box).innerHTML = rows.map((r, i) => `<div class="slider-row"><label for="${ctx.uid}r${i}">${esc(r.label)} (${money(r.rate)} per ${esc(r.unit)})</label><input type="range" id="${ctx.uid}r${i}" data-i="${i}" min="${r.min}" max="${r.max}" step="${r.step || 1}" value="${r.def}"><output>${r.def}</output>${cfg.tags ? `<select data-t="${i}" aria-label="Tag for ${esc(r.label)}">${cfg.tags.map(t => `<option ${t === r.tag ? 'selected' : ''}>${t}</option>`).join('')}</select>` : ''}</div>`).join('');
  const status = $('.vz-status', box), out = $('.out', box);

    if (cfg.tags) { const by = {}; costs.forEach((c, i) => by[tagv[i]] = (by[tagv[i]] || 0) + c); html += `<h3>Cost by tag (department)</h3><ul>${Object.keys(by).map(t => `<li>${esc(t)}: ${money(by[t])}</li>`).join('')}</ul>`; }
