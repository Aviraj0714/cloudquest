/* ---- disaster recovery simulator ---- */
VIZ.dr = (box, cfg, ctx) => {
  const F = { 15: '15 minutes', 60: '1 hour', 360: '6 hours', 1440: '24 hours' }, RTO = { none: 480, warm: 30, hot: 2 };
  const fmt = m => m >= 60 ? (m / 60).toFixed(m % 60 ? 1 : 0) + ' hours' : m + ' minutes';
  box.innerHTML = instr(cfg.instr) + `<div class="cols"><div class="box"><h3>Your plan</h3>
   <div class="vz-row"><label for="${ctx.uid}f">Backup frequency</label><select id="${ctx.uid}f">${Object.keys(F).map(k => `<option value="${k}" ${k === '1440' ? 'selected' : ''}>Every ${F[k]}</option>`).join('')}</select></div>
   <div class="vz-row"><label for="${ctx.uid}rd">Redundant resources</label><select id="${ctx.uid}rd"><option value="none">None (rebuild from backup)</option><option value="warm">Warm standby (small copy already running elsewhere)</option><option value="hot">Hot standby (full copy running and synced)</option></select></div></div>
   <div class="box"><h3>Business targets</h3><div class="vz-row"><label for="${ctx.uid}rp">RPO: most data loss allowed</label><select id="${ctx.uid}rp"><option value="15">15 minutes</option><option value="60" selected>1 hour</option><option value="360">6 hours</option><option value="1440">24 hours</option></select></div>
   <div class="vz-row"><label for="${ctx.uid}rt">RTO: longest downtime allowed</label><select id="${ctx.uid}rt"><option value="5">5 minutes</option><option value="30" selected>30 minutes</option><option value="120">2 hours</option><option value="480">8 hours</option></select></div>
   <div class="vz-row"><label for="${ctx.uid}ot">Outage happens at (hour of day)</label><input type="range" id="${ctx.uid}ot" min="0" max="23" value="10"><output>10:40</output></div></div></div>
  <div class="vz-controls">${btn('sim', 'Simulate outage', 'primary')}${btn('reset', 'Reset')}</div><svg viewBox="0 0 720 110" role="img" aria-label="Timeline of backups and outage"></svg><div class="vz-status" role="status" aria-live="polite">Set your plan and targets, then simulate an outage.</div><div class="res"></div>`;
  const status = $('.vz-status', box), g = k => $('#' + ctx.uid + k, box), svg = $('svg', box);
  const hour = () => +g('ot').value;
  function timeline(loss) {
    const fq = +g('f').value, at = hour() * 60 + 40; let o = '<line x1="30" y1="60" x2="690" y2="60" stroke="var(--line2)" stroke-width="4"/>';
    for (let m = 0; m <= 1440; m += fq) { const x = 30 + 660 * m / 1440; o += `<rect x="${x - 4}" y="50" width="8" height="20" fill="var(--accent)"><title>Backup</title></rect>`; }
    for (let h = 0; h <= 24; h += 4) o += `<text x="${30 + 660 * h / 24}" y="95" font-size="11" text-anchor="middle" fill="var(--muted)">${pad2(h % 24)}:00</text>`;
    const ox = 30 + 660 * at / 1440; o += `<path d="M${ox} 18 L${ox + 10} 40 L${ox - 10} 40 Z" fill="var(--bad)"/><text x="${ox}" y="14" font-size="12" text-anchor="middle" fill="var(--ink)">Outage</text>`;
    if (loss != null) { const lx = 30 + 660 * (at - loss) / 1440; o += `<rect x="${lx}" y="42" width="${ox - lx}" height="6" fill="var(--bad)"><title>Data lost</title></rect>`; }
    svg.innerHTML = o + '<text x="30" y="30" font-size="11" fill="var(--muted)">Green marks are backups. The red bar shows data created since the last backup.</text>';
  }
  box.addEventListener('input', e => { if (e.target.id === ctx.uid + 'ot') { e.target.nextElementSibling.textContent = pad2(hour()) + ':40'; } timeline(null); });
  box.addEventListener('change', () => timeline(null));
  box.addEventListener('click', e => {
    const a = e.target.closest('[data-a]'); if (!a) return; if (a.dataset.a === 'reset') return ctx.remount();
    const fq = +g('f').value, red = g('rd').value, rpo = +g('rp').value, rto = +g('rt').value, at = hour() * 60 + 40, loss = at % fq, rt = RTO[red];
    timeline(loss); const okP = loss <= rpo, okT = rt <= rto;
    $('.res', box).innerHTML = `<ol class="steps-list"><li><b>Detect:</b> monitoring notices the outage.</li><li><b>${red === 'none' ? 'Restore' : 'Fail over'}:</b> ${red === 'none' ? 'a new environment is built and the latest backup is restored' : 'traffic is switched to the standby copy'}. This takes about ${fmt(rt)}.</li><li><b>Verify:</b> the team checks that the service and data are healthy.</li><li><b>Recover the primary:</b> later, the original site is repaired and traffic can be switched back.</li></ol>
    <dl class="kv"><dt>Data lost</dt><dd>${fmt(loss || 0)} of newest data (worst case is the backup interval, ${fmt(fq)}). Your RPO target: ${fmt(rpo)}. <span class="tag ${okP ? 'ok' : 'bad'}">${okP ? 'RPO met' : 'RPO not met'}</span></dd><dt>Downtime</dt><dd>${fmt(rt)}. Your RTO target: ${fmt(rto)}. <span class="tag ${okT ? 'ok' : 'bad'}">${okT ? 'RTO met' : 'RTO not met'}</span></dd></dl>`;
    status.className = 'vz-status ' + (okP && okT ? 'ok' : 'warn');
    status.textContent = okP && okT ? 'Both targets met. More frequent backups and standby copies cost more, so real plans balance protection against cost.' : `Not both targets met. ${!okP ? 'More frequent backups reduce data loss (RPO). ' : ''}${!okT ? 'Standby resources reduce downtime (RTO).' : ''}`;
    ctx.done();
  });
  timeline(null);
};

  obj: ['Describe what an application is', 'Follow the steps from a click to a screen update', 'Explain why RAM and the CPU both matter'],
  what: 'An <b>application</b> is a program that helps you do a task, such as a browser or a game. It is stored as files on your storage drive. When you open it, the operating system copies the program into <b>RAM</b> and the <b>CPU</b> runs its instructions. Data the app is using, such as an open document, also lives in RAM until you save it to storage.',
  ana: 'Opening an app is like taking a recipe book off the shelf (storage) and placing it on the counter (RAM) so the cook (CPU) can follow it.',
  why: 'Cloud servers run applications too. Understanding what an app needs, CPU time, memory and storage, is exactly how you later choose the right size of a cloud virtual machine.',
  ex: 'You double click a video editor. It takes a few seconds to start because the program is being loaded from the SSD into RAM. Large projects need more RAM, and if RAM runs out the computer slows down.',
  how: ['You click the application icon.', 'The <b>operating system</b> receives the click and finds the program on storage.', 'The program is loaded into <b>RAM</b>.', 'The <b>CPU</b> fetches and runs instructions one after another.', 'Results are shown on the screen. Unsaved data stays in RAM until you save it.'],
  tryit: 'Press Start to watch the whole process, or use Next step and Previous step to move slowly.',
  mist: ['Closing a program without saving loses unsaved work, because that data was only in RAM.', 'A faster CPU alone does not fix everything. Too little RAM can also make apps slow.'],
  rem: 'Opening an app loads it from storage into RAM, then the CPU runs it and the screen shows the output.',
  quick: TF('When you open an application, its instructions are run by the CPU.', true, 'The CPU executes the instructions of the running program.'),
  viz: {
    t: 'steps', w: 720, h: 250, alt: 'Diagram of steps when opening an application', instr: 'Press Start or step through the process. Each step highlights the parts involved.',
    nodes: [{ id: 'you', label: 'You', x: 70, y: 125 }, { id: 'os', label: 'Operating system', x: 220, y: 125, sub: 'manages everything' }, { id: 'sto', label: 'Storage', x: 370, y: 45, sub: 'app files live here' }, { id: 'ram', label: 'RAM', x: 370, y: 205, sub: 'active data' }, { id: 'cpu', label: 'CPU', x: 520, y: 125, sub: 'runs instructions' }, { id: 'scr', label: 'Screen', x: 650, y: 125 }],
    steps: [
      { from: 'you', to: 'os', pkt: 'Click', text: 'You click the application icon. The operating system receives the click.' },
      { from: 'os', to: 'sto', pkt: 'Find app', text: 'The operating system finds the program files on storage.' },
      { from: 'sto', to: 'ram', pkt: 'Load', text: 'The program is copied from storage into RAM so it can be used quickly.' },
      { from: 'ram', to: 'cpu', pkt: 'Instructions', text: 'The CPU fetches instructions from RAM and processes them.' },
      { from: 'cpu', to: 'ram', pkt: 'Results', text: 'Results and active data, like your open document, are held in RAM.' },
      { from: 'cpu', to: 'scr', pkt: 'Output', text: 'The application displays its output on the screen. The app is now running.' }]
  },
  chal: {
    title: 'Who Does What?', intro: 'Match each part of the process with its job.', qs: [
      MT('Match each part with what it does when an app opens.', [['Operating system', 'Loads the program into memory'], ['CPU', 'Executes the program instructions'], ['RAM', 'Holds the data the app is using right now'], ['Screen', 'Shows the output of the app']], 'Each part has one clear job in this pipeline.'),
      SC('Scenario: a student opens ten browser tabs and a video editor. Everything becomes slow and the computer only has 4 GB of RAM. What is the most likely cause?', 'RAM is nearly full, so the computer is short of working memory', ['The monitor is too small', 'The keyboard is broken', 'The internet cable is loose'], 'Running apps and their data live in RAM. When it fills up, the computer slows down.')]
  },
  quiz: [
    Q('Where is a program copied to before the CPU runs it?', 'RAM', ['The monitor', 'The keyboard', 'The power supply'], 'Programs run from RAM because it is much faster than storage.'),
    Q('Why can unsaved work be lost if the power fails?', 'It was held in RAM, which is cleared without power', ['The CPU deletes it', 'Storage cannot save anything', 'The screen erases it'], 'RAM is temporary.', 'i'),
    Q('Which part first receives your click on an app icon?', 'The operating system', ['The SSD only', 'The keyboard cable', 'The power button'], 'The operating system manages input and starts programs.')]
});

/* ---------- LEVEL 1 ---------- */
M('1.1', 'What Is the Internet?', 'A network of networks', {
  obj: ['Define the internet as a network of networks', 'Explain clients, servers, requests and responses', 'Follow a request from your laptop to a web server and back'],
  what: 'The <b>internet</b> is a giant <b>network of networks</b>. Millions of smaller networks, at homes, colleges, companies and internet providers, are connected so devices can exchange data. Your device is a <b>client</b> that asks for things. A <b>server</b> is a computer that stores data or services and answers those requests. Data travels in small pieces called <b>packets</b>.',
  ana: 'The postal system is a helpful comparison: letters (packets) travel through many sorting offices (routers) to reach an address. Internet routing is automatic and far faster than post.',
  why: 'Cloud computing is delivered over the internet. If you understand requests and responses, you already understand how you reach cloud services.',
  ex: 'When a student opens YouTube, the browser sends a <b>request</b> for a video. A YouTube server sends back a <b>response</b> containing the video data, which your browser plays.',
  how: ['Your browser creates a <b>request</b>.', 'Your <b>home router</b> forwards it out of your home network.', 'The request crosses the <b>internet</b> through many routers.', 'The <b>web server</b> receives it and prepares the data.', 'The server sends a <b>response</b> back along a similar path, and your browser shows it.'],
  tryit: 'Press Start to send a request from the laptop to the server and watch the response return.',
  mist: ['The internet is not the same as the web. The web is one service that runs on the internet. Email and games use it too.', 'The internet is not owned by one company. It is many connected networks.'],
  rem: 'The internet connects networks. Clients send requests, servers send responses, and data moves as packets.',
  quick: TF('A server is a computer that answers requests from clients.', true, 'Servers provide data or services to clients.'),
  viz: {
    t: 'steps', w: 720, h: 220, alt: 'Request and response between a laptop and a web server', instr: 'Watch the request go out and the response come back. Notice the two directions.',
    nodes: [{ id: 'lap', label: 'Student laptop', x: 80, y: 110, sub: 'client' }, { id: 'rou', label: 'Home router', x: 260, y: 110 }, { id: 'net', label: 'Internet', x: 440, y: 110, sub: 'many networks' }, { id: 'srv', label: 'Web server', x: 630, y: 110, sub: 'server' }],
    steps: [
      { from: 'lap', to: 'rou', pkt: 'Request', text: 'Request: the laptop asks for a page or video and sends it to the home router.' },
      { from: 'rou', to: 'net', pkt: 'Request', text: 'Request: the router passes the data into the internet.' },
      { from: 'net', to: 'srv', pkt: 'Request', text: 'Request: routers across the internet deliver it to the web server.' },
      { at: 'srv', from: 'srv', to: 'srv', pkt: 'Working', text: 'Server response preparation: the server finds the requested data.' },
      { from: 'srv', to: 'net', pkt: 'Response', text: 'Response: the server sends the data back into the internet.' },
      { from: 'net', to: 'rou', pkt: 'Data', text: 'Data transfer: the packets travel back toward your home.' },
      { from: 'rou', to: 'lap', pkt: 'Page', text: 'The laptop receives the response and the browser displays it.' }]
  },
  chal: {
    title: 'Internet Vocabulary', intro: 'Match the words you just learned.', qs: [
      MT('Match each term with its meaning.', [['Client', 'A device that asks for data or services'], ['Server', 'A computer that stores data and answers requests'], ['Router', 'A device that forwards data between networks'], ['Response', 'The data a server sends back']], 'These four words appear in almost every cloud topic.'),
      SC('Scenario: you open a college website and the page loads. Which statement is correct?', 'Your browser acted as a client and the college web server responded', ['Your browser acted as the server', 'The router created the website', 'No data crossed any network'], 'The browser requests, and the web server responds.')]
  },
  quiz: [
    Q('The internet is best described as...', 'A network of networks', ['One giant computer', 'A single company', 'A type of software only'], 'Many networks are linked together.'),
    Q('What is a packet?', 'A small piece of data sent across a network', ['A type of router', 'A physical cable', 'A web browser'], 'Large data is split into packets for transport.'),
    Q('Which is the correct order?', 'Request, then response', ['Response, then request', 'Server asks, client answers', 'Both at the same instant always'], 'The client normally starts with a request.')]
});

M('1.2', 'IP Addresses', 'How devices are found on a network', {
  obj: ['Explain what an IP address is', 'Read an IPv4 address and tell private from public', 'Know why IPv6 exists'],
  what: 'An <b>IP address</b> is a number label that identifies a device on a network so data can be delivered to it. An <b>IPv4</b> address has four numbers from 0 to 255 separated by dots, such as 192.168.1.10. <b>Private</b> addresses are used inside homes and organizations and are not reachable directly from the internet. <b>Public</b> addresses are reachable on the internet. <b>IPv6</b> is a newer, much longer format created because IPv4 addresses are running out.',
  ana: 'An IP address is like a postal address for a device. Analogy limit: a device can get a different IP address when it joins a different network, unlike a house.',
  why: 'Data can only be delivered if it has a destination. Every cloud server, virtual machine and network you build will use IP addresses.',
  ex: 'At home, your laptop may be 192.168.1.10 and your phone 192.168.1.11. Your router has a private address 192.168.1.1 inside and one public address facing your internet provider.',
  how: ['A device joins a network and receives an address, often automatically.', 'When it sends data, the packet carries a <b>source</b> and a <b>destination</b> IP address.', 'Routers read the destination and forward the packet closer to it.', 'Private ranges are 10.x.x.x, 172.16.x.x to 172.31.x.x and 192.168.x.x.'],
  tryit: 'Click each simulated device to see its address. These are made up, and nothing on your real network is detected.',
  mist: ['Private addresses like 192.168.1.10 are reused in millions of homes. They are not unique across the whole internet.', 'An IP address is not a device serial number. It can change.'],
  rem: 'IP addresses tell the network where to deliver data. IPv4 uses four numbers, private addresses stay inside networks, and IPv6 gives many more addresses.',
  quick: TF('Addresses starting with 192.168 are private addresses.', true, '192.168.0.0 to 192.168.255.255 is a private range.'),
  viz: {
    t: 'explorer', instr: 'Click each simulated device to inspect its address and type.',
    items: [
      { id: 'lap', label: 'Laptop', ic: 'PC', text: 'Your laptop receives a private IP address from the home router.', props: [['IP address', '192.168.1.10'], ['Type', 'Private']] },
      { id: 'pho', label: 'Phone', ic: 'PH', text: 'Your phone connects over Wi-Fi and gets its own private address.', props: [['IP address', '192.168.1.11'], ['Type', 'Private']] },
      { id: 'rou', label: 'Router (inside)', ic: 'RT', text: 'The inside address of the router is called the default gateway. Devices send traffic for other networks here.', props: [['IP address', '192.168.1.1'], ['Type', 'Private, default gateway']] },
      { id: 'pub', label: 'Router (outside)', ic: 'WAN', text: 'The internet facing side of the router has a public address from your provider.', props: [['IP address', '203.0.113.25 (example)'], ['Type', 'Public']] },
      { id: 'six', label: 'IPv6 example', ic: 'v6', text: 'IPv6 addresses use hexadecimal groups and there are enough for every device on Earth.', props: [['IP address', '2001:db8::10 (example)'], ['Type', 'IPv6']] }]
  },
  chal: {
    title: 'Which Device Receives the Packet?', intro: 'Use the device list: laptop 192.168.1.10, phone 192.168.1.11, router 192.168.1.1.', qs: [
      SC('A packet is addressed to 192.168.1.11. Which device on the home network should receive it?', 'The phone', ['The laptop', 'The router only', 'No device'], 'The destination address matches the phone.', 'b'),
      SC('A laptop wants to reach a website outside the home network. Where does it send the packet first?', 'To the router at 192.168.1.1', ['To the phone at 192.168.1.11', 'Directly to the website with no help', 'To itself'], 'The default gateway forwards traffic to other networks.'),
      ID('Select every private IPv4 address.', [['192.168.0.7', true], ['10.20.30.40', true], ['172.16.9.9', true], ['8.8.8.8', false], ['172.32.1.1', false]], 'Private ranges are 10.0.0.0/8, 172.16.0.0 to 172.31.255.255 and 192.168.0.0/16. 172.32.x.x is public.')]
  },
  quiz: [
    Q('How many numbers are in an IPv4 address?', 'Four, each from 0 to 255', ['Two, each from 0 to 9', 'Six, each from 0 to 99', 'One large word'], 'IPv4 is four 8-bit numbers.'),
    Q('Why was IPv6 created?', 'IPv4 addresses are running out', ['IPv4 is too slow to type', 'Routers cannot read IPv4', 'Phones need a different alphabet'], 'IPv6 has a vastly larger address space.'),
    Q('Which address is a public IP address?', '8.8.8.8', ['192.168.1.5', '10.0.0.9', '172.20.1.1'], 'The others are in private ranges.', 'i')]
});

M('1.3', 'MAC Addresses', 'The identity of a network interface', {
  obj: ['Explain what a MAC address is', 'Tell MAC addresses and IP addresses apart', 'Describe how they work on a local network'],
  what: 'A <b>MAC address</b> identifies a <b>network interface</b>, the hardware or virtual adapter that connects a device to a network, such as a Wi-Fi card. It is written as six pairs of characters, like 3C:22:FB:8A:01:5E. A MAC address is used for delivery <b>inside one local network</b>. An IP address is used to find devices across networks and can change.',
  ana: 'If the IP address is where you are staying right now, the MAC address is more like a name on the network card. Analogy limit: MAC addresses can sometimes be changed or randomized by software for privacy.',
  why: 'Switches deliver data inside a LAN using MAC addresses. Cloud virtual machines also have virtual network interfaces with MAC addresses.',
  ex: 'At a college lab, a computer sends a file to the lab printer. The switch reads the printer MAC address and forwards the data to the right port.',
  how: ['Each network interface has a MAC address.', 'On a local network, a device that knows the destination IP asks who owns it, and learns the MAC address.', 'Data is sent inside a frame with source and destination MAC addresses.', 'A switch forwards the frame only toward the matching device.'],
  tryit: 'Inspect each simulated device. Compare its MAC address with its IP address.',
  mist: ['MAC and IP are not the same. IP can change with the network. MAC belongs to the interface.', 'MAC addresses are used locally. They are not used to route across the internet.'],
  rem: 'A MAC address identifies a network interface and is used on the local network. An IP address identifies a device on a network for routing.',
  quick: TF('A MAC address is used to route data across the whole internet.', false, 'MAC addresses work on the local network. Routing across networks uses IP addresses.'),
  viz: {
    t: 'explorer', instr: 'Select a device to inspect its interface information. All values are simulated.',
    items: [
      { id: 'lap', label: 'Laptop', ic: 'PC', text: 'The laptop has a Wi-Fi interface and a wired Ethernet interface, each with its own MAC address.', props: [['Interface', 'Wi-Fi'], ['MAC address', '3C:22:FB:8A:01:5E'], ['IP address', '192.168.1.10']] },
      { id: 'pho', label: 'Phone', ic: 'PH', text: 'Phones connect by Wi-Fi. Many phones use a private randomized MAC for each network to protect privacy.', props: [['Interface', 'Wi-Fi'], ['MAC address', 'A4:83:E7:12:9C:20'], ['IP address', '192.168.1.11']] },
      { id: 'pri', label: 'Printer', ic: 'PR', text: 'The lab printer has one wired interface. Switches learn its MAC address to send print jobs to the correct port.', props: [['Interface', 'Ethernet'], ['MAC address', '00:1B:44:11:3A:B7'], ['IP address', '192.168.1.20']] },
      { id: 'rou', label: 'Router', ic: 'RT', text: 'The router has several interfaces, one for the local network and one for the internet, each with a different MAC address.', props: [['Interface', 'LAN side'], ['MAC address', 'D8:47:32:5F:0A:11'], ['IP address', '192.168.1.1']] }]
  },
  chal: {
    title: 'IP or MAC?', intro: 'Sort out the two kinds of addresses.', qs: [
      MT('Match each description with the correct term.', [['Logical address that can change on a new network', 'IP address'], ['Identifier tied to a network interface', 'MAC address'], ['Hardware or virtual adapter that connects to a network', 'Network interface'], ['Device that connects different networks', 'Router']], 'IP addresses are logical and can change. MAC addresses belong to interfaces.'),
      ID('Select every true statement.', [['A MAC address is written as six pairs of hexadecimal characters', true], ['A switch uses MAC addresses to deliver data inside a LAN', true], ['MAC addresses are used to route packets between continents', false], ['A laptop with Wi-Fi and Ethernet can have two MAC addresses', true]], 'Routing between networks uses IP addresses.')]
  },
  quiz: [
    Q('What does a MAC address identify?', 'A network interface', ['A website', 'A cloud region', 'A file'], 'It belongs to a network adapter.'),
    Q('Which device mainly uses MAC addresses to deliver data inside a local network?', 'Switch', ['Web browser', 'Monitor', 'Keyboard'], 'Switches learn which MAC address is on which port.'),
    Q('Which address is more likely to change when a laptop joins a new network?', 'IP address', ['MAC address of the Wi-Fi card', 'Both never change', 'Neither can change'], 'A new network usually assigns a new IP address.', 'i')]
});

const dnsSteps = (name, ip) => [
  { at: 'brw', from: 'brw', to: 'brw', pkt: name, text: `You type <b>${name}</b> into the browser. The browser needs an IP address.` },
  { from: 'brw', to: 'cac', pkt: 'Known?', text: 'The browser checks its cache, a small memory of names it looked up recently. This one is not there yet.' },
  { from: 'brw', to: 'res', pkt: 'Who is ' + name + '?', text: 'The browser asks the DNS resolver, a helper server run by your provider or college.' },
  { from: 'res', to: 'dns', pkt: 'Lookup', text: 'The resolver looks the name up in the DNS system. This is a simplified view of a chain of DNS servers.' },
  { from: 'dns', to: 'res', pkt: ip, text: `DNS answers: <b>${name}</b> is at IP address <b>${ip}</b> (simulated).` },
  { from: 'res', to: 'brw', pkt: ip, text: 'The resolver returns the IP address to the browser, which saves it in the cache for next time.' },
  { from: 'brw', to: 'web', pkt: 'Connect', text: `The browser connects to ${ip} and the website starts loading.` }];
M('1.4', 'DNS', 'The phone book of the internet', {
  obj: ['Explain why we use domain names', 'Describe simplified DNS resolution', 'Explain what a DNS cache does'],
  what: '<b>DNS</b> (Domain Name System) turns human friendly <b>domain names</b> such as google.com into <b>IP addresses</b> that computers use. People remember names easily, but networks deliver data by IP address. A <b>DNS lookup</b> is the process of finding the address for a name. Answers are stored in a <b>cache</b> for a while so the next visit is faster.',
  ana: 'DNS is like the contacts list in your phone: you pick a name and the phone dials the number. Analogy limit: real DNS is a distributed system of many servers, not one list.',
  why: 'Servers may change IP addresses, but the name can stay the same. Cloud services rely on DNS everywhere to point names to servers.',
  ex: 'A student types google.com. The browser asks DNS for the address, gets an IP address, and then connects to it.',
  how: ['You enter a domain name.', 'The browser checks its <b>cache</b>.', 'If not found, the <b>DNS resolver</b> is asked.', 'DNS finds the IP address (simplified here).', 'The browser connects to that IP address.'],
  tryit: 'Choose a domain and step through the lookup. All data is simulated and no live DNS lookup is performed.',
  mist: ['DNS does not load the website. It only finds the address. The browser then connects to it.', 'A domain name is not the same thing as the server. Many names can point to one server.'],
  rem: 'DNS translates domain names into IP addresses so browsers can connect to the right server.',
  quick: TF('DNS translates a domain name into an IP address.', true, 'That is the main job of DNS.'),
  viz: {
    t: 'steps', w: 720, h: 250, optLabel: 'Domain to look up', alt: 'DNS lookup steps', instr: 'Pick a domain, then press Start. Watch the browser check its cache, ask the resolver and connect.',
    nodes: [{ id: 'brw', label: 'Browser', x: 75, y: 130 }, { id: 'cac', label: 'Browser cache', x: 230, y: 40 }, { id: 'res', label: 'DNS resolver', x: 330, y: 130 }, { id: 'dns', label: 'DNS records', x: 530, y: 130, sub: 'simulated' }, { id: 'web', label: 'Website server', x: 620, y: 215 }],
    options: [{ label: 'college.example', steps: dnsSteps('college.example', '203.0.113.10') }, { label: 'shop.example', steps: dnsSteps('shop.example', '198.51.100.20') }, { label: 'video.example', steps: dnsSteps('video.example', '192.0.2.30') }]
  },
  chal: {
    title: 'Match the Domain to the IP', intro: 'Simulated DNS table: college.example is 203.0.113.10, shop.example is 198.51.100.20, video.example is 192.0.2.30, exam.example is 203.0.113.99.', qs: [
      MT('Using the simulated DNS table in the introduction, match each domain with its IP address.', [['college.example', '203.0.113.10'], ['shop.example', '198.51.100.20'], ['video.example', '192.0.2.30'], ['exam.example', '203.0.113.99']], 'DNS records connect names to addresses.'),
      SC('Scenario: you visited video.example yesterday and visit it again. Why is the page start faster?', 'The browser or resolver cached the DNS answer', ['DNS is skipped forever for all sites', 'The website changed its name', 'The keyboard is faster'], 'Cached answers avoid repeating the full lookup.')]
  },
  quiz: [
    Q('Why do people use domain names instead of IP addresses?', 'Names are easier to remember', ['IP addresses do not exist', 'Names are faster than any address', 'Browsers cannot use IP addresses'], 'DNS lets people use names while computers use numbers.'),
    Q('What is the first place a browser looks for a DNS answer?', 'Its own cache', ['The keyboard', 'The web server', 'The CPU fan'], 'A cached answer saves time.'),
    Q('After DNS returns an IP address, what happens next?', 'The browser connects to that address', ['The website is deleted', 'The router turns off', 'A new domain is created'], 'DNS finds the address and the browser then connects.', 'i')]
});

M('1.5', 'HTTP and HTTPS', 'How browsers and web servers talk', {
  obj: ['Describe an HTTP request and response', 'Recognise status codes 200, 404 and 500', 'Explain what HTTPS adds'],
  what: '<b>HTTP</b> is the set of rules browsers and web servers use to exchange web pages. The browser sends a <b>request</b> with a <b>method</b> (GET asks for data, POST sends data) and a URL. The server returns a <b>response</b> with a <b>status code</b>: 200 means success, 404 means not found, 500 means the server had an error. <b>HTTPS</b> is HTTP protected by encryption, so others cannot read or change the data in transit.',
  ana: 'Ordering at a restaurant: your order is the request, the dish is the response, and "we are out of that" is like a 404. Analogy limit: HTTP requests are text messages between computers.',
  why: 'Almost every cloud service is reached with HTTP requests, including websites, APIs and the Azure portal. Reading status codes helps you debug problems.',
  ex: 'A student logs in to the online examination portal. The browser sends a POST request with the login form. If the password is right the server replies 200 OK.',
  how: ['The browser sends a request line such as GET /courses.', 'The server processes the request.', 'The server sends a status code and a body (the page or data).', 'With HTTPS, the request and response are encrypted in transit.'],
  tryit: 'Choose method, scheme, path and server state. Send requests to see success and error responses. This is a simulation.',
  mist: ['404 does not mean the internet is broken. The server worked but the page was not found.', 'The padlock means the connection is encrypted. It does not prove the website is trustworthy.'],
  rem: 'HTTP is request and response. Status 2xx is success, 4xx is a client side problem and 5xx is a server side problem. HTTPS encrypts the traffic.',
  quick: TF('Status code 404 means the requested page was not found.', true, '404 Not Found.'),
  viz: { t: 'http', instr: 'Pick settings and press Send request. Try GET and POST, https and http, and a broken server.' },
  chal: {
    title: 'Status Code Match', intro: 'Connect codes to their meaning.', qs: [
      MT('Match each status code with its meaning.', [['200', 'OK, the request succeeded'], ['404', 'Not found'], ['500', 'Internal server error'], ['403', 'Forbidden, access not allowed']], 'Groups: 2xx success, 4xx client problem, 5xx server problem.'),
      TF('HTTPS makes a website automatically safe from all dangers.', false, 'HTTPS protects data in transit. A site can still be malicious or badly built.', 'i')]
  },
  quiz: [
    Q('Which method asks the server to give you data?', 'GET', ['POST only', 'DELETE only', 'SHOUT'], 'GET retrieves data.'),
    Q('The server crashes while handling your request. Which status code is most likely?', '500', ['200', '404', '301'], '5xx means a server side error.', 'i'),
    Q('What does HTTPS add to HTTP?', 'Encryption of data in transit', ['Faster internet speed', 'A new IP address', 'A free domain name'], 'The S stands for secure.')]
});

/* ---------- LEVEL 2 ---------- */
M('2.1', 'What Is a Network?', 'Connecting devices', {
  obj: ['Define a network and name its devices', 'Tell LAN from WAN', 'Build a small working network'],
  what: 'A <b>network</b> is a group of devices connected so they can share data. A <b>LAN</b> (local area network) covers a small area such as a home, lab or office floor. A <b>WAN</b> (wide area network) spans cities or countries, and the <b>internet</b> is the largest WAN. Common devices are computers, <b>switches</b> that connect devices inside a LAN, and <b>routers</b> that connect networks to each other.',
  ana: 'A LAN is like the corridors inside one building. A WAN is the highway system between buildings in different cities.',
  why: 'Cloud data centers are huge networks. Every cloud design starts with how devices, servers and networks connect.',
  ex: 'In a college computer lab, every computer plugs into a switch. The switch connects to a router, which connects the lab to the college network and the internet.',
  how: ['Devices connect to a <b>switch</b> to form a LAN.', 'The switch connects to a <b>router</b>.', 'The router connects the LAN to other networks such as the internet or a server network.', 'Data flows across these links.'],
  tryit: 'Click one device, then another, to connect them. Build: both computers to the switch, the switch to the router, the router to the server.',
  mist: ['Wi-Fi is not a separate kind of network. It is one way to connect devices to a LAN.', 'A switch does not connect your LAN to the internet. A router does that.'],
  rem: 'Networks connect devices. Switches build LANs, routers connect networks, and the internet is a WAN of WANs.',
  quick: TF('A router connects a LAN to other networks.', true, 'Routers connect networks together.'),
  viz: {

    links: [['c1', 'sw'], ['c2', 'sw'], ['sw', 'rt'], ['rt', 'sv']], path: ['c1', 'sw', 'rt', 'sv'], pktLabels: ['Data', 'Data', 'Data'], okMsg: 'The network is complete. Press Send test packet.', sentMsg: 'The packet traveled from Computer A through the switch and router to the server. Your network works.'

});

M('2.2', 'Switch vs Router', 'Moving data inside and between networks', {
  obj: ['Explain what a switch does', 'Explain what a router does', 'Describe the default gateway'],
  what: 'A <b>switch</b> connects devices inside the same network and delivers frames to the right device using MAC addresses. A <b>router</b> connects different networks and forwards packets using IP addresses. When a device wants to reach another network, it sends the packet to its <b>default gateway</b>, which is the router on its own network.',
  ana: 'A switch is the mail clerk inside one office building. A router is the delivery service between buildings.',
  why: 'Cloud virtual networks copy this idea: subnets are like LANs, and route tables and gateways decide how traffic leaves them.',
  ex: 'A student prints a document to the lab printer (same LAN, only the switch is needed). Then they open a website (different network, the router is needed).',
  how: ['The sender checks if the destination is on its own network.', 'If yes, the packet goes through the switch to the destination.', 'If no, the sender sends it to the default gateway (the router).', 'The router forwards it toward the destination network.'],
  tryit: 'Choose a destination and watch how the path differs. Real routing depends on how the network is configured, so this is simplified.',
  mist: ['A switch and a router are not the same. Many home devices combine both in one box, which causes confusion.', 'Not every packet goes through a router. Local traffic stays inside the LAN.'],
  rem: 'Switches connect devices in a LAN. Routers connect networks. The default gateway is the door out of your network.',
  quick: TF('Traffic between two computers on the same LAN always needs a router.', false, 'Same LAN traffic goes through the switch only.'),
  viz: {
    t: 'steps', w: 720, h: 260, optLabel: 'Where should the packet go?', alt: 'Packet delivery paths', instr: 'Choose a destination and press Start. Compare the paths.',
    nodes: [{ id: 'pa', label: 'PC A', x: 70, y: 70, sub: '192.168.1.10' }, { id: 'pb', label: 'PC B', x: 70, y: 200, sub: '192.168.1.12' }, { id: 'sw', label: 'Switch', x: 250, y: 135 }, { id: 'rt', label: 'Router', x: 420, y: 135, sub: 'default gateway' }, { id: 'ds', label: 'Destination network', x: 630, y: 135, sub: 'web server' }],
    options: [
      { label: 'PC B on the same network', steps: [{ from: 'pa', to: 'sw', pkt: 'To PC B', text: 'PC A sends the data to the switch. PC B has an address on the same network, so no router is needed.' }, { from: 'sw', to: 'pb', pkt: 'To PC B', text: 'The switch delivers the data to PC B using its MAC address.' }] },
      { label: 'A web server on another network', steps: [{ from: 'pa', to: 'sw', pkt: 'To web', text: 'The destination is not on the local network, so PC A sends the packet toward its default gateway through the switch.' }, { from: 'sw', to: 'rt', pkt: 'To web', text: 'The switch passes it to the router, which is the default gateway.' }, { from: 'rt', to: 'ds', pkt: 'To web', text: 'The router forwards the packet toward the destination network. Real paths cross many routers.' }] }]
  },
  chal: {
    title: 'Switch or Router?', intro: 'Decide which device does the job.', qs: [
      MT('Match each job with the device.', [['Connect devices inside the same LAN', 'Switch'], ['Connect two different networks', 'Router'], ['Door out of the local network', 'Default gateway'], ['Delivers frames using MAC addresses', 'Switch']].slice(0, 3), 'Switches work locally, routers between networks.'),
      SC('Scenario: two lab computers exchange a file and nothing leaves the lab. Which device is essential for this transfer?', 'The switch', ['The internet provider router only', 'A DNS server', 'A cloud region'], 'Local traffic only needs the switch.')]
  },
  quiz: [
    Q('What is a default gateway?', 'The router a device uses to reach other networks', ['A type of monitor', 'A backup drive', 'A program that opens apps'], 'It is the exit from the local network.'),
    Q('Which device forwards packets between networks using IP addresses?', 'Router', ['Switch', 'Keyboard', 'SSD'], 'Routers work between networks.'),
    Q('A phone on the home Wi-Fi visits a website on the internet. Which device must handle the packet after your LAN?', 'The router', ['The printer', 'The monitor', 'The mouse'], 'Traffic to other networks goes to the router.', 'i')]
});

M('2.3', 'Ports and Protocols', 'Doors on a server', {
  obj: ['Explain what a port is', 'Compare TCP and UDP', 'Match common services to common ports'],
  what: 'A <b>port</b> is a number that identifies a specific service on a device, so one server can offer many services at the same IP address. A <b>protocol</b> is an agreed set of rules for communication. <b>TCP</b> is reliable: it checks that data arrives and is in order. <b>UDP</b> is faster and lighter but does not guarantee delivery. Common ports: HTTP 80, HTTPS 443, SSH 22, DNS 53.',
  ana: 'The IP address is the building and the port is the door number of the office inside. Analogy limit: ports are not physical doors, they are numbers used by software.',
  why: 'Cloud firewalls and security rules are written in terms of ports. Opening the right ports, and only those, is a daily cloud task.',
  ex: 'A college web server receives web requests on port 443, and an administrator connects to manage it over SSH on port 22, both at the same IP address.',
  how: ['A client picks the destination IP address and port.', 'The server has a program listening on that port.', 'TCP sets up a connection and makes sure data arrives.', 'A firewall decides which ports may be reached.'],
  tryit: 'Assign the usual port to each service, then design a firewall for a public college website.',
  mist: ['An open port does not mean a service works. A program must also be running and listening.', 'Do not open ports just in case. Each open port is a possible way in.'],
  rem: 'IP address plus port identifies a service. TCP is reliable, UDP is fast, and common ports are 80, 443, 22 and 53.',
  quick: TF('HTTPS normally uses port 443.', true, 'Port 443 is the standard HTTPS port.'),
  viz: { t: 'ports', instr: 'Complete step 1 by choosing ports, then step 2 by choosing which ports the firewall should allow.' },
  chal: {
    title: 'Ports and Protocols', intro: 'Match services with ports.', qs: [
      MT('Match each service with its standard port.', [['HTTP', '80'], ['HTTPS', '443'], ['SSH', '22'], ['DNS', '53']], 'These four are worth memorising.'),
      SC('Scenario: a video call needs speed and can tolerate a few lost packets. Which transport protocol suits it better?', 'UDP', ['TCP because it is always faster', 'Neither', 'HTTP because it has a port'], 'UDP avoids the delay of retransmission, useful for live audio and video.')]
  },
  quiz: [
    Q('What is a port?', 'A number that identifies a service on a device', ['A physical socket for the mouse', 'A type of switch', 'A cloud region'], 'Ports let one IP address host many services.'),
    Q('Which protocol guarantees delivery and order?', 'TCP', ['UDP', 'Neither', 'Both equally'], 'TCP is connection oriented and reliable.'),
    Q('Which port is standard for SSH?', '22', ['80', '443', '53'], 'SSH uses port 22.')]
});

M('2.4', 'CIDR and Subnet Basics', 'Splitting networks into ranges', {
  obj: ['Read CIDR notation such as /24', 'Find the network, broadcast and usable range', 'Count usable hosts'],
  what: 'An IPv4 address has a <b>network portion</b> and a <b>host portion</b>. <b>CIDR notation</b> such as 192.168.1.0/24 writes the number of network bits after a slash. The <b>subnet mask</b> shows the same thing as a number: /24 is 255.255.255.0. A /24 leaves 8 host bits, so it has 256 addresses. The first is the <b>network address</b> and the last is the <b>broadcast address</b>, so 254 are usable for hosts.',
  ana: 'Think of a phone number where the area code is the network part and the local number is the host part. Analogy limit: CIDR can split at any bit, not only at fixed digits.',
  why: 'Every cloud virtual network and subnet is defined by a CIDR range. Choosing sizes wisely avoids running out of addresses or overlapping ranges.',
  ex: 'A college gives the library 192.168.1.0/26. That is 64 addresses, 62 usable, enough for the library computers.',
  how: ['Start with the prefix, for example /26.', 'Host bits = 32 minus prefix = 6.', 'Total addresses = 2 to the power 6 = 64.', 'Usable hosts = 64 minus 2 = 62.'],
  tryit: 'Use the calculator. Select 192.168.1.0/24 and 192.168.1.0/26 and compare. Then type your own.',
  mist: ['A bigger prefix number means a smaller network. /26 is smaller than /24.', 'The usable count is total minus 2 for normal subnets, because of the network and broadcast addresses. Cloud providers may reserve even more.'],
  rem: 'CIDR says how many bits identify the network. Total addresses = 2 to the host bits, and usable hosts are usually two fewer.',
  quick: TF('A /26 network is larger than a /24 network.', false, '/26 has 64 addresses. /24 has 256.'),
  viz: { t: 'subnet', instr: 'Press a preset or type a CIDR network and calculate. Read the binary display to see network and host bits.' },
  chal: {
    title: 'Subnet Math', intro: 'Practice counting hosts.', qs: [
      MT('Match each prefix with its number of usable IPv4 hosts (normal subnets).', [['/24', '254'], ['/26', '62'], ['/28', '14'], ['/30', '2']], 'Usable = 2 to the host bits minus 2.'),
      SC('A /24 network 192.168.1.0/24: what is the broadcast address?', '192.168.1.255', ['192.168.1.0', '192.168.1.254', '192.168.0.255'], 'The last address of the range is the broadcast address.', 'x')]
  },
  quiz: [
    Q('How many total addresses are in a /24 network?', '256', ['24', '254', '65536'], '8 host bits give 2 to the 8 = 256 addresses.'),
    Q('What is the subnet mask for /24?', '255.255.255.0', ['255.255.0.0', '255.0.0.0', '255.255.255.255'], 'The first 24 bits are network bits.', 'i'),
    Q('The network address of 192.168.1.77/26 is...', '192.168.1.64', ['192.168.1.0', '192.168.1.77', '192.168.1.128'], '/26 blocks start at 0, 64, 128 and 192. 77 is in the block starting at 64.', 'x')]
});
/* ---------- LEVEL 3 ---------- */
M('3.1', 'What Is a Server?', 'Computers that serve others', {
  obj: ['Explain the client and server relationship', 'Name web, application and database servers', 'Describe what a data center needs to run servers'],
  what: 'A <b>server</b> is a computer (or a program on it) that provides data or services to <b>clients</b>. A <b>physical server</b> is real hardware, often mounted in a <b>rack</b>. Common roles: a <b>web server</b> delivers web pages, an <b>application server</b> runs business logic, and a <b>database server</b> stores and searches data. A <b>data center</b> is a building full of servers with power, cooling and networking.',
  ana: 'A server is like a restaurant kitchen serving many customers. Analogy limit: a server can handle thousands of requests at once and works around the clock.',
  why: 'Cloud providers run enormous data centers. When you rent a cloud service, you rent a share of these servers without owning them.',
  ex: 'The college attendance system runs on servers: a web server shows the pages, an application server calculates attendance, and a database server stores every record.',
  how: ['Servers are installed in racks.', 'A switch connects the servers to the network.', 'Power supplies feed each rack, and cooling removes heat.', 'Storage systems keep the data.', 'Clients send requests and the servers answer.'],
  tryit: 'Add racks, servers, a switch, storage, cooling and power to build a working data center.',
  mist: ['A server is not always a huge machine. It is defined by its role, not its size.', 'The cloud is not magic. It still runs on physical servers in real buildings.'],
  rem: 'Servers answer client requests. Data centers provide power, cooling and networking so servers stay online.',
  quick: TF('A server is defined by what it does, not by how large it looks.', true, 'A server is any computer or program that serves clients.'),
  viz: { t: 'datacenter', instr: 'Use the buttons to build a room. Servers only work when their rack has power and cooling and the room has a switch.' },
  chal: {
    title: 'Server Roles', intro: 'Match the server to the job.', qs: [
      MT('Match each server type with its job.', [['Web server', 'Delivers web pages to browsers'], ['Application server', 'Runs the business logic of an application'], ['Database server', 'Stores and searches records']], 'Many systems use all three.'),
      SC('Scenario: a rack full of servers keeps shutting down after a few minutes. Which missing item is the most likely cause?', 'Cooling', ['A larger monitor', 'A keyboard', 'A second mouse'], 'Servers produce heat and need cooling to stay running.')]
  },
  quiz: [
    Q('What does a data center provide besides servers?', 'Power, cooling and networking', ['Only screens', 'Only software licenses', 'Only wall paint'], 'Physical infrastructure supports the digital service.'),
    Q('Which server stores student records?', 'Database server', ['Web server only', 'Print server only', 'Mouse server'], 'Databases store structured data.'),
    Q('A rack is...', 'A frame that holds servers and equipment', ['A type of CPU', 'A cloud region', 'A software update'], 'Racks organize servers in a data center.')]
});

M('3.2', 'How Websites Work', 'Browser, web server, application and database', {
  obj: ['Trace a request through a typical web architecture', 'Explain the role of each tier', 'Build a simple architecture'],
  what: 'Most websites have several parts. The <b>browser</b> asks for pages. The <b>web server</b> receives requests and serves files. The <b>application</b> runs the logic, such as checking a login. The <b>database</b> stores data such as users and orders. DNS finds the server first. This split into tiers makes systems easier to scale and secure.',
  ana: 'In a restaurant: the waiter (web server) takes your order, the chef (application) prepares it, and the pantry (database) holds the ingredients.',
  why: 'Cloud architectures are made of exactly these pieces, each placed on suitable cloud services.',
  ex: 'On an online shopping site, you search for a phone. The web server passes the search to the application, which queries the database for matching products and returns the list.',
  how: ['DNS turns the site name into an IP address.', 'The browser sends a request to the <b>web server</b>.', 'The web server hands dynamic work to the <b>application</b>.', 'The application reads or writes the <b>database</b>.', 'The result travels back to the browser.'],
  tryit: 'Connect Browser to Web Server, Web Server to Application, and Application to Database. Then send a request.',
  mist: ['The browser does not talk directly to the database in a well designed system. That would be unsafe.', 'A website is not one file. It is a system of cooperating parts.'],
  rem: 'A request flows from the browser to the web server, to the application and to the database, and the response flows back.',
  quick: TF('In a typical design, the browser talks directly to the database.', false, 'Requests pass through the web server and application first.'),
  viz: {
    t: 'connector', w: 720, h: 200, alt: 'Website architecture builder', instr: 'Click a component, then the next one, to connect them in order. Then send a request through your architecture.',
    nodes: [{ id: 'br', label: 'Browser', x: 80, y: 100, info: 'Shows pages to the user and sends requests.' }, { id: 'ws', label: 'Web server', x: 260, y: 100, info: 'Receives requests and serves pages and files.' }, { id: 'ap', label: 'Application', x: 450, y: 100, info: 'Runs the logic, such as checking passwords and calculating totals.' }, { id: 'db', label: 'Database', x: 630, y: 100, info: 'Stores and retrieves the data.' }],
    links: [['br', 'ws'], ['ws', 'ap'], ['ap', 'db']], path: ['br', 'ws', 'ap', 'db', 'ap', 'ws', 'br'], pktLabels: ['Request', 'Request', 'Query', 'Data', 'Response', 'Page'], okMsg: 'Architecture complete. Send a request through it.', sentMsg: 'The request reached the database and the page returned to the browser.'
  },
  chal: {
    title: 'Trace the Request', intro: 'Which part handles which job?', qs: [
      MT('Match each component with its role.', [['Browser', 'Displays the page to the user'], ['Web server', 'Receives requests and serves content'], ['Application', 'Runs the logic'], ['Database', 'Stores the data']], 'Each tier does one job.'),
      SC('Scenario: a student logs in and the page needs to check the password against stored records. Which part reads the stored records?', 'The database', ['The monitor', 'The router only', 'The keyboard'], 'The application asks the database for the record.')]
  },
  quiz: [
    Q('Which part stores user accounts?', 'Database', ['Browser', 'Monitor', 'Cable'], 'Databases persist data.'),
    Q('Which component receives the browser request first?', 'Web server', ['Database', 'Printer', 'Hard drive'], 'The web server is the front door.'),
    Q('Why split a website into tiers?', 'It is easier to scale, secure and manage each part', ['Websites cannot work otherwise', 'To make pages load slower', 'Because browsers demand it'], 'Separation of duties helps operations.', 'i')]
});

M('3.3', 'Virtualization', 'Many virtual computers on one physical one', {
  obj: ['Explain a hypervisor and a virtual machine', 'Allocate resources to VMs on a host', 'State benefits and limits of virtualization'],
  what: '<b>Virtualization</b> lets one physical server run several <b>virtual machines</b> (VMs). A <b>hypervisor</b> is software that shares the CPU, memory and storage of the <b>host</b> between VMs. Each VM has its own <b>guest operating system</b> and behaves like a separate computer. Benefits: better use of hardware and fast creation of machines. Limits: the host has finite capacity, and heavy VMs can affect each other if resources are poorly planned.',
  ana: 'A large apartment building split into separate flats. Analogy limit: VMs are software, so they can be copied, paused and moved.',
  why: 'Cloud computing is built on virtualization. A cloud virtual machine is a slice of a physical server shared securely with other customers.',
  ex: 'The college server room used to have one physical server per application. With virtualization, one powerful server hosts the attendance, library and exam portals as separate VMs.',
  how: ['The physical host has fixed CPU, RAM and storage.', 'The hypervisor divides them among VMs.', 'Each VM installs its own guest operating system.', 'If a VM stops, the others keep running (isolation).'],
  tryit: 'Create virtual machines with different sizes. Watch the host fill up and see what happens when it is full.',
  mist: ['VMs are not unlimited. The host capacity still limits how many you can run.', 'A VM is not a copy of the host operating system. It has its own guest OS.'],
  rem: 'Virtualization shares one physical server among isolated virtual machines using a hypervisor.',
  quick: TF('Each virtual machine has its own guest operating system.', true, 'That is what makes a VM behave like a separate computer.'),
  viz: { t: 'vmhost', instr: 'Set a size and create VMs. The host has 16 vCPU, 64 GB RAM and 500 GB storage. Create at least two.' },
  chal: {
    title: 'Virtualization Vocabulary', intro: 'Match the terms.', qs: [
      MT('Match each term with its meaning.', [['Hypervisor', 'Software that shares hardware between VMs'], ['Virtual machine', 'A software computer with its own operating system'], ['Host', 'The physical server running the VMs'], ['Guest OS', 'The operating system inside a VM']], 'These terms appear in all cloud VM services.'),
      SC('Scenario: a host has 16 vCPU and you already allocated 14. You try to create a VM needing 4 vCPU. What happens?', 'It is refused because the host lacks enough free capacity', ['It works with no limits', 'The host gains more CPUs', 'The VM runs without CPU'], 'Capacity is finite unless you use advanced overcommit settings.')]
  },
  quiz: [
    Q('What software creates and manages virtual machines?', 'A hypervisor', ['A browser', 'A spreadsheet', 'A DNS resolver'], 'The hypervisor shares hardware.'),
    Q('What is one main benefit of virtualization?', 'Better use of physical hardware', ['It removes the need for any hardware', 'It makes networks unnecessary', 'It makes all software free'], 'Several workloads share a server.'),
    Q('If one VM crashes, other VMs on the same host usually...', 'Keep running because of isolation', ['All crash instantly', 'Turn into containers', 'Lose their disks'], 'Isolation is a key property.', 'i')]
});

/* ---------- LEVEL 4 ---------- */
M('4.1', 'What Is Cloud Computing?', 'Renting computing over the internet', {
  obj: ['Define cloud computing', 'Compare on-premises and cloud infrastructure', 'Explain that cloud is not always cheaper'],
  what: '<b>Cloud computing</b> means using computing resources such as servers, storage, databases and networking over the internet, usually paying only for what you use. <b>On-premises</b> infrastructure is hardware you buy, house and maintain yourself. With the cloud, the provider owns and runs the physical data centers and you rent capacity. You can create, resize and delete resources in minutes.',
  ana: 'Owning a car versus using a taxi service. Analogy limit: cloud resources can be scaled up and down instantly.',
  why: 'Organizations use the cloud to start fast, grow or shrink with demand, reach users around the world and avoid buying hardware upfront. Trade-offs include ongoing costs and shared responsibility.',
  ex: 'A college could buy physical servers for its exam portal, which sit mostly idle except during exam weeks. In the cloud, it rents extra capacity only during the exams.',
  how: ['You choose the resources you need in a portal or with code.', 'The provider creates them on its physical data centers.', 'You use them over the internet.', 'You pay by usage and can change or delete them at any time.'],
  tryit: 'Buy a server, rent cloud resources, increase and reduce resources, and move the demand slider. Compare cost and flexibility.',
  mist: ['Cloud is not automatically cheaper. Costs depend on usage patterns and good management.', 'Your data still lives on physical servers. They are simply owned by the provider.'],
  rem: 'Cloud computing is on-demand computing over the internet with pay as you go pricing. It trades upfront hardware cost for flexibility and shared responsibility.',
  quick: TF('Cloud computing is always cheaper than owning servers.', false, 'It depends on the workload. Steady heavy use can be cheaper on owned hardware.'),
  viz: { t: 'costcompare', instr: 'Try all four buttons. Then change the demand slider and see how each model reacts. All money values are illustrative.' },
  chal: {
    title: 'Cloud or On-Premises?', intro: 'Choose sensibly, not automatically.', qs: [
      SC('Scenario: a start-up expects unpredictable traffic and has no money for hardware. Which approach fits best?', 'Rent cloud resources and scale as needed', ['Buy a large server room immediately', 'Wait until traffic is known', 'Use no computers'], 'The cloud avoids upfront cost and scales with demand.'),
      ID('Select every true statement about cloud computing.', [['Resources can be created in minutes', true], ['You usually pay based on usage', true], ['It is guaranteed to be cheaper in all cases', false], ['Physical servers no longer exist anywhere', false]], 'The cloud still runs on physical servers and is not always cheaper.')]
  },
  quiz: [
    Q('What does on-premises mean?', 'Infrastructure you own and run in your own location', ['Servers rented by the hour', 'Only websites', 'Only phones'], 'On-premises is owned and operated by the organization.'),
    Q('What is a major cloud benefit?', 'Fast provisioning and flexible scaling', ['No security tasks at all', 'Free forever', 'No internet needed'], 'Elasticity and speed are key.'),
    Q('Which cost model is common in the cloud?', 'Pay as you go', ['Buy everything upfront only', 'One payment for life', 'Free with no limits'], 'Usage based billing.', 'i')]
});

M('4.2', 'Cloud Service Models', 'IaaS, PaaS and SaaS', {
  obj: ['Define IaaS, PaaS and SaaS', 'See who manages each layer', 'Choose a model for a simple scenario'],
  what: 'Cloud services come in three main models. <b>IaaS</b> (Infrastructure as a Service) gives you virtual machines, storage and networks, and you manage the operating system and above. <b>PaaS</b> (Platform as a Service) gives you a ready platform: you deploy code and data while the provider manages servers, operating system and runtime. <b>SaaS</b> (Software as a Service) is a finished application you just use, such as web email.',
  ana: 'Pizza: IaaS is buying ingredients and using a rented kitchen. PaaS is a kitchen with a chef where you choose toppings. SaaS is ordering a finished pizza.',
  why: 'Choosing the right model decides how much work you do and how much control you keep.',
  ex: 'The college could run its own email on rented VMs (IaaS), host its custom website on a managed web platform (PaaS), or simply use a web based email service (SaaS).',
  how: ['List the layers from networking up to the application.', 'In IaaS the provider handles the bottom layers.', 'In PaaS the provider also handles operating system and runtime.', 'In SaaS the provider runs almost everything, but you are still responsible for your data and who has access.'],
  tryit: 'Switch between IaaS, PaaS and SaaS and watch the responsibility table change.',
  mist: ['SaaS does not mean you have no responsibility. You still control your data, users and permissions.', 'Exact splits vary by provider and service.'],
  rem: 'IaaS gives infrastructure, PaaS gives a platform for your code, SaaS gives a finished application. The higher the model, the more the provider manages.',
  quick: TF('In PaaS, you manage the physical servers.', false, 'The provider manages the physical servers in every cloud model.'),
  viz: {
    t: 'resp', instr: 'Select each model and read who manages each layer.', layers: ['Application', 'Data', 'Runtime', 'Middleware', 'Operating system', 'Virtualization', 'Servers', 'Storage', 'Networking'], caveat: 'Exact responsibilities vary by service and provider.',
    models: [{ name: 'IaaS', who: ['you', 'you', 'you', 'you', 'you', 'prov', 'prov', 'prov', 'prov'], note: 'You rent virtual machines, storage and networks and manage everything from the operating system upwards.' },
    { name: 'PaaS', who: ['you', 'you', 'prov', 'prov', 'prov', 'prov', 'prov', 'prov', 'prov'], note: 'You bring the application and data. The provider manages the operating system, runtime and infrastructure.' },
    { name: 'SaaS', who: ['prov', 'shared', 'prov', 'prov', 'prov', 'prov', 'prov', 'prov', 'prov'], note: 'The provider runs the application. You still control your data content and who may access it, so data is shared responsibility.' }]
  },
  chal: {
    title: 'Which Model?', intro: 'Match each situation with a model.', qs: [
      MT('Match each situation with the service model.', [['Renting a virtual machine and installing your own web server', 'IaaS'], ['Uploading code to a platform that manages the operating system for you', 'PaaS'], ['Using a web based email service', 'SaaS']], 'Ask: how much of the stack do I manage?'),
      SC('Scenario: a team wants to run a custom program on servers but does not want to patch the operating system. Which model fits best?', 'PaaS', ['IaaS', 'On-premises only', 'None of them'], 'PaaS manages the operating system and runtime for you.')]
  },
  quiz: [
    Q('In IaaS, who manages the guest operating system?', 'You do', ['The provider always', 'Nobody', 'The internet'], 'IaaS gives you the virtual machine, and you manage what runs on it.'),
    Q('Which is an example of SaaS?', 'A web based email service', ['A raw virtual machine', 'A rack of servers', 'A network cable'], 'You use the finished application.'),
    Q('Who always manages the physical servers in cloud models?', 'The cloud provider', ['The customer', 'The browser', 'The end user'], 'Physical infrastructure belongs to the provider.', 'i')]
});

M('4.3', 'Cloud Deployment Models', 'Public, private, hybrid and multicloud', {
  obj: ['Define the four deployment models', 'Match models to business needs', 'Explain that no model is best for everyone'],
  what: 'A <b>public cloud</b> is owned by a provider and shared by many customers over the internet. A <b>private cloud</b> is used by one organization, often in its own data center. A <b>hybrid cloud</b> combines private infrastructure and public cloud that work together. <b>Multicloud</b> means using more than one public cloud provider.',
  ana: 'Public transport, a private car, or using both depending on the trip. Analogy limit: hybrid clouds need careful connections between environments.',
  why: 'Rules, cost and risk differ for every organization, so they choose different models.',
  ex: 'A hospital keeps sensitive patient records in its private data center but hosts its public website and booking system in the public cloud. That is hybrid.',
  how: ['List what the business needs: control, cost, compliance, speed.', 'Compare how each model meets them.', 'Choose the best fit for each workload.'],
  tryit: 'Select each model and compare its qualities. Then solve the scenarios in the mini-game.',
  mist: ['Public does not mean everyone can see your data. Resources are isolated per customer.', 'Hybrid is not just using two clouds. It combines private and public.'],

  quick: TF('A hybrid cloud combines private infrastructure with public cloud.', true, 'That is the definition of hybrid.'),

      { name: 'Private cloud', blurb: 'Cloud style infrastructure used by a single organization, often on its own premises.', meters: { 'Control over hardware': 5, 'Speed of scaling': 2, 'Upfront cost': 5, 'Setup effort': 4 }, examples: ['Bank core systems', 'Government data'], best: 'strict control or regulation requires dedicated infrastructure.' },
      { name: 'Hybrid cloud', blurb: 'Private infrastructure connected to public cloud so workloads can use both.', meters: { 'Control over hardware': 3, 'Speed of scaling': 4, 'Upfront cost': 3, 'Setup effort': 4 }, examples: ['Hospital with public booking site'], best: 'some data must stay in house but other workloads benefit from the cloud.' },
      { name: 'Multicloud', blurb: 'Using services from more than one public cloud provider.', meters: { 'Control over hardware': 1, 'Speed of scaling': 5, 'Upfront cost': 1, 'Setup effort': 5 }, examples: ['Company avoiding dependence on one provider'], best: 'you need specific services from different providers or want to reduce dependence.' }]

  chal: {

      SC('Scenario: a company uses two different providers so it is not dependent on one. What is this called?', 'Multicloud', ['Private cloud', 'IaaS only', 'A LAN'], 'Multicloud uses several providers.')]
  },
  quiz: [

    Q('Public cloud resources are...', 'Owned by a provider and shared among customers in isolation', ['Visible to everyone', 'Free', 'Physically in your home'], 'Customers are isolated from each other.', 'i'),
    Q('Which model best avoids being tied to one provider?', 'Multicloud', ['Private cloud', 'A single public cloud only', 'On-premises only'], 'Multiple providers reduce dependence.')]
});

M('4.4', 'Regions and Availability Zones', 'Where cloud resources live', {
  obj: ['Define region and availability zone', 'Explain latency and geographic distribution', 'Tell high availability apart from disaster recovery'],
  what: 'A <b>region</b> is a geographic area with cloud data centers, such as Central India. An <b>availability zone</b> (called an availability domain in some clouds) is a separate location inside a region with its own power, cooling and networking. <b>Latency</b> is the delay in communication, and it grows with distance. <b>High availability</b> means the application keeps running when a component fails, for example by running copies in different zones. <b>Disaster recovery</b> is the ability to restore service after a major loss, such as losing a whole region.',
  ana: 'Branches of a bank: several branches in a city (zones) and different cities (regions). Analogy limit: cloud failover can be automatic and done in seconds.',
  why: 'Placing resources well improves speed for users and keeps the application online when something fails.',
  ex: 'The online exam portal runs copies in two zones of one region. If one zone loses power, students keep taking exams from the other.',
  how: ['Choose a region near your users for lower latency.', 'Spread instances across zones for high availability.', 'For disaster recovery, keep backups or standby copies in another region.', 'Test what happens when something fails.'],
  tryit: 'Place application copies in zones, then fail a zone or a whole region and watch the website.',
  mist: ['High availability is not disaster recovery. HA handles small failures fast. DR handles big disasters, often with more downtime or data loss.', 'Two copies in the same zone still fail together if that zone fails.'],
  rem: 'Regions are areas, zones are separate sites inside a region. Use zones for high availability and other regions for disaster recovery.',
  quick: TF('Two copies of an app in the same availability zone protect against the loss of that zone.', false, 'Both fail together if the zone fails.'),
  viz: {
    t: 'azsim', regionFail: true, latency: true, dr: 'High availability spreads copies across zones. Disaster recovery restores service after a bigger loss. They are different goals.', instr: 'Place app copies in zones, then use the fail buttons. Website stays online only if a healthy copy remains.',
    regions: [{ name: 'Region A (near your users)', note: 'Three zones', zones: ['Zone 1', 'Zone 2', 'Zone 3'] }, { name: 'Region B (far away)', note: 'Two zones', zones: ['Zone 1', 'Zone 2'] }]
  },
  chal: {
    title: 'Regions and Zones', intro: 'Test your understanding of resilience.', qs: [
      MT('Match each term with its meaning.', [['Region', 'A geographic area containing cloud data centers'], ['Availability zone', 'A separate location inside a region'], ['Latency', 'The delay in communication'], ['Disaster recovery', 'Restoring service after a major loss']], 'Keep availability and disaster recovery separate in your mind.'),
      SC('Scenario: a power failure hits one zone. Copies of the app run in three zones. What is the likely result?', 'The app stays online using the other zones', ['The app is lost forever', 'The region disappears', 'All zones fail automatically'], 'This is high availability at work.')]
  },
  quiz: [
    Q('What is latency?', 'The delay in communication between systems', ['The size of a disk', 'The price of a VM', 'A cloud region'], 'Distance increases latency.'),
    Q('Which design improves availability inside one region?', 'Run copies in multiple availability zones', ['Put everything in one zone', 'Use one big server', 'Turn off monitoring'], 'Zones fail independently.'),
    Q('Which is mainly a disaster recovery step?', 'Keeping backups or standby resources in another region', ['Using a single zone', 'Adding a monitor', 'Renaming a server'], 'DR protects against large scale loss.', 'x')]
});

M('5.1', 'Virtual Machines in the Cloud', 'Launching your first cloud VM', {
  obj: ['Describe a cloud VM, image and size', 'Launch, stop and start a simulated VM', 'Explain what is billed while a VM is stopped'],
  what: 'A <b>cloud virtual machine</b> is a VM you create on a provider\'s infrastructure. You choose an <b>image</b> (a template that includes an operating system), a <b>size</b> (called an instance type, shape or SKU) that sets CPU and memory, and a <b>boot disk</b>. The running VM is called an <b>instance</b>. You can start and stop it, and you can delete it when it is no longer needed.',
  ana: 'Choosing a rental car: the model is the size, the color options are the image, and you can return it when done. Analogy limit: a VM can be created in minutes.',
  why: 'VMs are the most flexible cloud building block. Many workloads begin as a VM.',
  ex: 'A student club launches a small VM to host a website for a hackathon and deletes it afterwards.',
  how: ['Pick a name and an image.', 'Pick a size for CPU and memory.', 'Set the boot disk size.', 'The provider finds capacity, builds the VM and starts it.', 'You connect to it and use it.'],
  tryit: 'Configure a fictional VM and launch it. Then stop and start it. Nothing real is created.',
  mist: ['A stopped VM may still cost money for its disk. Delete resources you no longer need.', 'A bigger size is not always better. Oversized VMs waste money.'],
  rem: 'A cloud VM needs an image, a size and a disk. Compute is usually billed while it runs, and storage is billed while it exists.',
  quick: TF('An image is a template that includes an operating system.', true, 'You pick an image to define what the VM starts with.'),
  viz: { t: 'cloudvm', instr: 'Complete the form and launch the VM. Try stopping and starting it.' },
  chal: {
    title: 'Launch Checklist', intro: 'Know your VM vocabulary.', qs: [
      MT('Match each VM setting with its purpose.', [['Image', 'Template with the operating system'], ['Size', 'Sets the CPU and memory'], ['Boot disk', 'Storage holding the operating system'], ['Instance', 'The running virtual machine']], 'These four choices appear in every cloud.'),
      SC('Scenario: a small blog gets few visitors. Which size is the best starting choice?', 'A small size, with the option to resize later', ['The largest available size', 'No VM', 'Ten large VMs'], 'Start small and scale when needed to avoid paying for idle capacity.')]
  },
  quiz: [
    Q('What defines the CPU and memory of a cloud VM?', 'Its size or instance type', ['Its name', 'The boot disk label', 'The DNS server'], 'Sizes bundle CPU and memory.'),
    Q('What is stored on the boot disk?', 'The operating system and files', ['The monitor', 'The router table', 'The DNS answer'], 'The VM boots from this disk.'),
    Q('You stop a VM. What usually keeps costing money?', 'Its disk storage', ['Nothing at all ever', 'The keyboard', 'The internet itself'], 'Stopped VMs typically stop compute charges but disks remain.', 'i')]
});

M('5.2', 'Containers and Serverless', 'Lighter ways to run code', {
  obj: ['Explain what a container is', 'Compare VM, container and serverless', 'Recognise event driven execution'],
  what: 'A <b>container</b> packages an application with the files it needs and shares the host operating system kernel, so it is lighter and starts faster than a VM. <b>Serverless</b> computing lets you run small pieces of code, called functions, without managing servers. The platform runs the code when an <b>event</b> happens, such as a file upload, and you pay for execution time. Servers still exist, but you do not manage them.',
  ana: 'A VM is a whole house, a container is an apartment sharing the building plumbing, and serverless is a hotel room you use only when you visit.',
  why: 'Different workloads suit different models. Choosing well saves money and effort.',
  ex: 'A photo site runs a serverless function each time a student uploads a picture, to create a thumbnail. No server sits idle waiting.',
  how: ['VM: you manage a full operating system.', 'Container: you manage the app package, while a platform runs the containers.', 'Serverless: you provide code and the platform runs it when triggered.'],
  tryit: 'Select VM, Container and Serverless and compare their trade-offs.',
  mist: ['Serverless does not mean no servers. It means you do not manage them.', 'Containers do not replace VMs everywhere. Containers often run on VMs.'],
  rem: 'VMs give maximum control, containers are lightweight and portable, serverless runs code on events with almost no server management.',
  quick: TF('Serverless means there are no servers at all.', false, 'Servers exist, but the provider manages them.'),
  viz: {
    t: 'compare', instr: 'Compare the three compute models.', exLabel: 'Typical uses', note: 'Each model trades control for convenience.',
    options: [
      { name: 'Virtual machine', blurb: 'A full computer with its own operating system.', meters: { 'Management effort': 5, 'Startup speed': 2, 'Control': 5, 'Cost when idle': 4 }, examples: ['Legacy application', 'Custom software'], best: 'you need full control of the operating system.' },
      { name: 'Container', blurb: 'A lightweight package of an application and its dependencies sharing the host kernel.', meters: { 'Management effort': 3, 'Startup speed': 4, 'Control': 3, 'Cost when idle': 3 }, examples: ['Microservices', 'Portable apps'], best: 'you want consistent, portable deployments and fast startup.' },
      { name: 'Serverless function', blurb: 'Small code that runs in response to events, fully managed by the platform.', meters: { 'Management effort': 1, 'Startup speed': 4, 'Control': 1, 'Cost when idle': 1 }, examples: ['Thumbnail creation', 'Scheduled cleanup'], best: 'the work is event driven, short and irregular.' }]
  },
  chal: {
    title: 'Choose Your Compute Model', intro: 'Pick the best fit.', qs: [
      SC('Scenario: run a small task only when a file is uploaded, a few times a day. Best fit?', 'Serverless function', ['A large VM running all day', 'A rack of servers', 'A private data center'], 'Pay only when the code runs.'),
      SC('Scenario: an old application needs a specific operating system configuration and full control. Best fit?', 'Virtual machine', ['Serverless function', 'Browser cache', 'A router'], 'VMs give complete control of the operating system.'),
      SC('Scenario: a team wants identical, portable packages that start in seconds. Best fit?', 'Container', ['Paper documents', 'A DNS record', 'A switch'], 'Containers are lightweight and portable.')]
  },
  quiz: [
    Q('What do containers share with the host?', 'The operating system kernel', ['A full guest operating system each', 'Their monitors', 'Nothing at all'], 'That makes them lighter than VMs.'),
    Q('What triggers a serverless function?', 'An event such as an upload or a timer', ['A power cable', 'A mouse click on a router', 'Nothing, it always runs'], 'Event driven execution.'),
    Q('Which model gives the most control?', 'Virtual machine', ['Serverless function', 'SaaS application', 'None'], 'You manage the whole OS.', 'i')]
});
